<body>
    <div id="root">
        <div class="loading">
            <div class="loading-content">
                <div className="loading-spinner">🏎️</div>
                <h2 style="font-size: 2rem; font-weight: bold; margin-top: 20px;">Carregando dados...</h2>
            </div>
        </div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TyreDegradationChart = () => {
            const [data, setData] = useState({ pilotos: [], sessao: {} });
            const [isLoading, setIsLoading] = useState(true);
            const [selectedDrivers, setSelectedDrivers] = useState([]);
            const [maxStints, setMaxStints] = useState(3);
            const [viewMode, setViewMode] = useState('grid');
            const [compareDrivers, setCompareDrivers] = useState([]);

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const sessaoId = urlParams.get('sessao');

                    const stintsUrl     = sessaoId ? `/dados_stints/${sessaoId}` : '/dados_stints_ultimo';
                    const voltasUrl     = sessaoId ? `/dados_voltas/${sessaoId}` : '/dados_voltas';
                    const danosUrl      = sessaoId ? `/api/danos_carro/${sessaoId}` : null;
                    const danosVoltaUrl = sessaoId ? `/api/danos_por_volta/${sessaoId}` : null;
                    const pvUrl         = sessaoId
                        ? `/api/pneu_por_volta/${sessaoId}`
                        : '/api/pneu_por_volta_ultimo';
                    const bandUrl       = sessaoId ? `/api/bandeiras/${sessaoId}` : null;

                    const urls = [stintsUrl, voltasUrl];
                    if (danosUrl)      urls.push(danosUrl);
                    if (pvUrl)         urls.push(pvUrl);
                    if (bandUrl)       urls.push(bandUrl);
                    if (danosVoltaUrl) urls.push(danosVoltaUrl);

                    const responses = await Promise.allSettled(urls.map(u => fetch(u)));

                    const _json = async (i, fallback) => {
                        try {
                            const r = responses[i];
                            if (r.status === 'fulfilled' && r.value.ok) {
                                return await r.value.json();
                            }
                        } catch (e) { console.warn('fetch fail idx', i, e); }
                        return fallback;
                    };

                    let idx = 0;
                    const stintsData     = await _json(idx++, { pilotos: [], sessao: {} });
                    const voltasData     = await _json(idx++, { pilotos: [], sessao: {} });
                    const danosData      = danosUrl      ? await _json(idx++, { pilotos: [] }) : { pilotos: [] };
                    const pvData         = pvUrl         ? await _json(idx++, { pilotos: [] }) : { pilotos: [] };
                    const bandData       = bandUrl       ? await _json(idx++, { bandeiras: [] }) : { bandeiras: [] };
                    const danosVoltaData = danosVoltaUrl ? await _json(idx++, { pilotos: [] }) : { pilotos: [] };

                    const danosPorNome = {};
                    (danosData.pilotos || []).forEach(p => { danosPorNome[p.nome] = p.danos || {}; });

                    const pvPorNome = {};
                    (pvData.pilotos || []).forEach(p => { pvPorNome[p.nome] = p.voltas || []; });

                    const danosVoltaPorNome = {};
                    (danosVoltaData.pilotos || []).forEach(p => {
                        danosVoltaPorNome[p.nome] = p.voltas || [];
                    });

                    const bandeiras = bandData.bandeiras || [];

                    const pilotos = processData(
                        stintsData, voltasData,
                        danosPorNome, pvPorNome, bandeiras,
                        danosVoltaPorNome
                    );

                    setData({
                        pilotos: pilotos,
                        sessao: stintsData.sessao || voltasData.sessao || {},
                        pv: pvData,
                    });

                    const sortedPilotos = [...pilotos].sort((a, b) => (a.posicao || 99) - (b.posicao || 99));
                    const top8 = sortedPilotos.slice(0, 8).map(p => p.nome);
                    setSelectedDrivers(top8);

                    const max = Math.max(...pilotos.map(p => p.stints?.length || 0), 1);
                    setMaxStints(Math.min(max, 5));

                } catch (error) {
                    console.error('Erro:', error);
                } finally {
                    setIsLoading(false);
                }
            };

            const removeOutliersPairs = (pairs) => {
                if (pairs.length < 4) return pairs;
                const values = pairs.map(p => p.tempo);
                const sorted = [...values].sort((a, b) => a - b);
                const median = sorted[Math.floor(sorted.length / 2)];
                const deviations = values.map(x => Math.abs(x - median));
                deviations.sort((a, b) => a - b);
                const mad = deviations[Math.floor(deviations.length / 2)];
                if (mad === 0) return pairs;
                const factor = 2.5;
                const lower = median - factor * mad;
                const upper = median + factor * mad;
                return pairs.filter(p => p.tempo >= lower && p.tempo <= upper);
            };

            const processData = (stintsData, voltasData, danosPorNome = {}, pvPorNome = {}, bandeiras = [], danosVoltaPorNome = {}) => {
                const pilotosStints = stintsData.pilotos || [];
                const pilotosVoltas = voltasData.pilotos || voltasData || [];

                const voltasPorPiloto = {};
                (Array.isArray(pilotosVoltas) ? pilotosVoltas : []).forEach(p => {
                    voltasPorPiloto[p.nome] = p.voltas || [];
                });

                const voltaEmBandeira = (numVolta) =>
                    bandeiras.some(b =>
                        b.tipo && b.tipo !== 'Verde' && b.tipo !== 'Nenhuma' &&
                        numVolta >= (b.volta_inicio || 0) &&
                        numVolta <= (b.volta_fim || b.volta_inicio || 0)
                    );

                return pilotosStints.map(piloto => {
                    const voltas = voltasPorPiloto[piloto.nome] || [];
                    const stints = piloto.stints || [];
                    const pvDoPiloto = pvPorNome[piloto.nome] || [];

                    const danoMap = {};
                    (danosVoltaPorNome[piloto.nome] || []).forEach(d => {
                        danoMap[d.numero_volta] = d;
                    });

                    const stintsValidos = stints.filter(s =>
                        s.tipo_pneu &&
                        s.tipo_pneu.trim() !== '' &&
                        s.tipo_pneu.toUpperCase() !== 'DESCONHECIDO'
                    );

                    const maxVoltaPiloto = voltas.length > 0
                        ? Math.max(...voltas.map(v => Number(v.numero_volta) || 0))
                        : 0;

                    const maxVoltaPv = pvDoPiloto.length > 0
                        ? Math.max(...pvDoPiloto.map(v => Number(v.numero_volta) || 0))
                        : 0;

                    const maxVolta = Math.max(maxVoltaPiloto, maxVoltaPv);

                    const stintsOrdenados = [...stintsValidos].sort(
                        (a, b) => (a.stint_numero || 0) - (b.stint_numero || 0)
                    );

                    const ultimoStintIdx = stintsOrdenados.length - 1;

                    const stintsComTempos = stintsOrdenados.map((stint, sIdx) => {
                        const isUltimo = (sIdx === ultimoStintIdx);

                        // 🆕 Se é o PRIMEIRO stint do piloto e começa depois da V1,
                        //    estica visualmente pra V1 (o parser pode ter acordado tarde)
                        const isPrimeiro = (sIdx === 0);
                        const _voltaInicio = (isPrimeiro && (stint.volta_inicio || 1) > 1)
                            ? 1
                            : (stint.volta_inicio || 1);

                        const voltaFimEfetiva = (isUltimo && maxVolta > (stint.volta_fim || 0))
                            ? maxVolta
                            : (stint.volta_fim || _voltaInicio || 0);

                        // ✅ USA _voltaInicio em TODOS os lugares
                        const totalVoltasEfetivo = Math.max(
                            1,
                            voltaFimEfetiva - _voltaInicio + 1
                        );

                        const pvDoStint = pvDoPiloto.filter(v =>
                            v.numero_volta >= _voltaInicio &&
                            v.numero_volta <= voltaFimEfetiva
                        );

                        const voltasDoStint = voltas.filter(v => {
                            const numVolta = v.numero_volta;
                            return numVolta >= _voltaInicio && numVolta <= voltaFimEfetiva;
                        });

                        let voltasUteis = voltasDoStint;
                        if (voltasDoStint.length >= 6) {
                            voltasUteis = voltasDoStint.slice(1, -1);
                        }

                        const isShortStint = voltasDoStint.length <= 3;
                        const minT = isShortStint ? 0    : 30;
                        const maxT = isShortStint ? 9999 : 300;

                        let pairs = voltasUteis
                            .filter(v => isShortStint || !voltaEmBandeira(v.numero_volta))
                            .map(v => ({ tempo: v.tempo_total, numVolta: v.numero_volta }))
                            .filter(t => t.tempo != null && t.tempo > minT && t.tempo < maxT);

                        if (pairs.length >= 4) {
                            pairs = removeOutliersPairs(pairs);
                            if (pairs.length >= 5) pairs = removeOutliersPairs(pairs);
                        }

                        const tempos      = pairs.map(p => p.tempo);
                        const temposVoltas = pairs.map(p => p.numVolta);

                        const n = tempos.length;
                        const avgTime = n > 0 ? tempos.reduce((a, b) => a + b, 0) / n : 0;
                        const bestTime = n > 0 ? Math.min(...tempos) : 0;
                        const worstTime = n > 0 ? Math.max(...tempos) : 0;

                        let deltaPerLap = 0;
                        let rSquared = 0;

                        if (n >= 4) {
                            const regression = linearRegression(tempos);
                            deltaPerLap = regression.slope;
                            rSquared = regression.rSquared;
                        }

                        const variance = n > 1
                            ? tempos.reduce((sum, t) => sum + (t - avgTime) ** 2, 0) / (n - 1)
                            : 0;
                        const stdDev = Math.sqrt(variance);
                        const cvPct = avgTime > 0 ? (stdDev / avgTime) * 100 : 0;
                        const consistency = Math.max(0, Math.min(100, 100 - cvPct));

                        const desgastes = voltasDoStint
                            .map(v => v.desgaste_pneu)
                            .filter(d => d !== undefined && d !== null && d > 0);

                        let wearRate = 0;
                        if (desgastes.length >= 2) {
                            wearRate = (desgastes[desgastes.length - 1] - desgastes[0]) / desgastes.length;
                        }

                        const desgIni     = Number(stint.desgaste_medio_inicio) || 0;
                        const desgFim     = Number(stint.desgaste_medio_fim)    || 0;
                        const desgPorVol  = Number(stint.desgaste_por_volta)    || 0;
                        const desgIniArr  = stint.desgaste_inicio || [0, 0, 0, 0];
                        const desgFimArr  = stint.desgaste_fim    || [0, 0, 0, 0];

                        // DANO POR VOLTA — usa _voltaInicio
                        const danoLaps = [];
                        for (let lap = _voltaInicio; lap <= voltaFimEfetiva; lap++) {
                            const d = danoMap[lap];
                            if (!d) continue;

                            const asaE = Number(d.asa_esquerda) || 0;
                            const asaD = Number(d.asa_direita)  || 0;
                            const asaT = Number(d.asa_traseira) || 0;
                            const assoalho = Number(d.assoalho) || 0;
                            const difusor  = Number(d.difusor)  || 0;
                            const sidepods = Number(d.sidepods) || 0;

                            const asaTotal = asaE + asaD + asaT;
                            const total = (asaE + asaD) * 0.35
                                        + asaT * 0.15
                                        + assoalho * 0.2
                                        + difusor * 0.15
                                        + sidepods * 0.15;

                            danoLaps.push({
                                numVolta: lap,
                                asa_esquerda: asaE,
                                asa_direita:  asaD,
                                asa_traseira: asaT,
                                assoalho, difusor, sidepods,
                                asaTotal,
                                total: Math.round(total * 10) / 10,
                                temDanoAsa: asaTotal > 5,
                            });
                        }

                        const danoMaxStint = danoLaps.length > 0
                            ? Math.max(...danoLaps.map(d => d.total))
                            : 0;
                        const temDanoAsaNoStint = danoLaps.some(d => d.temDanoAsa);
                        const temDanoNoStint    = danoMaxStint > 1;

                        const ultimoDanoLap = danoLaps.length > 0
                            ? danoLaps[danoLaps.length - 1]
                            : null;

                        // SC / VSC — usa _voltaInicio
                        const _scRanges = [];
                        let _currentSC = null;

                        for (let _lap = _voltaInicio; _lap <= voltaFimEfetiva; _lap++) {
                            const _b = bandeiras.find(b => {
                                const _t = (b.tipo || '').toUpperCase().trim();
                                const _isSC =
                                    _t === 'SC' || _t === 'VSC' ||
                                    _t.includes('SAFETY') ||
                                    _t.includes('VIRTUAL') ||
                                    _t === 'SAFETYCAR' || _t === 'VIRTUALSAFETYCAR';
                                if (!_isSC) return false;
                                const _i = b.volta_inicio || 0;
                                const _f = b.volta_fim || b.volta_inicio || 0;
                                return _lap >= _i && _lap <= _f;
                            });

                            const _isVSC = _b && /vsc|virtual/i.test(_b.tipo || '');
                            const _tipo = _isVSC ? 'VSC' : 'SC';

                            if (_b && !_currentSC) {
                                _currentSC = { ini: _lap, fim: _lap, tipo: _tipo };
                            } else if (_b && _currentSC && _currentSC.tipo === _tipo) {
                                _currentSC.fim = _lap;
                            } else if (_b && _currentSC && _currentSC.tipo !== _tipo) {
                                _scRanges.push(_currentSC);
                                _currentSC = { ini: _lap, fim: _lap, tipo: _tipo };
                            } else if (!_b && _currentSC) {
                                _scRanges.push(_currentSC);
                                _currentSC = null;
                            }
                        }
                        if (_currentSC) _scRanges.push(_currentSC);

                        return {
                            ...stint,
                            volta_inicio: _voltaInicio,   // ✅ sempre
                            volta_fim: voltaFimEfetiva,
                            total_voltas: totalVoltasEfetivo,
                            tempos,
                            temposVoltas,
                            avgTime,
                            bestTime,
                            worstTime,
                            deltaPerLap,
                            rSquared,
                            stdDev,
                            cvPct,
                            consistency,
                            wearRate,
                            desgasteJogoIni:    desgIni,
                            desgasteJogoFim:    desgFim,
                            desgasteJogoPorVolta: desgPorVol,
                            desgasteJogoIniArr: desgIniArr,
                            desgasteJogoFimArr: desgFimArr,
                            pvPorVolta: pvDoStint,

                            _danoPorVolta:   danoLaps,
                            _danoMax:        danoMaxStint,
                            _temDano:        temDanoNoStint,
                            _temDanoAsa:     temDanoAsaNoStint,
                            _ultimoDanoLap:  ultimoDanoLap,

                            _scRanges:       _scRanges,
                        };
                    });

                    const danos = danosPorNome[piloto.nome] || {};

                    return {
                        ...piloto,
                        stints: stintsComTempos,
                        posicao: piloto.posicao || piloto.position || 99,
                        danos
                    };
                })
                .filter(p => p.stints && p.stints.length > 0)
                .sort((a, b) => (a.posicao || 99) - (b.posicao || 99));
            };

            const linearRegression = (y) => {
                const n = y.length;
                const x = Array.from({ length: n }, (_, i) => i);

                const xMean = x.reduce((a, b) => a + b, 0) / n;
                const yMean = y.reduce((a, b) => a + b, 0) / n;

                let numerator = 0;
                let denominator = 0;

                for (let i = 0; i < n; i++) {
                    numerator += (x[i] - xMean) * (y[i] - yMean);
                    denominator += (x[i] - xMean) ** 2;
                }

                const slope = denominator !== 0 ? numerator / denominator : 0;
                const intercept = yMean - slope * xMean;

                let ssRes = 0;
                let ssTot = 0;

                for (let i = 0; i < n; i++) {
                    const predicted = intercept + slope * x[i];
                    ssRes += (y[i] - predicted) ** 2;
                    ssTot += (y[i] - yMean) ** 2;
                }

                const rSquared = ssTot !== 0 ? 1 - (ssRes / ssTot) : 0;

                return { slope, intercept, rSquared };
            };

            const formatTime = (seconds) => {
                if (!seconds || seconds <= 0) return '--:--.---';
                const mins = Math.floor(seconds / 60);
                const secs = (seconds % 60).toFixed(3);
                return `${mins}:${secs.padStart(6, '0')}`;
            };

            const getTyreColor = (compound) => {
                if (!compound) return { bg: '#9E9E9E', light: '#BDBDBD' };

                const c = compound.toUpperCase().trim()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                if (c.includes('SUPER')) return { bg: '#FF00FF', light: '#FF66FF' };
                if (c.includes('SOFT') || c.includes('MACIO')) return { bg: '#E10600', light: '#FF4444' };
                if (c.includes('MEDIUM') || c.includes('MEDIO')) return { bg: '#FFC906', light: '#FFE066' };
                if (c.includes('HARD') || c.includes('DURO')) return { bg: '#EBEBEB', light: '#FFFFFF', border: '#666666' };
                if (c.includes('INTER')) return { bg: '#43B02A', light: '#7ED957' };
                if (c.includes('WET') || c.includes('MOLHADO') || c.includes('CHUVA')) return { bg: '#0072C6', light: '#4AA8FF' };

                return { bg: '#9E9E9E', light: '#BDBDBD' };
            };

            const getTyreClass = (compound) => {
                if (!compound) return 'tyre-medium';

                const c = compound.toUpperCase().trim()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                if (c.includes('SUPER')) return 'tyre-supersoft';
                if (c.includes('SOFT') || c.includes('MACIO')) return 'tyre-soft';
                if (c.includes('MEDIUM') || c.includes('MEDIO')) return 'tyre-medium';
                if (c.includes('HARD') || c.includes('DURO')) return 'tyre-hard';
                if (c.includes('INTER')) return 'tyre-inter';
                if (c.includes('WET') || c.includes('MOLHADO') || c.includes('CHUVA')) return 'tyre-wet';

                return 'tyre-medium';
            };

            const toggleDriverSelection = (driverName) => {
                setSelectedDrivers(prev => {
                    if (prev.includes(driverName)) return prev.filter(n => n !== driverName);
                    return [...prev, driverName];
                });
            };

            const toggleCompareDriver = (driverName) => {
                setCompareDrivers(prev => {
                    if (prev.includes(driverName)) return prev.filter(n => n !== driverName);
                    if (prev.length < 2) return [...prev, driverName];
                    return [prev[1], driverName];
                });
            };

            const getComparisonStats = () => {
                if (compareDrivers.length !== 2) return null;

                const driver1 = data.pilotos.find(p => p.nome === compareDrivers[0]);
                const driver2 = data.pilotos.find(p => p.nome === compareDrivers[1]);

                if (!driver1 || !driver2) return null;

                const avgTime1 = driver1.stints.reduce((sum, s) => sum + (s.avgTime || 0), 0) / (driver1.stints.length || 1);
                const avgTime2 = driver2.stints.reduce((sum, s) => sum + (s.avgTime || 0), 0) / (driver2.stints.length || 1);

                const avgDelta1 = driver1.stints.reduce((sum, s) => sum + (s.deltaPerLap || 0), 0) / (driver1.stints.length || 1);
                const avgDelta2 = driver2.stints.reduce((sum, s) => sum + (s.deltaPerLap || 0), 0) / (driver2.stints.length || 1);

                const consistency1 = driver1.stints.reduce((sum, s) => sum + (s.consistency || 0), 0) / (driver1.stints.length || 1);
                const consistency2 = driver2.stints.reduce((sum, s) => sum + (s.consistency || 0), 0) / (driver2.stints.length || 1);

                const desg1 = driver1.stints.map(s => s.desgasteJogoPorVolta || 0).filter(v => v > 0);
                const desg2 = driver2.stints.map(s => s.desgasteJogoPorVolta || 0).filter(v => v > 0);
                const avgDesg1 = desg1.length ? desg1.reduce((a, b) => a + b, 0) / desg1.length : 0;
                const avgDesg2 = desg2.length ? desg2.reduce((a, b) => a + b, 0) / desg2.length : 0;

                return {
                    timeDiff: avgTime1 - avgTime2,
                    fasterDriver: avgTime1 < avgTime2 ? driver1.nome : driver2.nome,
                    deltaDiff: avgDelta1 - avgDelta2,
                    betterDegradation: avgDelta1 < avgDelta2 ? driver1.nome : driver2.nome,
                    consistencyDiff: consistency1 - consistency2,
                    moreConsistent: consistency1 > consistency2 ? driver1.nome : driver2.nome,
                    desgDiff: avgDesg1 - avgDesg2,
                    betterDesgDriver: avgDesg1 < avgDesg2 ? driver1.nome : driver2.nome,
                    avgDesg1, avgDesg2,
                };
            };

            const MiniChart = ({ stint, isFastestInStint = false }) => {
                const canvasRef = useRef(null);
                const pointsRef = useRef([]);
                const chartMetricsRef = useRef({ paddingLeft: 5, paddingTop: 24, chartWidth: 0, chartHeight: 0 });
                const [hover, setHover] = useState(null);
                const tyreColor = getTyreColor(stint.tipo_pneu);

                const pv = stint.pvPorVolta || [];
                const temPv = pv.length >= 2;

                const temDano = stint._temDano || false;
                const temDanoAsa = stint._temDanoAsa || false;
                const danoMax = stint._danoMax || 0;
                const ultimoDanoLap = stint._ultimoDanoLap || null;

                useEffect(() => {
                    if (!canvasRef.current || !stint.tempos || stint.tempos.length === 0) return;

                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');

                    const dpr = window.devicePixelRatio || 1;
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                    ctx.scale(dpr, dpr);

                    const width = rect.width;
                    const height = rect.height;

                    ctx.clearRect(0, 0, width, height);

                    const tempos = stint.tempos;
                    if (tempos.length === 0) return;

                    const singlePoint = tempos.length === 1;
                    let minTime = Math.min(...tempos) - 0.5;
                    let maxTime = Math.max(...tempos) + 0.5;

                    if (singlePoint) {
                        minTime = tempos[0] - 1;
                        maxTime = tempos[0] + 1;
                    }

                    const timeRange = maxTime - minTime || 1;

                    const padding = { top: 24, right: 10, bottom: 25, left: 5 };
                    const chartWidth  = width  - padding.left - padding.right;
                    const chartHeight = height - padding.top  - padding.bottom;

                    chartMetricsRef.current = {
                        paddingLeft: padding.left,
                        paddingTop:  padding.top,
                        chartWidth:  chartWidth,
                        chartHeight: chartHeight,
                    };

                    const avgTime = stint.avgTime;
                    const stdDev  = stint.stdDev || 0.5;

                    const yTop    = padding.top + ((maxTime - (avgTime + stdDev * 1.5)) / timeRange) * chartHeight;
                    const yBottom = padding.top + ((maxTime - (avgTime - stdDev * 1.5)) / timeRange) * chartHeight;

                    ctx.fillStyle = tyreColor.bg + '20';
                    ctx.beginPath();
                    ctx.moveTo(padding.left, yTop);
                    ctx.lineTo(padding.left + chartWidth, yTop);
                    ctx.lineTo(padding.left + chartWidth, yBottom);
                    ctx.lineTo(padding.left, yBottom);
                    ctx.closePath();
                    ctx.fill();

                    const _scRangesDraw = stint._scRanges || [];
                    const _stIni = stint.volta_inicio || 1;
                    const _stFim = stint.volta_fim || _stIni;
                    const _stLapCount = Math.max(_stFim - _stIni + 1, 1);

                    const _scBandPositions = [];

                    _scRangesDraw.forEach(r => {
                        const rIni = Math.max(r.ini, _stIni);
                        const rFim = Math.min(r.fim, _stFim);
                        if (rFim < rIni) return;

                        const xIni = padding.left + ((rIni - _stIni) / _stLapCount) * chartWidth;
                        const xFim = padding.left + ((rFim - _stIni + 1) / _stLapCount) * chartWidth;

                        ctx.fillStyle = r.tipo === 'VSC'
                            ? 'rgba(255, 200, 0, 0.10)'
                            : 'rgba(255, 200, 0, 0.18)';
                        ctx.fillRect(xIni, padding.top, xFim - xIni, chartHeight);

                        ctx.strokeStyle = '#ffd400';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([3, 2]);
                        ctx.beginPath();
                        ctx.moveTo(xIni, padding.top);
                        ctx.lineTo(xFim, padding.top);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        _scBandPositions.push({
                            xIni, xFim,
                            centerX: (xIni + xFim) / 2,
                            tipo: r.tipo,
                        });
                    });

                    if (tempos.length >= 2) {
                        const startY = stint.avgTime - stint.deltaPerLap * (tempos.length / 2);
                        const endY   = stint.avgTime + stint.deltaPerLap * (tempos.length / 2);
                        const y1 = padding.top + ((maxTime - startY) / timeRange) * chartHeight;
                        const y2 = padding.top + ((maxTime - endY)   / timeRange) * chartHeight;

                        ctx.beginPath();
                        ctx.moveTo(padding.left, y1);
                        ctx.lineTo(padding.left + chartWidth, y2);
                        ctx.strokeStyle = tyreColor.bg;
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    }

                    pointsRef.current = [];

                    const danoMapStint = {};
                    (stint._danoPorVolta || []).forEach(d => {
                        danoMapStint[d.numVolta] = d;
                    });

                    const temposVoltas = stint.temposVoltas || [];

                    tempos.forEach((tempo, i) => {
                        const x = singlePoint
                            ? padding.left + chartWidth / 2
                            : padding.left + (i / (tempos.length - 1)) * chartWidth;
                        const y = padding.top + ((maxTime - tempo) / timeRange) * chartHeight;

                        pointsRef.current.push({ x, y, tempo, idx: i });

                        ctx.beginPath();
                        ctx.arc(x, y + 1, 5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, Math.PI * 2);
                        ctx.fillStyle = tyreColor.bg;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        const numVolta = temposVoltas[i];
                        const danoNaVolta = numVolta != null ? danoMapStint[numVolta] : null;

                        if (danoNaVolta && danoNaVolta.temDanoAsa) {
                            const iconY = y - 11;
                            const iconTop = iconY - 5;
                            const iconBottom = iconY + 4;

                            ctx.beginPath();
                            ctx.moveTo(x, iconTop);
                            ctx.lineTo(x - 5, iconBottom);
                            ctx.lineTo(x + 5, iconBottom);
                            ctx.closePath();
                            ctx.fillStyle = '#e10600';
                            ctx.fill();
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 1;
                            ctx.stroke();

                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 8px Titillium Web, Arial, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('!', x, iconY + 1);
                        }
                    });

                    _scBandPositions.forEach(b => {
                        const isVSC = b.tipo === 'VSC';
                        const iconY = padding.top - 9;

                        ctx.beginPath();
                        ctx.arc(b.centerX, iconY, 9, 0, Math.PI * 2);
                        ctx.fillStyle = isVSC ? '#ffd400' : '#ff8c00';
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        ctx.fillStyle = isVSC ? '#000' : '#fff';
                        ctx.font = 'bold 8px Titillium Web, Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(isVSC ? 'VSC' : 'SC', b.centerX, iconY + 1);
                    });

                    if (pv.length >= 2) {
                        const degColor = '#ff8c00';

                        ctx.beginPath();
                        ctx.strokeStyle = degColor;
                        ctx.lineWidth = 2;
                        ctx.globalAlpha = 0.9;

                        pv.forEach((v, i) => {
                            const x = padding.left + (i / Math.max(pv.length - 1, 1)) * chartWidth;
                            const deg = Math.max(0, Math.min(100, Number(v.desgaste_medio) || 0));
                            const y = padding.top + ((100 - deg) / 100) * chartHeight;

                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        });
                        ctx.stroke();

                        pv.forEach((v, i) => {
                            const x = padding.left + (i / Math.max(pv.length - 1, 1)) * chartWidth;
                            const deg = Math.max(0, Math.min(100, Number(v.desgaste_medio) || 0));
                            const y = padding.top + ((100 - deg) / 100) * chartHeight;

                            ctx.beginPath();
                            ctx.arc(x, y + 0.5, 3.5, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(0,0,0,0.2)';
                            ctx.fill();

                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fillStyle = degColor;
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(0,0,0,0.55)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        });

                        ctx.globalAlpha = 1;

                        ctx.fillStyle = degColor;
                        ctx.font = 'bold 9px Titillium Web';
                        ctx.textAlign = 'right';
                        ctx.fillText('🔥 DESGASTE', padding.left + chartWidth - 2, padding.top + 10);

                        ctx.fillStyle = 'rgba(255,140,0,0.55)';
                        ctx.font = 'bold 8px Titillium Web';
                        ctx.textAlign = 'left';
                        ctx.fillText('100%', padding.left + chartWidth + 1, padding.top + 8);
                        ctx.fillText('0%',   padding.left + chartWidth + 1, padding.top + chartHeight);
                    }

                    ctx.fillStyle = '#666';
                    ctx.font = '10px Titillium Web';
                    ctx.textAlign = 'center';
                    // ✅ labels com números reais das voltas
                    const _tv = stint.temposVoltas || [];
                    const _iniLbl = _tv.length > 0 ? String(_tv[0]) : String(stint.volta_inicio || 1);
                    const _fimLbl = _tv.length > 0 ? String(_tv[_tv.length - 1]) : String(tempos.length);
                    ctx.fillText(_iniLbl, padding.left, height - 8);
                    ctx.fillText(_fimLbl, padding.left + chartWidth, height - 8);

                }, [stint, tyreColor.bg, pv]);

                if (!stint.tempos || stint.tempos.length === 0) {
                    return <div className="empty-cell">—</div>;
                }

                const handleMouseMove = (e) => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;

                    let nearest = null;
                    let minDist = 15;
                    for (const p of pointsRef.current) {
                        const d = Math.hypot(p.x - mx, p.y - my);
                        if (d < minDist) {
                            minDist = d;
                            nearest = p;
                        }
                    }

                    if (nearest) {
                        setHover(prev =>
                            prev?.kind === 'ponto' && prev?.idx === nearest.idx
                                ? prev
                                : { kind: 'ponto', ...nearest }
                        );
                        return;
                    }

                    const { paddingLeft, paddingTop, chartWidth, chartHeight } = chartMetricsRef.current;
                    const stIni = stint.volta_inicio || 1;
                    const stFim = stint.volta_fim || stIni;
                    const stLapCount = Math.max(stFim - stIni + 1, 1);

                    const scUnder = (stint._scRanges || []).find(r => {
                        const rIni = Math.max(r.ini, stIni);
                        const rFim = Math.min(r.fim, stFim);
                        if (rFim < rIni) return false;

                        const xIni = paddingLeft + ((rIni - stIni) / stLapCount) * chartWidth;
                        const xFim = paddingLeft + ((rFim - stIni + 1) / stLapCount) * chartWidth;

                        return mx >= xIni && mx <= xFim &&
                               my >= paddingTop && my <= paddingTop + chartHeight;
                    });

                    if (scUnder) {
                        setHover(prev => {
                            if (prev?.kind === 'sc' &&
                                prev?.scIni === scUnder.ini &&
                                prev?.scFim === scUnder.fim) {
                                return { ...prev, x: mx, y: my };
                            }
                            return {
                                kind: 'sc',
                                scTipo: scUnder.tipo,
                                scIni: scUnder.ini,
                                scFim: scUnder.fim,
                                x: mx,
                                y: my,
                            };
                        });
                        return;
                    }

                    setHover(null);
                };
                const handleMouseLeave = () => setHover(null);

                const deltaClass = stint.deltaPerLap > 0.02 ? 'positive' : stint.deltaPerLap < -0.02 ? 'negative' : 'neutral';

                const deltaSLap = stint.deltaPerLap.toFixed(3);
                const deltaSign = stint.deltaPerLap >= 0 ? '+' : '';

                const pvIni = pv.length > 0 ? (Number(pv[0].desgaste_medio) || 0) : 0;
                const pvFim = pv.length > 0 ? (Number(pv[pv.length - 1].desgaste_medio) || 0) : 0;

                const numLaps = stint.tempos?.length || 0;

                const nivelDano = danoMax >= 67 ? 'vermelho' : danoMax >= 34 ? 'amarelo' : 'verde';
                const corDano = nivelDano === 'vermelho' ? '#e10600'
                              : nivelDano === 'amarelo'  ? '#f59e0b'
                              : '#22c55e';

                const partesDanadas = [];
                if (ultimoDanoLap) {
                    if (ultimoDanoLap.asa_esquerda > 5) partesDanadas.push(`Asa E: ${ultimoDanoLap.asa_esquerda.toFixed(0)}%`);
                    if (ultimoDanoLap.asa_direita  > 5) partesDanadas.push(`Asa D: ${ultimoDanoLap.asa_direita.toFixed(0)}%`);
                    if (ultimoDanoLap.asa_traseira > 5) partesDanadas.push(`Asa T: ${ultimoDanoLap.asa_traseira.toFixed(0)}%`);
                    if (ultimoDanoLap.assoalho     > 5) partesDanadas.push(`Assoalho: ${ultimoDanoLap.assoalho.toFixed(0)}%`);
                    if (ultimoDanoLap.difusor      > 5) partesDanadas.push(`Difusor: ${ultimoDanoLap.difusor.toFixed(0)}%`);
                    if (ultimoDanoLap.sidepods     > 5) partesDanadas.push(`Sidepod: ${ultimoDanoLap.sidepods.toFixed(0)}%`);
                }

                return (
                    <div className="chart-cell">
                        {isFastestInStint && (
                            <div
                                title={`Piloto mais rápido do stint (avg ${formatTime(stint.avgTime)})`}
                                style={{
                                    position: 'absolute', top: '6px', right: '8px',
                                    fontSize: '18px', lineHeight: 1,
                                    filter: 'drop-shadow(0 0 6px rgba(255,212,0,.9))',
                                    zIndex: 15, pointerEvents: 'none',
                                }}
                            >
                                🏆
                            </div>
                        )}

                        <div className="stats">
                            <div style={{ display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap' }}>
                                <span className="avg">Avg: {formatTime(stint.avgTime)}</span>

                                {numLaps >= 1 && numLaps <= 3 && (
                                    <span
                                        className="short-stint-badge-inline"
                                        title={numLaps === 1 ? 'Stint de apenas 1 volta' : `Stint curto (${numLaps} voltas)`}
                                    >
                                        {numLaps === 1 ? '1 VOLTA' : `${numLaps} VOLTAS`}
                                    </span>
                                )}
                            </div>

                            <div className={`delta ${deltaClass}`}>
                                Δ/volta: {deltaSign}{deltaSLap}s
                            </div>
                            <div className="extra">
                                Best: {formatTime(stint.bestTime)} | R²: {(stint.rSquared * 100).toFixed(0)}%
                            </div>

                            <div className="extra">
                                Laps: {stint.tempos?.length}
                                {stint.volta_inicio != null && stint.volta_fim != null && (
                                    <span style={{color:'#8a8db0',fontWeight:600,marginLeft:'4px'}}>
                                        (V{stint.volta_inicio}→V{stint.volta_fim})
                                    </span>
                                )}
                                {' '}| Cons: {stint.consistency.toFixed(0)}%
                                <span style={{color:'#aaa',fontWeight:400,marginLeft:'3px'}}>
                                    (CV±{stint.cvPct?.toFixed(1) ?? '0.0'}%)
                                </span>
                            </div>

                            {temPv && (
                                <div className="extra" style={{ color: '#ff8c00', fontWeight: 700 }}>
                                    🟠 Desgaste: {pvIni.toFixed(0)}% → {pvFim.toFixed(0)}%
                                    <span style={{ color:'#888', fontWeight:400, marginLeft:'4px' }}>
                                        ({pv.length} laps)
                                    </span>
                                </div>
                            )}
                            {stint.desgasteJogoPorVolta > 0 && (
                                <div className="extra" style={{ color: '#ffd400', fontWeight: 700 }}>
                                    🔥 Jogo: {stint.desgasteJogoPorVolta.toFixed(2)}%/volta
                                    <span style={{ color:'#888', fontWeight:400, marginLeft:'4px' }}>
                                        (avg)
                                    </span>
                                </div>
                            )}

                            {temDano && (
                                <div
                                    title={partesDanadas.length ? partesDanadas.join(' | ') : `Dano máx no stint: ${danoMax.toFixed(0)}%`}
                                    style={{
                                        display:'inline-flex', alignItems:'center', gap:'4px',
                                        marginTop:'3px', padding:'2px 6px', borderRadius:'4px',
                                        background: corDano + '20', border: `1px solid ${corDano}`,
                                        fontSize:'10px', fontWeight:700, color: corDano, cursor:'help'
                                    }}>
                                    🔧 {temDanoAsa ? 'Dano asa' : 'Dano'} {danoMax.toFixed(0)}%
                                </div>
                            )}
                        </div>

                        <div style={{ position: 'relative', flex: 1, minHeight: '100px' }}>
                            <canvas
                                ref={canvasRef}
                                style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
                                onMouseMove={handleMouseMove}
                                onMouseLeave={handleMouseLeave}
                            />
                            {hover && (
                                <div
                                    style={{
                                        position: 'absolute',
                                        left: hover.x,
                                        top: Math.max(0, (hover.y || 0) - (hover.kind === 'sc' ? 34 : 32)),
                                        transform: 'translateX(-50%)',
                                        background: hover.kind === 'sc'
                                            ? (hover.scTipo === 'VSC' ? 'rgba(255,212,0,0.95)' : 'rgba(255,140,0,0.95)')
                                            : 'rgba(0,0,0,0.92)',
                                        color: hover.kind === 'sc'
                                            ? (hover.scTipo === 'VSC' ? '#000' : '#fff')
                                            : '#fff',
                                        padding: '4px 10px',
                                        borderRadius: '4px',
                                        fontSize: '11px',
                                        fontWeight: 700,
                                        whiteSpace: 'nowrap',
                                        pointerEvents: 'none',
                                        zIndex: 20,
                                        border: hover.kind === 'sc'
                                            ? '1px solid #fff'
                                            : `1px solid ${tyreColor.bg}`,
                                        boxShadow: '0 2px 8px rgba(0,0,0,.5)',
                                    }}
                                >
                                    {hover.kind === 'sc'
                                        ? `${hover.scTipo === 'VSC' ? '🟡 VSC' : '🚨 SC'} · Volta ${hover.scIni}${hover.scFim !== hover.scIni ? ` → ${hover.scFim}` : ''}`
                                        : `V${(stint.temposVoltas && stint.temposVoltas[hover.idx]) || ((stint.volta_inicio || 1) + hover.idx)} · ${formatTime(hover.tempo)}`
                                    }
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ComparisonView = () => {
                const stats = getComparisonStats();
                const driver1Data = data.pilotos.find(p => p.nome === compareDrivers[0]);
                const driver2Data = data.pilotos.find(p => p.nome === compareDrivers[1]);

                if (compareDrivers.length !== 2 || !driver1Data || !driver2Data) {
                    return (
                        <div className="comparison-panel">
                            <h3>🏁 Modo Comparação</h3>
                            <p style={{ color: '#aaa', marginBottom: '15px' }}>
                                Selecione 2 pilotos para comparar
                            </p>
                            <div className="driver-selector">
                                {data.pilotos.map(driver => (
                                    <div
                                        key={driver.nome}
                                        className={`driver-chip ${compareDrivers.includes(driver.nome) ? 'selected' : 'unselected'}`}
                                        onClick={() => toggleCompareDriver(driver.nome)}
                                    >
                                        <span className="position">P{driver.posicao}</span>
                                        {driver.nome}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return (
                    <div>
                        <div className="comparison-panel">
                            <h3>🏁 Comparação: {driver1Data.nome} vs {driver2Data.nome}</h3>

                            <div className="driver-selector">
                                {data.pilotos.map(driver => (
                                    <div
                                        key={driver.nome}
                                        className={`driver-chip ${compareDrivers.includes(driver.nome) ? 'selected' : 'unselected'}`}
                                        onClick={() => toggleCompareDriver(driver.nome)}
                                    >
                                        <span className="position">P{driver.posicao}</span>
                                        {driver.nome}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <StintComparison driver1={driver1Data} driver2={driver2Data} />
                        <div className="comparison-grid" style={{ position: 'relative' }}>
                            <div className="vs-badge">VS</div>

                            {[driver1Data, driver2Data].map((driver, idx) => (
                                <div key={driver.nome} className="comparison-card">
                                    <div className="card-header">
                                        <div
                                            className={getTyreClass(driver.stints?.[0]?.tipo_pneu)}
                                            style={{ width: '28px', height: '28px', borderRadius: '50%' }}
                                        ></div>
                                        <div className="driver-name">{driver.nome}</div>
                                        <div className="position">P{driver.posicao}</div>
                                    </div>
                                    <div className="card-body">
                                        {driver.stints.map((stint, stintIdx) => (
                                            <div key={stintIdx} className="stint-row">
                                                <div className="stint-number">Stint {stintIdx + 1}</div>
                                                <div className="stint-info">
                                                    <div
                                                        className="tyre-badge"
                                                        style={{
                                                            background: getTyreColor(stint.tipo_pneu).bg,
                                                            color: stint.tipo_pneu?.toLowerCase().includes('hard') ? '#333' : 'white'
                                                        }}
                                                    >
                                                        <div
                                                            className={getTyreClass(stint.tipo_pneu)}
                                                            style={{ width: '12px', height: '12px', borderRadius: '50%' }}
                                                        ></div>
                                                        {stint.tipo_pneu}
                                                    </div>
                                                    <div className="stint-stats">
                                                        <span>Avg: <strong>{formatTime(stint.avgTime)}</strong></span>
                                                        <span>Δ/volta: <strong style={{ color: stint.deltaPerLap > 0 ? '#e10600' : '#00d27f' }}>
                                                            {stint.deltaPerLap >= 0 ? '+' : ''}{stint.deltaPerLap.toFixed(3)}s
                                                        </strong></span>
                                                        <span>Laps: <strong>{stint.tempos?.length || 0}</strong></span>
                                                        <span style={{fontSize:'10px',color:'#888'}}>Cons: {stint.consistency.toFixed(0)}% (CV±{(stint.cvPct||0).toFixed(1)}%)</span>
                                                        {stint.desgasteJogoPorVolta > 0 && (
                                                            <span style={{fontSize:'10px',color:'#ffd400',fontWeight:700}}>
                                                                🔥 Jogo: {stint.desgasteJogoPorVolta.toFixed(2)}%/v
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {(() => {
                                            const d = driver.danos || {};
                                            const tot = d.total || 0;
                                            if (tot < 1) return null;
