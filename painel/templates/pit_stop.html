<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyre Degradation Trend - F1 Style</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap');
        
        * { font-family: 'Titillium Web', sans-serif; box-sizing: border-box; }
        
        body { background: #e8e8e8; margin: 0; padding: 20px; min-height: 100vh; }
        
        .main-container { max-width: 1800px; margin: 0 auto; }
        
        .header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
            padding-bottom: 15px; border-bottom: 3px solid #e10600;
        }
        .header .lap-badge {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #1a1d2e 0%, #252840 100%);
            border: 1px solid #3a3d5c; padding: 6px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 700; letter-spacing: 1px;
            color: #e8eaf6; text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .header .lap-badge .num { font-size: 20px; font-weight: 900; color: #ffd400; line-height: 1; }
        .header .lap-badge .icon { font-size: 16px; }
        .header h1 {
            font-size: 32px; font-weight: 900; color: #15151e; margin: 0;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .header .flag { font-size: 28px; }
        .header .subtitle { font-size: 20px; color: #38383f; font-weight: 400; font-style: italic; }
        
        .controls {
            display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
            background: #fff; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls select {
            padding: 10px 15px; font-size: 14px; border: 2px solid #ddd;
            border-radius: 6px; background: white; cursor: pointer; font-weight: 600; min-width: 180px;
        }
        .controls select:focus { border-color: #e10600; outline: none; }
        .controls button {
            padding: 10px 20px; font-size: 14px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 700; text-transform: uppercase; transition: all 0.2s;
        }
        
        .btn-primary { background: linear-gradient(135deg, #e10600 0%, #ff1e1e 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(225, 6, 0, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #15151e 0%, #38383f 100%); color: white; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(21, 21, 30, 0.4); }
        .btn-outline { background: white; color: #15151e; border: 2px solid #15151e; }
        .btn-outline:hover { background: #15151e; color: white; }
        .btn-compare { background: linear-gradient(135deg, #6b21a8 0%, #9333ea 100%); color: white; }
        .btn-compare:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4); }
        
        .comparison-panel {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3d 100%);
            border-radius: 12px; padding: 20px; margin-bottom: 20px; color: white;
        }
        .comparison-panel h3 { margin: 0 0 15px 0; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .driver-selector { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .driver-chip {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
            display: flex; align-items: center; gap: 8px;
        }
        .driver-chip.unselected { background: #3d3d4d; color: #aaa; }
        .driver-chip.selected { background: #e10600; color: white; border-color: #ff4444; }
        .driver-chip:hover { transform: scale(1.05); }
        .driver-chip .position { background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        
        .comparison-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;
        }
        .stat-card { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card .label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 24px; font-weight: 900; margin: 5px 0; }
        .stat-card .driver { font-size: 12px; color: #e10600; }
        .stat-card .value.green { color: #00d27f; }
        .stat-card .value.red { color: #e10600; }
        .stat-card .value.yellow { color: #FFC906; }
        
        .grid-container {
            display: grid; gap: 1px; background: #ccc; border-radius: 8px;
            overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .stint-label {
            background: linear-gradient(135deg, #4a6fa5 0%, #6b8cbe 100%);
            color: white; font-weight: 800; font-size: 18px; padding: 15px 20px;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase; letter-spacing: 1px; min-height: 180px;
        }
        
        .driver-header {
            background: linear-gradient(180deg, #1e1e2e 0%, #2d2d3d 100%);
            color: white; text-align: center; padding: 12px 8px; min-height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        }
        .driver-header .driver-name { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .driver-header .driver-position { font-size: 11px; color: #aaa; font-weight: 600; }
        
        .chart-cell {
            background: #fafafa; padding: 12px; position: relative; min-height: 180px;
            display: flex; flex-direction: column;
        }
        .chart-cell .stats { font-size: 11px; color: #15151e; line-height: 1.6; margin-bottom: 8px; z-index: 10; }
        .chart-cell .stats .avg { font-weight: 700; color: #15151e; }
        .chart-cell .stats .delta { font-weight: 600; }
        .chart-cell .stats .delta.positive { color: #e10600; }
        .chart-cell .stats .delta.negative { color: #00d27f; }
        .chart-cell .stats .delta.neutral { color: #666; }
        .chart-cell .stats .extra { font-size: 10px; color: #888; }
        .chart-cell canvas { flex: 1; width: 100% !important; height: auto !important; min-height: 100px; }
        
        .empty-cell {
            background: #f0f0f0; min-height: 180px; display: flex;
            align-items: center; justify-content: center; color: #ccc; font-size: 20px;
        }
        .corner-cell { background: #e8e8e8; }
        
        .x-axis-label {
            text-align: center; padding: 15px; color: #38383f; font-weight: 700;
            font-size: 16px; text-transform: uppercase; letter-spacing: 2px;
            background: white; margin-top: -1px; border-radius: 0 0 8px 8px;
        }
        
        .legend {
            display: flex; justify-content: center; gap: 50px; margin-top: 25px;
            padding: 20px 30px; background: white; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-wrap: wrap;
        }
        .legend-section { display: flex; gap: 25px; align-items: center; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #38383f; }
        .legend-line { width: 35px; height: 3px; border-radius: 2px; }
        .legend-line.solid { background: #15151e; }
        
        .tyre-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .tyre-supersoft { background: linear-gradient(135deg, #FF00FF 0%, #FF66FF 100%); }
        .tyre-soft { background: linear-gradient(135deg, #E10600 0%, #FF4444 100%); }
        .tyre-medium { background: linear-gradient(135deg, #FFC906 0%, #FFE066 100%); }
        .tyre-hard { background: linear-gradient(135deg, #EBEBEB 0%, #FFFFFF 100%); border: 2px solid #666; }
        .tyre-inter { background: linear-gradient(135deg, #43B02A 0%, #7ED957 100%); }
        .tyre-wet { background: linear-gradient(135deg, #0072C6 0%, #4AA8FF 100%); }
        
        .loading {
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
            background: linear-gradient(135deg, #15151e 0%, #1e1e2e 50%, #e10600 100%);
        }
        .loading-content { text-align: center; color: white; }
        .loading-spinner { font-size: 5rem; animation: spin 1.5s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .no-data {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; background: white; border-radius: 12px;
            padding: 60px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .no-data h2 { font-size: 28px; color: #15151e; margin-bottom: 15px; }
        .no-data p { color: #666; font-size: 16px; margin-bottom: 25px; }
        
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .comparison-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .comparison-card .card-header {
            background: linear-gradient(180deg, #1e1e2e 0%, #2d2d3d 100%);
            color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px;
        }
        .comparison-card .card-header .driver-name { font-weight: 700; font-size: 18px; text-transform: uppercase; }
        .comparison-card .card-header .position { background: #e10600; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; }
        .comparison-card .card-body { padding: 20px; }
        .comparison-card .stint-row { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .comparison-card .stint-row:last-child { border-bottom: none; }
        .comparison-card .stint-number { font-weight: 800; font-size: 14px; color: #4a6fa5; min-width: 60px; }
        .comparison-card .stint-info { flex: 1; }
        .comparison-card .stint-info .tyre-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 5px;
        }
        .comparison-card .stint-stats { display: flex; gap: 20px; font-size: 12px; flex-wrap: wrap; }
        .comparison-card .stint-stats span { color: #666; }
        .comparison-card .stint-stats strong { color: #15151e; }
        
        .vs-badge {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: #e10600; color: white; font-weight: 900; font-size: 24px;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(225, 6, 0, 0.4); z-index: 10;
        }

        /* DARK THEME */
        body { background: #0a0c18 !important; color: #e8eaf6; }
        .header h1 { color: #e8eaf6; }
        .header .subtitle { color: #8a8db0; }
        .controls { background: #0d0f1c !important; border:1px solid #1a1d2e; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
        .controls select { background:#0a0c18 !important; color:#e8eaf6 !important; border-color:#252840 !important; }
        .controls button.btn-outline { background:#0d0f1c !important; color:#e8eaf6 !important; border-color:#252840 !important; }
        .controls button.btn-outline:hover { background:#1a1d2e !important; color:#fff !important; }
        .comparison-panel { background:linear-gradient(135deg,#0d0f1c 0%,#151829 100%) !important; border:1px solid #1a1d2e; }
        .driver-chip.unselected { background:#1a1d2e !important; color:#8a8db0 !important; }
        .stat-card { background:rgba(255,255,255,0.04) !important; }
        .grid-container { background:#1a1d2e !important; }
        .corner-cell { background:#0a0c18 !important; }
        .stint-label { background:linear-gradient(135deg,#1e2a44 0%,#2d3d5c 100%) !important; color:#e8eaf6 !important; }
        .driver-header { background:linear-gradient(180deg,#0d0f1c 0%,#151829 100%) !important; color:#e8eaf6 !important; }
        .driver-header .driver-position { color:#8a8db0 !important; }
        .chart-cell { background:#0d0f1c !important; border:1px solid #1a1d2e; }
        .chart-cell .stats { color:#8a8db0 !important; }
        .chart-cell .stats .avg { color:#e8eaf6 !important; }
        .chart-cell .stats .extra { color:#5a5d78 !important; }
        .empty-cell { background:#0a0c18 !important; color:#252840 !important; }
        .x-axis-label { background:#0d0f1c !important; color:#8a8db0 !important; }
        .legend { background:#0d0f1c !important; border:1px solid #1a1d2e; }
        .legend-item { color:#8a8db0 !important; }
        .no-data { background:#0d0f1c !important; }
        .no-data h2 { color:#e8eaf6 !important; }
        .no-data p { color:#8a8db0 !important; }
        .comparison-card { background:#0d0f1c !important; }
        .comparison-card .card-header { background:linear-gradient(180deg,#0d0f1c 0%,#151829 100%) !important; }
        .comparison-card .stint-row { border-bottom-color:#1a1d2e !important; }
        .comparison-card .stint-stats span { color:#8a8db0 !important; }
        .comparison-card .stint-stats strong { color:#e8eaf6 !important; }
        .comparison-card .stint-number { color:#64c4ff !important; }

        /* PIT STOPS TIMELINE */
        .timeline-wrap { background:#0a0c18; border:1px solid #1a1d2e; border-radius:10px; padding:24px; }
        .timeline-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid #1a1d2e; margin-bottom:20px; }
        .timeline-header-title { font-family:'Titillium Web',sans-serif; font-size:22px; font-weight:900; color:#fff; letter-spacing:2px; }
        .timeline-header-title .track { color:#e10600; }
        .timeline-total { text-align:right; }
        .timeline-total .lbl { font-size:10px; letter-spacing:2px; color:#8a8db0; text-transform:uppercase; }
        .timeline-total .val { font-family:'Titillium Web',sans-serif; font-size:44px; font-weight:900; color:#e10600; line-height:1; }

        .timeline-rows { display:flex; flex-direction:column; gap:6px; }
        .timeline-row { display:grid; grid-template-columns: 120px 1fr 70px; align-items:center; gap:14px; padding:6px 0; }
        .timeline-row:hover { background:rgba(255,255,255,0.02); border-radius:4px; }
        .timeline-driver { font-size:13px; font-weight:800; color:#e8eaf6; letter-spacing:.5px; text-transform:uppercase; text-align:right; padding-right:8px; }
        .timeline-driver.win { color:#ffd400; }

        .timeline-bar { position:relative; height:26px; background:#111420; border-radius:2px; overflow:hidden; border:1px solid #1a1d2e; }
        .timeline-stint { position:absolute; top:0; height:100%; }
        .timeline-stint.SS { background:linear-gradient(180deg,#c04cff,#8000b8); }
        .timeline-stint.S  { background:linear-gradient(180deg,#ff2d2d,#a00000); }
        .timeline-stint.M  { background:linear-gradient(180deg,#ffd400,#b89800); }
        .timeline-stint.H  { background:linear-gradient(180deg,#f0f0f0,#a0a0a0); }
        .timeline-stint.I  { background:linear-gradient(180deg,#43B02A,#1c5c12); }
        .timeline-stint.W  { background:linear-gradient(180deg,#0072C6,#003a66); }

        .timeline-pit { position:absolute; top:-2px; bottom:-2px; width:2px; background:#ffd400; z-index:5; box-shadow:0 0 6px rgba(255,212,0,.8); }
        .timeline-pit-lap { position:absolute; top:-18px; font-family:'Titillium Web',sans-serif; font-size:10px; font-weight:800; color:#ffd400; transform:translateX(-50%); white-space:nowrap; }

        .timeline-count { font-family:'Titillium Web',sans-serif; font-size:20px; font-weight:900; color:#fff; text-align:center; }
        .timeline-count.zero { color:#5a5d78; }

        .timeline-axis { display:grid; grid-template-columns:120px 1fr 70px; gap:14px; margin-top:16px; padding-top:14px; border-top:1px solid #1a1d2e; }
        .timeline-axis-track { display:flex; justify-content:space-between; font-size:11px; color:#5a5d78; font-family:'Titillium Web',sans-serif; font-weight:700; letter-spacing:1px; }

        .compounds-legend { display:flex; gap:20px; justify-content:center; margin-top:20px; padding-top:16px; border-top:1px solid #1a1d2e; flex-wrap:wrap; }
        .compound-item { display:flex; align-items:center; gap:8px; font-size:11px; color:#8a8db0; letter-spacing:.5px; text-transform:uppercase; font-weight:700; }
        .compound-dot { width:14px; height:14px; border-radius:3px; }
        .compound-dot.SS { background:#c04cff; }
        .compound-dot.S  { background:#ff2d2d; }
        .compound-dot.M  { background:#ffd400; }
        .compound-dot.H  { background:#f0f0f0; }
        .compound-dot.I  { background:#43B02A; }
        .compound-dot.W  { background:#0072C6; }

        .compounds-section { margin-bottom: 28px; }
        .compounds-title {
          font-family:'Titillium Web',sans-serif; font-size:14px; font-weight:900;
          color:#e8eaf6; letter-spacing:3px; text-transform:uppercase;
          margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #1a1d2e;
          display:flex; align-items:center; gap:12px;
        }
        .compounds-title .sub { font-size:10px; color:#5a5d78; font-weight:600; letter-spacing:1px; }
        .compounds-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }

        .compound-card {
          position:relative; border-radius:8px; overflow:hidden;
          border:1px solid #1a1d2e; background:#0d0f1c; cursor:pointer; transition: all .2s;
        }
        .compound-card:hover { transform: translateY(-2px); border-color:#252840; }
        .compound-card.active { border-color:#fff; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
        .compound-card-top { height:4px; width:100%; }
        .compound-card-top.SS { background:#c04cff; }
        .compound-card-top.S  { background:#ff2d2d; }
        .compound-card-top.M  { background:#ffd400; }
        .compound-card-top.H  { background:#f0f0f0; }
        .compound-card-top.I  { background:#43B02A; }
        .compound-card-top.W  { background:#0072C6; }
        .compound-card-body { padding:14px 16px; }
        .compound-card-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
        .compound-card-name { font-size:11px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; color:#8a8db0; }
        .compound-card-name strong { color:#e8eaf6; }
        .compound-card-laps { text-align:right; }
        .compound-card-laps .num { font-family:'Titillium Web',sans-serif; font-size:26px; font-weight:900; color:#fff; line-height:1; }
        .compound-card-laps .lbl { font-size:9px; letter-spacing:1.5px; color:#5a5d78; text-transform:uppercase; margin-top:2px; }
        .compound-card-bar { height:6px; background:#111420; border-radius:3px; overflow:hidden; margin-bottom:12px; }
        .compound-card-bar-fill { height:100%; border-radius:3px; }
        .compound-card-foot { display:flex; justify-content:space-between; align-items:center; font-size:10px; color:#8a8db0; }
        .compound-card-foot .pct { font-family:'Titillium Web',sans-serif; font-weight:900; font-size:14px; color:#e8eaf6; }
        .compound-card-foot .driver { display:flex; align-items:center; gap:5px; color:#5a5d78; font-weight:700; letter-spacing:.5px; }
        .compound-card-foot .driver strong { color:#e8eaf6; }

        .compound-detail { margin-top:12px; padding:14px 16px; background:#0a0c18; border:1px solid #1a1d2e; border-radius:8px; }
        .compound-detail-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid #1a1d2e; }
        .compound-detail-title { font-family:'Titillium Web',sans-serif; font-size:14px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
        .compound-detail-close { background:transparent; border:1px solid #252840; color:#8a8db0; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:1px; transition: all .15s; }
        .compound-detail-close:hover { border-color:#e10600; color:#e10600; }
        .compound-detail-table { width:100%; border-collapse:collapse; font-size:12px; }
        .compound-detail-table th { text-align:left; padding:6px 10px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#5a5d78; border-bottom:1px solid #1a1d2e; font-weight:700; }
        .compound-detail-table th:not(:first-child) { text-align:right; }
        .compound-detail-table td { padding:8px 10px; border-bottom:1px solid #0f1220; font-size:12px; color:#e8eaf6; }
        .compound-detail-table td:not(:first-child) { text-align:right; font-family:'Titillium Web',monospace; }
        .compound-detail-table tr:hover td { background:rgba(255,255,255,.02); }
        .compound-detail-table tr:last-child td { border-bottom:none; }
        .compound-detail-bar { display:inline-block; width:80px; height:5px; background:#1a1d2e; border-radius:2px; overflow:hidden; vertical-align:middle; margin-left:8px; }
        .compound-detail-bar-fill { height:100%; border-radius:2px; }

        .stint-cmp-section { margin-top:24px; }
        .stint-cmp-title { font-family:'Titillium Web',sans-serif; font-size:14px; font-weight:900; color:#e8eaf6; letter-spacing:3px; text-transform:uppercase; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid #1a1d2e; display:flex; align-items:center; gap:12px; }
        .stint-cmp-title .sub { font-size:10px; color:#5a5d78; font-weight:600; letter-spacing:1px; }
        .stint-cmp-block { background:#0d0f1c; border:1px solid #1a1d2e; border-radius:10px; margin-bottom:14px; overflow:hidden; }
        .stint-cmp-head { display:flex; align-items:center; gap:14px; padding:14px 20px; background:linear-gradient(90deg, #0a0c18 0%, #111421 100%); border-bottom:1px solid #1a1d2e; }
        .stint-cmp-num { font-family:'Titillium Web',sans-serif; font-size:18px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:#e8eaf6; }
        .stint-cmp-num strong { color:#e10600; }

        .stint-cmp-badge.SS { background:#c04cff; color:#fff; }
        .stint-cmp-badge.S  { background:#ff2d2d; color:#fff; }

        .stint-cmp-badge.H  { background:#f0f0f0; color:#000; }
        .stint-cmp-badge.I  { background:#43B02A; color:#fff; }

        .stint-cmp-empty { padding:20px; text-align:center; color:#5a5d78; font-size:12px; letter-spacing:1px; }
        .stint-cmp-table { width:100%; border-collapse:collapse; }
        .stint-cmp-table th { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#5a5d78; padding:8px 16px; text-align:right; border-bottom:1px solid #1a1d2e; background:#0a0c18; font-weight:800; }
        .stint-cmp-table th:first-child { text-align:left; }
        .stint-cmp-table th.col-ref   { color:#e10600; }
        .stint-cmp-table th.col-comp  { color:#0090d0; }

        .stint-cmp-table td { padding:11px 16px; text-align:right; font-size:13px; font-family:'Titillium Web',monospace; border-bottom:1px solid #0f1220; color:#e8eaf6; }
        .stint-cmp-table td:first-child { text-align:left; font-family:'Titillium Web',sans-serif; font-size:12px; color:#8a8db0; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
        .stint-cmp-table tr:last-child td { border-bottom:none; }
        .stint-cmp-table tr:hover td { background:rgba(255,255,255,.02); }
        .stint-cmp-table td.win  { color:#00e87a; font-weight:900; }
        .stint-cmp-table td.lose { color:#8a8db0; }
        .stint-cmp-table td.delta-pos { color:#e10600; }
        .stint-cmp-table td.delta-neg { color:#00e87a; }
        .stint-cmp-table td.delta-zero { color:#5a5d78; }

        /* Badge inline de stint curto */
        .short-stint-badge-inline {
            display: inline-block; font-size: 9px; font-weight: 800; color: #ffd400;
            background: rgba(255,212,0,.15); border: 1px solid #ffd400;
            padding: 1px 6px; border-radius: 3px; letter-spacing: .5px;
            line-height: 1.4; white-space: nowrap;
        }
