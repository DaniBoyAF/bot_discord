        const CompoundBreakdown = ({ pilotos, sessao }) => {
          const [aberto, setAberto] = React.useState(null);

          const getTyreCode = (compound) => {
            if (!compound) return 'M';
            const c = compound.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            if (c.includes('SUPER')) return 'SS';
            if (c.includes('SOFT') || c.includes('MACIO')) return 'S';
            if (c.includes('MEDIUM') || c.includes('MEDIO')) return 'M';
            if (c.includes('HARD') || c.includes('DURO')) return 'H';
            if (c.includes('INTER')) return 'I';
            if (c.includes('WET') || c.includes('MOLH') || c.includes('CHUVA')) return 'W';
            return 'M';
          };

          const CORES = { SS: '#c04cff', S: '#ff2d2d', M: '#ffd400', H: '#f0f0f0', I: '#43B02A', W: '#0072C6' };
          const NOMES = { SS: 'Supersoft', S: 'Soft', M: 'Medium', H: 'Hard', I: 'Intermediate', W: 'Wet' };

          const compostos = React.useMemo(() => {
            const mapa = {};
            pilotos.forEach(p => {
              (p.stints || []).forEach(s => {
                const code = getTyreCode(s.tipo_pneu);
                const ini = s.volta_inicio || 0;
                const fim = s.volta_fim || 0;
                const voltas = Math.max(0, fim - ini + 1);
                const desgJogo = Number(s.desgasteJogoPorVolta) || 0;

                if (!mapa[code]) {
                  mapa[code] = {
                    code,
                    nome: NOMES[code] || code,
                    cor: CORES[code] || '#888',
                    voltas: 0,
                    melhorVolta: Infinity,
                    melhorPiloto: null,
                    pilotos: [],
                  };
                }

                mapa[code].voltas += voltas;

                if (s.bestTime && s.bestTime > 0 && s.bestTime < mapa[code].melhorVolta) {
                  mapa[code].melhorVolta = s.bestTime;
                  mapa[code].melhorPiloto = p.nome;
                }

                const ex = mapa[code].pilotos.find(x => x.nome === p.nome);
                if (ex) {
                  ex.voltas += voltas;
                  ex.stints++;
                  if (s.bestTime && s.bestTime < ex.melhorVolta) ex.melhorVolta = s.bestTime;
                  if (desgJogo > 0) {
                    ex.desgasteJogoTotal += desgJogo;
                    ex.desgasteJogoStints++;
                  }
                } else {
                  mapa[code].pilotos.push({
                    nome: p.nome,
                    voltas,
                    stints: 1,
                    melhorVolta: s.bestTime || Infinity,
                    desgasteJogoTotal:  desgJogo > 0 ? desgJogo : 0,
                    desgasteJogoStints: desgJogo > 0 ? 1 : 0,
                    desgasteJogoMedio:  0,
                  });
                }
              });
            });

            Object.values(mapa).forEach(c => {
              c.pilotos.forEach(pl => {
                pl.desgasteJogoMedio = pl.desgasteJogoStints > 0
                  ? pl.desgasteJogoTotal / pl.desgasteJogoStints
                  : 0;
              });
              c.pilotos.sort((a, b) => b.voltas - a.voltas);
              c.maiorUso  = c.pilotos[0];
              c.maiorPct  = c.voltas > 0 ? (c.pilotos[0].voltas / c.voltas) * 100 : 0;
              const allDesg = c.pilotos.map(pl => pl.desgasteJogoMedio).filter(v => v > 0);
              c.desgasteMedio = allDesg.length ? (allDesg.reduce((a, b) => a + b, 0) / allDesg.length) : 0;
              if (!isFinite(c.melhorVolta)) c.melhorVolta = 0;
            });

            return Object.values(mapa).sort((a, b) => b.voltas - a.voltas);
          }, [pilotos]);

          const totalGeral = compostos.reduce((a, c) => a + c.voltas, 0) || 1;

          const fmtTime = (s) => {
            if (!s || s <= 0 || !isFinite(s)) return '—';
            const m = Math.floor(s / 60);
            return `${m}:${(s % 60).toFixed(3).padStart(6, '0')}`;
          };

          if (!compostos.length) return null;

          const abertoComp = aberto ? compostos.find(c => c.code === aberto) : null;

          return (
            <div className="compounds-section">
              <div className="compounds-title">
                🛞 COMPOSTOS USADOS
                <span className="sub">clique em um card para ver detalhes</span>
              </div>

              <div className="compounds-grid">
                {compostos.map(c => {
                  const pct = (c.voltas / totalGeral) * 100;
                  const isAtivo = aberto === c.code;
                  return (
                    <div
                      key={c.code}
                      className={`compound-card ${isAtivo ? 'active' : ''}`}
                      onClick={() => setAberto(isAtivo ? null : c.code)}
                    >
                      <div className={`compound-card-top ${c.code}`} />
                      <div className="compound-card-body">
                        <div className="compound-card-head">
                          <div>
                            <div className="compound-card-name">
                              C{compostos.length - compostos.indexOf(c)} <strong>{c.nome.toUpperCase()}</strong>
                            </div>
                          </div>
                          <div className="compound-card-laps">
                            <div className="num">{c.voltas}</div>
                            <div className="lbl">laps</div>
                          </div>
                        </div>

                        <div className="compound-card-bar">
                          <div
                            className="compound-card-bar-fill"
                            style={{ width: `${pct}%`, background: c.cor }}
                          />
                        </div>

                        <div className="compound-card-foot">
                          <div className="driver">
                            MAIOR USO:&nbsp;
                            <strong>{c.maiorUso?.nome?.split(' ').pop().toUpperCase() || '—'}</strong>
                            <span style={{ color:'#ffd400', marginLeft:'6px' }}>
                              MAX {c.maiorPct.toFixed(0)}%
                            </span>
                            {c.desgasteMedio > 0 && (
                              <span style={{ color:'#ff5b1a', marginLeft:'8px' }}>
                                🔥 {c.desgasteMedio.toFixed(2)}%/v
                              </span>
                            )}
                          </div>
                          <div className="pct">{pct.toFixed(0)}%</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {abertoComp && (
                <div className="compound-detail">
                  <div className="compound-detail-head">
                    <div className="compound-detail-title" style={{ color: abertoComp.cor }}>
                      🛞 {abertoComp.nome.toUpperCase()} · {abertoComp.voltas} LAPS · {abertoComp.pilotos.length} PILOTOS
                    </div>
                    <button className="compound-detail-close" onClick={() => setAberto(null)}>✕ FECHAR</button>
                  </div>

                  <table className="compound-detail-table">
                    <thead>
                      <tr>
                        <th>PILOTO</th>
                        <th>STINTS</th>
                        <th>VOLTAS</th>
                        <th>MELHOR VOLTA</th>
                        <th>% DO COMPOSTO</th>
                      </tr>
                    </thead>
                    <tbody>
                      {abertoComp.pilotos.map((pl, i) => {
                        const pctP = (pl.voltas / abertoComp.voltas) * 100;
                        const isLider = i === 0;
                        return (
                          <tr
                            key={i}
                            style={isLider ? { background: 'rgba(255,212,0,.06)' } : undefined}
                          >
                            <td>
                              {isLider && (
                                <span style={{ color:'#ffd400', marginRight:'6px' }} title="Maior uso do composto">
                                  🏆
                                </span>
                              )}
                              {pl.nome}
                            </td>
                            <td>{pl.stints}</td>
                            <td>{pl.voltas}</td>
                            <td>{fmtTime(pl.melhorVolta)}</td>
                            <td>
                            {pl.desgasteJogoMedio > 0 ? `${pl.desgasteJogoMedio.toFixed(1)}%` : `${pctP.toFixed(0)}%`}
                           <span className="compound-detail-bar">
                           <span className="compound-detail-bar-fill" style={{ width: `${pl.desgasteJogoMedio || pctP}%`, background: abertoComp.cor }} />
                           </span>
                            </td>
                            <td style={{ color: pl.desgasteJogoMedio > 0 ? '#ffd400' : '#5a5d78' }}>
                              {pl.desgasteJogoMedio > 0
                                ? `${pl.desgasteJogoMedio.toFixed(2)}%/v`
                                : '—'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          );
        };

        const OverlayStintChart = ({ stint1, stint2, driver1Name, driver2Name }) => {
            const canvasRef = useRef(null);
            const [hover, setHover] = useState(null);
            const pointsRef = useRef([]);

            // Dados do Pneu 1 e 2
            const pv1 = stint1?.pvPorVolta || [];
            const pv2 = stint2?.pvPorVolta || [];
            
            // Dados de Tempo 1 e 2
            const t1 = stint1?.tempos || [];
            const t2 = stint2?.tempos || [];

            // Número máximo de voltas para o eixo X
            const maxLaps = Math.max(t1.length, t2.length, pv1.length, pv2.length, 1);

            useEffect(() => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();

                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const width = rect.width;
                const height = rect.height;

                // Configurações do gráfico
                const padding = { top: 40, right: 40, bottom: 30, left: 50 };
                const chartW = width - padding.left - padding.right;
                const chartH = height - padding.top - padding.bottom;

                ctx.clearRect(0, 0, width, height);

                // Fundo escuro avermelhado (estilo F1)
                ctx.fillStyle = '#1a0a0a';
                ctx.fillRect(0, 0, width, height);
                
                // Fundo do gráfico
                ctx.fillStyle = '#2a0f0f';
                ctx.fillRect(padding.left, padding.top, chartW, chartH);

                // Linhas de Grade Horizontais (Vida do Pneu 100% a 0%)
                ctx.strokeStyle = '#4a1a1a';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                
                for (let i = 0; i <= 4; i++) {
                    const y = padding.top + (chartH / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();

                    // Labels Y (Eixo Direito)
                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = 'bold 10px Titillium Web';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${100 - i * 25}%`, width - padding.right + 5, y);
                }
                ctx.setLineDash([]);

                // Título
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Titillium Web';
                ctx.textAlign = 'left';
                ctx.fillText('VIDA ÚTIL DOS PNEUS (SOBREPOSIÇÃO)', padding.left, 20);

                // Função para desenhar linha
                const drawLine = (data, getY, color, dash, label, isWear) => {
                    if (data.length < 2) return;
                    ctx.beginPath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash(dash);
                    
                    const pts = [];
                    data.forEach((val, i) => {
                        const x = padding.left + (i / Math.max(data.length - 1, 1)) * chartW;
                        const y = getY(val);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                        pts.push({ x, y, val, index: i });
                    });
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Desenhar pontos para hover
                    pts.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        
                        pointsRef.current.push({ ...p, color, label, isWear });
                    });
                };

                // Escalas Y
                const wearY = (wearPct) => padding.top + ((100 - wearPct) / 100) * chartH;
                
                const allTimes = [...t1, ...t2].filter(t => t > 0);
                const minT = allTimes.length > 0 ? Math.min(...allTimes) - 0.5 : 0;
                const maxT = allTimes.length > 0 ? Math.max(...allTimes) + 0.5 : 1;
                const timeY = (t) => padding.top + ((maxT - t) / (maxT - minT)) * chartH;

                // Desenhar Eixos de Tempo (Esquerda) - Opcional, mostrar min/max
                ctx.fillStyle = '#4a9eff';
                ctx.font = 'bold 10px Titillium Web';
                ctx.textAlign = 'right';
                ctx.fillText(`${minT.toFixed(1)}s`, padding.left - 5, padding.top + chartH);
                ctx.fillText(`${maxT.toFixed(1)}s`, padding.left - 5, padding.top);

                // Plotar Stint 1 (Pneu) - Vermelho Sólido
                const wear1 = pv1.map(v => Number(v.desgaste_medio) || 0);
                if (wear1.length > 0) {
                    drawLine(wear1, wearY, '#ff2d2d', [], driver1Name, true);
                } else {
                    // Fallback se não tiver desgaste real, usa tempo como fallback visual
                    drawLine(t1, timeY, '#ff2d2d', [], driver1Name, false);
                }

                // Plotar Stint 2 (Pneu) - Amarelo Tracejado
                const wear2 = pv2.map(v => Number(v.desgaste_medio) || 0);
                if (wear2.length > 0) {
                    drawLine(wear2, wearY, '#ffd400', [5, 5], driver2Name, true);
                } else {
                    drawLine(t2, timeY, '#ffd400', [5, 5], driver2Name, false);
                }

                // Plotar Tempos (linhas mais finas e translúcidas para não poluir)
                const drawTime = (data, color, dash, label) => {
                    if (data.length < 2) return;
                    ctx.beginPath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.6;
                    ctx.setLineDash(dash);
                    data.forEach((val, i) => {
                        const x = padding.left + (i / Math.max(data.length - 1, 1)) * chartW;
                        const y = timeY(val);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.setLineDash([]);
                };

                // Tempos: D1 Azul, D2 Branco
                drawTime(t1, '#4a9eff', [], driver1Name);
                drawTime(t2, '#ffffff', [3, 3], driver2Name);

                // X-Axis Labels (Voltas)
                ctx.fillStyle = '#8a8db0';
                ctx.font = '10px Titillium Web';
                ctx.textAlign = 'center';
                for (let i = 0; i < maxLaps; i++) {
                    const x = padding.left + (i / Math.max(maxLaps - 1, 1)) * chartW;
                    ctx.fillText(`V${i + 1}`, x, height - 10);
                }

                // Legendas
                const drawLegend = (x, y, color, dash, text) => {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash(dash);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 20, y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    ctx.fillStyle = '#e8eaf6';
                    ctx.font = 'bold 11px Titillium Web';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, x + 25, y + 1);
                };

                drawLegend(padding.left, 30, '#ff2d2d', [], `${driver1Name.split(' ').pop()} (Pneu)`);
                drawLegend(padding.left + 150, 30, '#ffd400', [5, 5], `${driver2Name.split(' ').pop()} (Pneu)`);
                drawLegend(padding.left + 300, 30, '#4a9eff', [], `${driver1Name.split(' ').pop()} (Tempo)`);
                drawLegend(padding.left + 450, 30, '#ffffff', [3, 3], `${driver2Name.split(' ').pop()} (Tempo)`);

            }, [stint1, stint2, driver1Name, driver2Name]);

            const handleMouseMove = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                let nearest = null;
                let minDist = 20;

                pointsRef.current.forEach(p => {
                    const d = Math.hypot(p.x - mx, p.y - my);
                    if (d < minDist) {
                        minDist = d;
                        nearest = p;
                    }
                });

                if (nearest) {
                    const lapIdx = nearest.index;
                    setHover({
                        x: nearest.x,
                        y: nearest.y,
                        lap: lapIdx + 1,
                        wear1: pv1[lapIdx] ? pv1[lapIdx].desgaste_medio : null,
                        wear2: pv2[lapIdx] ? pv2[lapIdx].desgaste_medio : null,
                        time1: t1[lapIdx] ? t1[lapIdx] : null,
                        time2: t2[lapIdx] ? t2[lapIdx] : null,
                    });
                } else {
                    setHover(null);
                }
            };

            const fmtTime = (s) => {
                if (!s) return '--:--.---';
                const m = Math.floor(s / 60);
                return `${m}:${(s % 60).toFixed(3).padStart(6, '0')}`;
            };

            return (
                <div style={{ position: 'relative', height: '280px', marginTop: '10px' }}>
                    <canvas
                        ref={canvasRef}
                        style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
                        onMouseMove={handleMouseMove}
                        onMouseLeave={() => setHover(null)}
                    />
                    {hover && (
                        <div style={{
                            position: 'absolute',
                            left: hover.x,
                            top: hover.y - 15,
                            transform: 'translate(-50%, -100%)',
                            background: 'rgba(10, 12, 24, 0.95)',
                            border: '1px solid #ff2d2d',
                            borderRadius: '6px',
                            padding: '8px 12px',
                            color: '#fff',
                            fontSize: '11px',
                            pointerEvents: 'none',
                            zIndex: 10,
                            whiteSpace: 'nowrap',
                            boxShadow: '0 4px 12px rgba(0,0,0,0.5)'
                        }}>
                            <div style={{ fontWeight: 'bold', color: '#ffd400', marginBottom: '4px', fontSize: '12px' }}>
                                Volta {hover.lap}
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '15px' }}>
                                <span style={{ color: '#ff2d2d', fontWeight: 'bold' }}>{driver1Name.split(' ').pop()}:</span>
                                <span>{hover.wear1 !== null ? `Pneu ${hover.wear1.toFixed(0)}%` : 'Sem pneu'}</span>
                                <span>{hover.time1 ? fmtTime(hover.time1) : '--:--.---'}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '15px', marginTop: '2px' }}>
                                <span style={{ color: '#ffd400', fontWeight: 'bold' }}>{driver2Name.split(' ').pop()}:</span>
                                <span>{hover.wear2 !== null ? `Pneu ${hover.wear2.toFixed(0)}%` : 'Sem pneu'}</span>
                                <span>{hover.time2 ? fmtTime(hover.time2) : '--:--.---'}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StintComparison = ({ driver1, driver2 }) => {
          // Estado para controlar qual stint está aberto (null = nenhum)
          const [expandedStint, setExpandedStint] = React.useState(null);

          const fmtTime = (s) => {
            if (!s || s <= 0 || !isFinite(s)) return '—';
            const m = Math.floor(s / 60);
            return `${m}:${(s % 60).toFixed(3).padStart(6, '0')}`;
          };
          const fmtDelta = (v) => {
            if (!isFinite(v) || v === 0) return '0.000s';
            const s = v >= 0 ? '+' : '';
            return `${s}${v.toFixed(3)}s`;
          };
          const fmtPct = (v) => {
            if (!isFinite(v) || v === 0) return '0.00%/v';
            const s = v >= 0 ? '+' : '';
            return `${s}${v.toFixed(2)}%/v`;
          };
          const getTyreCode = (compound) => {
            if (!compound) return 'M';
            const c = compound.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            if (c.includes('SUPER')) return 'SS';
            if (c.includes('SOFT') || c.includes('MACIO')) return 'S';
            if (c.includes('MEDIUM') || c.includes('MEDIO')) return 'M';
            if (c.includes('HARD') || c.includes('DURO')) return 'H';
            if (c.includes('INTER')) return 'I';
            if (c.includes('WET') || c.includes('MOLH') || c.includes('CHUVA')) return 'W';
            return 'M';
          };

          const st1 = driver1.stints || [];
          const st2 = driver2.stints || [];
          const maxStints = Math.max(st1.length, st2.length);

          if (maxStints === 0) return null;

          let vitoriasRef = 0, vitoriasComp = 0;

          const blocos = [];
          for (let i = 0; i < maxStints; i++) {
            const s1 = st1[i];
            const s2 = st2[i];

            const avg1 = s1?.avgTime || 0;
            const avg2 = s2?.avgTime || 0;

            let vencedorAvg = null;
            if (avg1 > 0 && avg2 > 0) {
              vencedorAvg = avg1 < avg2 ? 'ref' : avg1 > avg2 ? 'comp' : 'tie';
            }

            const d1 = s1?.deltaPerLap ?? 0;
            const d2 = s2?.deltaPerLap ?? 0;
            let vencedorDeg = null;
            if (s1 && s2) {
              vencedorDeg = d1 < d2 ? 'ref' : d1 > d2 ? 'comp' : 'tie';
            }

            const c1 = s1?.consistency ?? 0;
            const c2 = s2?.consistency ?? 0;
            let vencedorCons = null;
            if (s1 && s2) {
              vencedorCons = c1 > c2 ? 'ref' : c1 < c2 ? 'comp' : 'tie';
            }

            const dj1 = s1?.desgasteJogoPorVolta ?? 0;
            const dj2 = s2?.desgasteJogoPorVolta ?? 0;
            let vencedorDesgJogo = null;
            if (s1 && s2 && (dj1 > 0 || dj2 > 0)) {
              vencedorDesgJogo = dj1 < dj2 ? 'ref' : dj1 > dj2 ? 'comp' : 'tie';
            }

            if (vencedorAvg === 'ref') vitoriasRef++;
            else if (vencedorAvg === 'comp') vitoriasComp++;

            blocos.push({
              idx: i,
              s1, s2,
              vencedorAvg, vencedorDeg, vencedorCons, vencedorDesgJogo,
            });
          }

          const ganhadorGeral = vitoriasRef > vitoriasComp ? driver1.nome
                              : vitoriasComp > vitoriasRef ? driver2.nome
                              : 'Empate';

          return (
            <div className="stint-cmp-section">
              <div className="stint-cmp-title">
                🏁 STINT vs STINT
                <span className="sub">clique em um stint para ver o gráfico de desgaste</span>
                <span style={{
                  marginLeft:'auto', fontSize:'11px', color:'#8a8db0',
                  letterSpacing:'1px', fontWeight:700,
                }}>
                  {vitoriasRef} × {vitoriasComp} · {' '}
                  <strong style={{
                    color: vitoriasRef > vitoriasComp ? '#e10600'
                         : vitoriasComp > vitoriasRef ? '#0090d0'
                         : '#5a5d78',
                  }}>
                    {ganhadorGeral}
                  </strong>
                </span>
              </div>

              {blocos.map((b) => {
                const { idx, s1, s2, vencedorAvg, vencedorDeg, vencedorCons, vencedorDesgJogo } = b;
                const isExpanded = expandedStint === idx;

                return (
                  <div key={idx} className="stint-cmp-block">
                    <div 
                      className="stint-cmp-head" 
                      onClick={() => setExpandedStint(isExpanded ? null : idx)}
                      style={{ cursor: 'pointer', transition: 'background 0.2s', borderBottom: isExpanded ? '1px solid #1a1d2e' : 'none' }}
                    >
                      <div className="stint-cmp-num">
                        STINT <strong>{idx + 1}</strong>
                      </div>
                      <div className="stint-cmp-badges">
                        {s1?.tipo_pneu && (
                          <span className={`stint-cmp-badge ${getTyreCode(s1.tipo_pneu)}`}>
                            {driver1.nome.split(' ').pop()} · {s1.tipo_pneu}
                          </span>
                        )}
                        {s2?.tipo_pneu && (
                          <span className={`stint-cmp-badge ${getTyreCode(s2.tipo_pneu)}`}>
                            {driver2.nome.split(' ').pop()} · {s2.tipo_pneu}
                          </span>
                        )}
                      </div>
                      <div style={{ marginLeft: '15px', color: '#8a8db0', fontSize: '12px' }}>
                        {isExpanded ? '▲ Fechar Gráfico' : '▼ Ver Gráfico'}
                      </div>
                    </div>

                    {isExpanded && (
                        <div style={{ padding: '0 10px 15px 10px', background: '#0a0c18' }}>
                            <OverlayStintChart 
                                stint1={s1} 
                                stint2={s2} 
                                driver1Name={driver1.nome} 
                                driver2Name={driver2.nome} 
                            />
                        </div>
                    )}

                    {(!s1 && !s2) ? (
                      <div className="stint-cmp-empty">Sem dados neste stint</div>
                    ) : (
                      <table className="stint-cmp-table">
                        <thead>
                          <tr>
                            <th>MÉTRICA</th>
                            <th className="col-ref">{driver1.nome.toUpperCase()}</th>
                            <th className="col-comp">{driver2.nome.toUpperCase()}</th>
                            <th className="col-delta">DELTA</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td>⏱️ Avg Lap</td>
                            <td className={vencedorAvg === 'ref' ? 'win' : vencedorAvg === 'comp' ? 'lose' : ''}>
                              {s1 ? fmtTime(s1.avgTime) : '—'}
                            </td>
                            <td className={vencedorAvg === 'comp' ? 'win' : vencedorAvg === 'ref' ? 'lose' : ''}>
                              {s2 ? fmtTime(s2.avgTime) : '—'}
                            </td>
                            <td className={
                              !s1 || !s2 ? '' :
                              (s2.avgTime - s1.avgTime) > 0.001 ? 'delta-pos' :
                              (s2.avgTime - s1.avgTime) < -0.001 ? 'delta-neg' : 'delta-zero'
                            }>
                              {s1 && s2 ? fmtDelta(s2.avgTime - s1.avgTime) : '—'}
                            </td>
                          </tr>

                          <tr>
                            <td>📉 Degradação (tempo)</td>
                            <td className={vencedorDeg === 'ref' ? 'win' : vencedorDeg === 'comp' ? 'lose' : ''}>
                              {s1 ? fmtDelta(s1.deltaPerLap) : '—'}
                            </td>
                            <td className={vencedorDeg === 'comp' ? 'win' : vencedorDeg === 'ref' ? 'lose' : ''}>
                              {s2 ? fmtDelta(s2.deltaPerLap) : '—'}
                            </td>
                            <td className={
                              !s1 || !s2 ? '' :
                              (s2.deltaPerLap - s1.deltaPerLap) > 0.001 ? 'delta-pos' :
                              (s2.deltaPerLap - s1.deltaPerLap) < -0.001 ? 'delta-neg' : 'delta-zero'
                            }>
                              {s1 && s2 ? fmtDelta(s2.deltaPerLap - s1.deltaPerLap) : '—'}
                            </td>
                          </tr>

                          {(s1?.desgasteJogoPorVolta > 0 || s2?.desgasteJogoPorVolta > 0) && (
                            <tr>
                              <td>🔥 Desgaste (jogo)</td>
                              <td className={vencedorDesgJogo === 'ref' ? 'win' : vencedorDesgJogo === 'comp' ? 'lose' : ''}>
                                {s1 && s1.desgasteJogoPorVolta > 0 ? fmtPct(s1.desgasteJogoPorVolta) : '—'}
                              </td>
                              <td className={vencedorDesgJogo === 'comp' ? 'win' : vencedorDesgJogo === 'ref' ? 'lose' : ''}>
                                {s2 && s2.desgasteJogoPorVolta > 0 ? fmtPct(s2.desgasteJogoPorVolta) : '—'}
                              </td>
                              <td className={
                                !s1 || !s2 || s1.desgasteJogoPorVolta === 0 || s2.desgasteJogoPorVolta === 0 ? '' :
                                (s2.desgasteJogoPorVolta - s1.desgasteJogoPorVolta) > 0.01 ? 'delta-pos' :
                                (s2.desgasteJogoPorVolta - s1.desgasteJogoPorVolta) < -0.01 ? 'delta-neg' : 'delta-zero'
                              }>
                                {s1 && s2 && s1.desgasteJogoPorVolta > 0 && s2.desgasteJogoPorVolta > 0
                                  ? fmtPct(s2.desgasteJogoPorVolta - s1.desgasteJogoPorVolta)
                                  : '—'}
                              </td>
                            </tr>
                          )}

                          <tr>
                            <td>🎯 Consistência</td>
                            <td className={vencedorCons === 'ref' ? 'win' : vencedorCons === 'comp' ? 'lose' : ''}>
                              {s1 ? `${s1.consistency.toFixed(1)}%` : '—'}
                            </td>
                            <td className={vencedorCons === 'comp' ? 'win' : vencedorCons === 'ref' ? 'lose' : ''}>
                              {s2 ? `${s2.consistency.toFixed(1)}%` : '—'}
                            </td>
                            <td className={
                              !s1 || !s2 ? '' :
                              (s2.consistency - s1.consistency) > 0.1 ? 'delta-neg' :
                              (s2.consistency - s1.consistency) < -0.1 ? 'delta-pos' : 'delta-zero'
                            }>
                              {s1 && s2 ? `${(s2.consistency - s1.consistency) >= 0 ? '+' : ''}${(s2.consistency - s1.consistency).toFixed(1)}%` : '—'}
                            </td>
                          </tr>

                          <tr>
                            <td>⚡ Melhor Volta</td>
                            <td>{s1 ? fmtTime(s1.bestTime) : '—'}</td>
                            <td>{s2 ? fmtTime(s2.bestTime) : '—'}</td>
                            <td className={
                              !s1 || !s2 || !s1.bestTime || !s2.bestTime ? '' :
                              (s2.bestTime - s1.bestTime) > 0.001 ? 'delta-pos' :
                              (s2.bestTime - s1.bestTime) < -0.001 ? 'delta-neg' : 'delta-zero'
                            }>
                              {s1 && s2 && s1.bestTime && s2.bestTime ? fmtDelta(s2.bestTime - s1.bestTime) : '—'}
                            </td>
                          </tr>

                          <tr>
                            <td>🔢 Voltas</td>
                            <td>{s1 ? s1.tempos?.length || 0 : '—'}</td>
                            <td>{s2 ? s2.tempos?.length || 0 : '—'}</td>
                            <td className="delta-zero">
                              {s1 && s2 ? `${(s2.tempos?.length||0) - (s1.tempos?.length||0)}` : '—'}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    )}
                  </div>
                );
              })}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TyreDegradationChart />);
    </script>

    </button>

    </button>

<script>
(function() {
  document.addEventListener('click', function(e) {
    const btn = document.getElementById('insta-btn');
    if (btn && !btn.contains(e.target)) {
      document.getElementById('insta-formats').classList.remove('open');
    }
  });
})();

async function instaCap(outW, outH, label) {
  document.getElementById('insta-formats').classList.remove('open');
  const overlay = document.getElementById('insta-overlay');
  const msg     = document.getElementById('insta-overlay-msg');
  overlay.classList.add('show');
  msg.textContent = 'Capturando tela...';

  const fab = document.getElementById('insta-btn');
  fab.style.display = 'none';

  try {
    msg.textContent = 'Renderizando...';
    const captureScale = Math.max(4, window.devicePixelRatio * 3);

    const canvas = await html2canvas(document.body, {
      useCORS: true, allowTaint: true, scale: captureScale,
      backgroundColor: getComputedStyle(document.body).backgroundColor || '#0a0c18',
      logging: false, removeContainer: true, imageTimeout: 0, letterRendering: true,
    });

    msg.textContent = 'Formatando para Instagram...';

    const pixelRatio = 2;
    const out = document.createElement('canvas');
    out.width  = outW * pixelRatio;
    out.height = outH * pixelRatio;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled  = true;
    ctx.imageSmoothingQuality  = 'high';

    ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#0a0c18';
    ctx.fillRect(0, 0, out.width, out.height);

    const srcW = canvas.width;
    const srcH = canvas.height;
    const fit  = Math.min((out.width * 0.96) / srcW, (out.height * 0.96) / srcH);
    const dw   = srcW * fit;
    const dh   = srcH * fit;
    const dx   = (out.width  - dw) / 2;
    const dy   = (out.height - dh) / 2;

    ctx.drawImage(canvas, dx, dy, dw, dh);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('F1 Telemetry', outW - 14, outH - 10);

    msg.textContent = 'Salvando...';
    const link = document.createElement('a');
    const ts   = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
    link.download = `f1-${label}-${ts}.png`;
    link.href = out.toDataURL('image/png');
    link.click();

    msg.textContent = '✓ Salvo!';
    await new Promise(r => setTimeout(r, 800));
  } catch(err) {
    console.error(err);
    msg.textContent = 'Erro: ' + err.message;
    await new Promise(r => setTimeout(r, 2000));
  }

  fab.style.display = 'flex';
  overlay.classList.remove('show');
}
</script>
