    if (grandChelem) return { valor: BONUS_GRAND_CHELEM, tipo: 'grand_chelem', pole, vmr, venceu };
    if (hatTrick)    return { valor: BONUS_HATTRICK,      tipo: 'hat_trick',    pole, vmr, venceu };
    return { valor: 0, tipo: null, pole, vmr, venceu };
  };

  const ritmoOrdenado = [...pilotsData]
    .filter(p => p.tot && p.tot > 0)
    .sort((a, b) => a.tot - b.tot);

  const ritmoLiderNome = ritmoOrdenado.length > 0 ? ritmoOrdenado[0].nome : null;

  const calcBonusRitmo = () => 0;

  const scoreFinal = (val, bestVal, bonusDano, bonusPos, bonusGrid, bonusFeitos, bonusRitmo, bonusExtras=0) => {
    const base = scorePuro(val, bestVal);
    if (base === null) return null;
    const total = base + (bonusDano||0) + (bonusPos||0) + (bonusGrid||0) + (bonusFeitos||0) + (bonusRitmo||0) + (bonusExtras||0);
    return Math.max(0, Math.min(24.0, total)).toFixed(1);
  };

  const GRID_BONUS_FORTE       = 0.5;
  const GRID_BONUS_MUITO_FORTE = 1.0;
  const GRID_BONUS_FORTISSIMO  = 2.0;
  const GRID_GOD_TIER          = 3.0;
  const GRID_OUTRO_NIVEL       = 5.0;
  const GRID_BONUS_FATOR_POS   = { 1: 1.0, 2: 0.8, 3: 0.6, 4: 0.4, 5: 0.2 };
  const MIN_PILOTOS_PARA_BONUS_GRID = 10;

  const MIN_VOLTAS_PARA_AVALIAR = 5;

  const pilotsGridEval = pilotsDataBruto.filter(p =>
    Number.isFinite(p.grid) && p.grid >= 1 && p.nVoltas >= MIN_VOLTAS_PARA_AVALIAR
  );

  const temGridSuficiente = pilotsGridEval.length >= MIN_PILOTOS_PARA_BONUS_GRID;

  const bestGridTot = (() => {
    const vals = pilotsGridEval.filter(p => p.tot).map(p => p.tot).sort((a,b) => a-b);
    if (!vals.length) return null;
    const mediana = vals[Math.floor(vals.length / 2)];
    const sane = vals.filter(v => v >= mediana * 0.85);
    return sane.length ? Math.min(...sane) : Math.min(...vals);
  })();

  const scoreGridEval = (p) => {
    const base = scorePuro(p.tot, bestGridTot);
    if (base === null) return null;
    const bp = calcBonusPosicao(p.grid, p.posFinal);
    const bf = calcBonusFeitos(p).valor;
    return Math.max(0, Math.min(18, base + bp + bf));
  };

  const gridTop5  = pilotsGridEval.filter(p => p.grid <= 5) .sort((a,b) => a.grid - b.grid);
  const gridTop10 = pilotsGridEval.filter(p => p.grid <= 10).sort((a,b) => a.grid - b.grid);

  const notasGridTop5  = gridTop5 .map(scoreGridEval).filter(n => n !== null);
  const notasGridTop10 = gridTop10.map(scoreGridEval).filter(n => n !== null);

  const maioriaGrid5  = Math.ceil(notasGridTop5.length  / 2);
  const maioriaGrid10 = Math.ceil(notasGridTop10.length / 2);

  let gridBonusBase  = 0;
  let gridBonusLabel = null;

  if (isRace && temGridSuficiente) {
    if (maioriaGrid10 > 0 && notasGridTop10.filter(n => n >= 10.0).length >= maioriaGrid10) {
      gridBonusBase = GRID_OUTRO_NIVEL;       gridBonusLabel = 'Grid Outro Nível';
    } else if (maioriaGrid5 > 0 && notasGridTop5.filter(n => n >= 12.0).length >= maioriaGrid5) {
      gridBonusBase = GRID_GOD_TIER;          gridBonusLabel = 'Grid de Deus';
    } else if (maioriaGrid5 > 0 && notasGridTop5.filter(n => n >= 10.0).length >= maioriaGrid5) {
      gridBonusBase = GRID_BONUS_FORTISSIMO;  gridBonusLabel = 'Grid Fortíssimo';
    } else if (maioriaGrid5 > 0 && notasGridTop5.filter(n => n >= 9.0).length >= maioriaGrid5) {
      gridBonusBase = GRID_BONUS_MUITO_FORTE; gridBonusLabel = 'Grid Muito Forte';
    } else if (maioriaGrid5 > 0 && notasGridTop5.filter(n => n >= 7.5).length >= maioriaGrid5) {
      gridBonusBase = GRID_BONUS_FORTE;       gridBonusLabel = 'Grid Forte';
    }
  }

  const gridBonusMap = {};
  if (gridBonusBase > 0) {
    pilotsData
      .filter(p => p.posicao <= 5)
      .forEach(p => { gridBonusMap[p.nome] = gridBonusBase * (GRID_BONUS_FATOR_POS[p.posicao] || 0); });
  }

  const rankBy = (field) => {
    const sorted = [...pilotsData].filter(p=>p[field]).sort((a,b)=>a[field]-b[field]);
    const ranks = {};
    sorted.forEach((p,i) => { ranks[p.nome] = i+1; });
    return ranks;
  };
  const rankS1 = rankBy('s1'), rankS2 = rankBy('s2'), rankS3 = rankBy('s3'), rankTot = rankBy('tot');

  const validLap = (v) => Number.isFinite(v?.t) && v.t > 10;
  const bestSectorSession = (field) => {
    const values = pilotsData.flatMap(p => (p.voltas || [])
      .filter(validLap)
      .map(v => v[field])
      .filter(v => Number.isFinite(v) && v > 1 && v < 300));
    return values.length ? Math.min(...values) : null;
  };
  const bestLapSession = (() => {
    const values = pilotsData.flatMap(p => (p.voltas || [])
      .filter(validLap)
      .map(v => v.t));
    return values.length ? Math.min(...values) : null;
  })();
  const bestSectorsSession = { s1: bestSectorSession('s1'), s2: bestSectorSession('s2'), s3: bestSectorSession('s3') };

  const calcBonusMelhores = (p) => {
    const bonusSetor = ['s1', 's2', 's3'].reduce((total, field) => {
      const fez = (p.voltas || []).some(v => validLap(v) && Number.isFinite(v[field]) &&
        Math.abs(v[field] - bestSectorsSession[field]) < 0.0005);
      return total + (fez ? 0.2 : 0);
    }, 0);
    const fezMelhorVolta = bestLapSession !== null && (p.voltas || []).some(v =>
      validLap(v) && Math.abs(v.t - bestLapSession) < 0.0005);
    return bonusSetor + (fezMelhorVolta ? 0.2 : 0);
  };

  const calcBonusConsistencia = (consistencia) => {
    if (!Number.isFinite(consistencia) || consistencia <= 98) return 0;
    return Math.min(0.3, (consistencia - 98) * 0.15);
  };

  const calcBonusGanhoVolta2 = (p) => {
    if (!isRace) return 0;
    const grid = p.grid;
    const posVolta2 = Number((posData || {})[p.nome]?.posicoes?.[2]);
    if (!Number.isFinite(grid) || grid < 1 || !Number.isFinite(posVolta2) || posVolta2 < 1) return 0;
    return Math.min(2.0, Math.max(0, grid - posVolta2) * 0.2);
  };

  const calcBonusPodioVsRitmo = (p) => {
    if (!isRace) return 0;
    const ritmo = rankTot[p.nome];
    if (!ritmo || !Number.isFinite(p.posFinal) || p.posFinal > 3 || ritmo <= 3) return 0;
    return Math.min(2.0, Math.max(0, ritmo - p.posFinal) * 0.5);
  };

  const calcBonusLideranca = (p) => {
    if (!isRace) return 0;
    const posicoes = (posData || {})[p.nome]?.posicoes || {};
    const voltas = Object.keys(posicoes).map(Number).filter(v => v > 0 && Number.isFinite(posicoes[v]));
    if (!voltas.length) return 0;
    const percentual = voltas.filter(v => posicoes[v] === 1).length / voltas.length * 100;
    if (percentual < 50) return 0;
    return Math.min(1.0, 0.5 + ((percentual - 50) / 49) * 0.5);
  };

  const calcBonusVitoriaForaTop10 = (p) => {
    if (!isRace) return 0;
    if (!Number.isFinite(p.grid) || p.grid <= 10 || p.posFinal !== 1) return 0;
    return Math.min(2.2, p.grid / 10);
  };
  const calcBonusVitoriaForaTop20 = (p) => {
    if (!isRace) return 0;
    if (!Number.isFinite(p.grid) || p.grid <= 19 || p.grid > 22 || p.posFinal !== 1) return 0;
    return Math.min(3.5, 1.5 * (p.grid - 20 )*1.0);
  };

  const calcBonusMargemVitoria = (p) => {
    if (!isRace) return 0;
    if (p.posFinal !== 1) return 0;
    const gap = deltaLider;
    if (!Number.isFinite(gap) || gap < 10) return 0;
    let bonus = 1.0;
    if (gap > 10) {
      const intervalosAte35 = Math.min(Math.floor((gap - 10) / 5), 5);
      bonus += intervalosAte35 * 0.5;
    }
    if (gap > 35) {
      const intervalosApos35 = Math.floor((gap - 35) / 5);
      bonus += intervalosApos35 * 1.0;
    }
    return bonus;
  };

  const calcBonusResiliencia = (p) => {
    if (!isRace) return 0;
    const historico = (danoHist || {})[p.nome] || {};
    const voltas = (p.voltas || []).filter(validLap).sort((a,b) => a.n - b.n);
    const danoTotal = (d) => (d?.asa_esquerda||0)*0.35 + (d?.asa_direita||0)*0.35 +
      (d?.asa_traseira||0)*0.15 + (d?.assoalho||0)*0.2 + (d?.difusor||0)*0.15 + (d?.sidepods||0)*0.15;
    const danoVolta = v => historico[v.n] || null;
    const primeiroDano = voltas.findIndex(v => danoTotal(danoVolta(v)) >= 1);
    if (primeiroDano < 2) return 0;
    const antes = voltas.slice(0, primeiroDano).map(v => v.t);
    const depois = voltas.slice(primeiroDano).filter(v => danoTotal(danoVolta(v)) >= 1).map(v => v.t);
    if (antes.length < 2 || depois.length < 2) return 0;
    const mediaAntes = antes.reduce((a,b) => a+b, 0) / antes.length;
    const mediaDepois = depois.reduce((a,b) => a+b, 0) / depois.length;
    const danoMedio = depois.reduce((a,v) => a + danoTotal(danoVolta(v)), 0) / depois.length;
    const perdaRelativa = Math.max(0, (mediaDepois - mediaAntes) / mediaAntes);
    const preservacao = Math.max(0, Math.min(1, 1 - perdaRelativa / 0.05));
    const severidade = Math.max(0, Math.min(1, danoMedio / 40));
    const duracao = Math.max(0, Math.min(1, depois.length / 5));
    return Math.min(1.0, severidade * duracao * preservacao);
  };

  const CHUVA_MIN_CONSISTENCIA = 75;

  const calcConsistenciaChuva = (p) => {
    if (!periodosChuva?.length) return null;
    const lapsSet = new Set();
    periodosChuva.forEach(per => {
      for (let v = per.volta_inicio; v <= per.volta_fim; v++) lapsSet.add(v);
    });
    const tempos = (p.voltas || [])
      .filter(v => lapsSet.has(v.n) && v.t > 30)
      .map(v => v.t);
    if (tempos.length < 3) return null;
    const media = tempos.reduce((a,b) => a+b, 0) / tempos.length;
    const limpo = tempos.filter(t => t <= media * 1.10 && t >= media * 0.90);
    const usar  = limpo.length >= 3 ? limpo : tempos;
    const dp    = Math.sqrt(usar.reduce((s,t) => s + (t - media)**2, 0) / usar.length);
    return Math.max(0, 100 - (dp / media * 100));
  };

  const titulosChuva = (() => {
    if (!isRace || !periodosChuva?.length) return {};
    const candidatos = pilotsData
      .filter(p => {
        if (!Number.isFinite(p.grid) || !Number.isFinite(p.posFinal)) return false;
        if (p.posFinal > p.grid) return false;
        return true;
      })
      .map(p => {
        const c = calcConsistenciaChuva(p);
        if (c === null || c < CHUVA_MIN_CONSISTENCIA) return null;
        return { nome: p.nome, consistencia: c };
      })
      .filter(Boolean)
      .sort((a, b) => b.consistencia - a.consistencia);

    const mapa = {};
    candidatos.forEach((c, idx) => {
      if (idx === 0)      mapa[c.nome] = { nivel: 'deus', consistencia: c.consistencia };
      else if (idx === 1) mapa[c.nome] = { nivel: 'rei',  consistencia: c.consistencia };
      else                mapa[c.nome] = { nivel: 'bom',  consistencia: c.consistencia };
    });
    return mapa;
  })();

  const calcBonusChuva = (p) => {
    const vazio = { total: 0, duracao: 0, titulo: 0, nivelTitulo: null,
                    consistencia: null, lapsChuva: 0, lapsLeve: 0, lapsPesada: 0 };
    if (!isRace || !periodosChuva?.length) return vazio;

    let pontosDuracao = 0;
    let lapsLeve = 0, lapsPesada = 0;
    for (const per of periodosChuva) {
      const laps = Math.max(0, (per.volta_fim || 0) - (per.volta_inicio || 0) + 1);
      if (laps === 0) continue;
      if (per.tipo === 'pesada') { lapsPesada += laps; pontosDuracao += Math.floor(laps / 10) * 1.5; }
      else                       { lapsLeve   += laps; pontosDuracao += Math.floor(laps / 10) * 1.0; }
    }
    pontosDuracao = Math.min(6.0, pontosDuracao);

    const pos      = p.posFinal || 99;
    const fatorPos = pos <= 3 ? 1.0 : pos <= 10 ? 0.7 : 0.4;
    const duracao  = pontosDuracao * fatorPos;

    const t = titulosChuva[p.nome];
    let titulo = 0, nivelTitulo = null, consistencia = null;
    if (t) {
      consistencia = Math.round(t.consistencia * 10) / 10;
      if      (t.nivel === 'deus') { titulo = 5.0; nivelTitulo = 'deus'; }
      else if (t.nivel === 'rei')  { titulo = 3.5; nivelTitulo = 'rei';  }
      else if (t.nivel === 'bom')  { titulo = 2.0; nivelTitulo = 'bom';  }
    }

    return {
      total: duracao + titulo,
      duracao, titulo, nivelTitulo,
      consistencia,
      lapsChuva: lapsLeve + lapsPesada,
      lapsLeve, lapsPesada,
    };
  };

  const detectaExtras = (p) => {
    const laps = (p.voltas || []).filter(validLap);
    const melhorS1 = bestSectorsSession.s1 !== null && laps.some(v => Number.isFinite(v.s1) && Math.abs(v.s1 - bestSectorsSession.s1) < 0.0005);
    const melhorS2 = bestSectorsSession.s2 !== null && laps.some(v => Number.isFinite(v.s2) && Math.abs(v.s2 - bestSectorsSession.s2) < 0.0005);
    const melhorS3 = bestSectorsSession.s3 !== null && laps.some(v => Number.isFinite(v.s3) && Math.abs(v.s3 - bestSectorsSession.s3) < 0.0005);
    const melhorVolta = bestLapSession !== null && laps.some(v => Math.abs(v.t - bestLapSession) < 0.0005);

    const bonusConsistencia = calcBonusConsistencia(p.consistencia);

    const posVolta2 = Number((posData || {})[p.nome]?.posicoes?.[2]);
    const ganhoLargada = (isRace && Number.isFinite(p.grid) && Number.isFinite(posVolta2))
      ? Math.max(0, p.grid - posVolta2) : 0;

    const bonusPodio = calcBonusPodioVsRitmo(p);
    const rankRitmo  = rankTot[p.nome] || null;

    const posicoes    = (posData || {})[p.nome]?.posicoes || {};
    const voltasLid   = Object.keys(posicoes).map(Number).filter(v => v > 0 && Number.isFinite(posicoes[v]));
    const pctLideradas = voltasLid.length
      ? Math.round(voltasLid.filter(v => posicoes[v] === 1).length / voltasLid.length * 1000) / 10
      : 0;
    const bonusLideranca = calcBonusLideranca(p);

    const bonusForaTop10   = calcBonusVitoriaForaTop10(p);
    const bonusForaTop20   = calcBonusVitoriaForaTop20(p);
    const bonusResiliencia = calcBonusResiliencia(p);
    const bonusMargemVitoria = calcBonusMargemVitoria(p);

    return {
      melhorS1, melhorS2, melhorS3, melhorVolta,
      bonusConsistencia,
      ganhoLargada,
      bonusPodio, rankRitmo,
      pctLideradas, bonusLideranca,
      bonusForaTop20,
      bonusForaTop10,
      bonusResiliencia,
      bonusMargem:bonusMargemVitoria,
    };
  };

  const scoreColor = (s) => {
    if (s===null) return 'var(--muted)';
    const n = parseFloat(s);
    if (n >= 24) return '#FFD700';
    if (n >= 23) return '#9D4EDD';
    if (n >= 22) return '#3A86FF';
    if (n >= 21) return '#00F5FF';
    if (n >= 20) return '#39FF14';
    if (n >= 19) return '#FF6EC7';
    if (n >= 18) return '#FF1493';
    if (n >= 17) return '#FF8000';
    if (n >= 16) return '#DC143C';
    if (n >= 15) return '#FF00FF';
    if (n >= 14) return '#FF6B00';
    if (n >= 13) return '#8A2BE2';
    if (n >= 12) return '#0066FF';
    if (n >= 10.5) return '#00D4FF';
    if (n >= 9.5)  return '#00ffaa';
    if (n >= 9)    return '#00e87a';
    if (n >= 7.5)  return '#a0ff00';
    if (n >= 6)    return '#ffc000';
    if (n >= 4)    return '#ff8c00';
    return '#e10600';
  };

  const scoreLabel = (s) => {
    if (s===null) return null;
    const n = parseFloat(s);
    if (n >= 24)   return '👑 HIGHLANDER ✨';
    if (n >= 23)   return '💥 TRANSCENDENTAL';
    if (n >= 22)   return '⚡ SOBRENATURAL';
    if (n >= 21)   return '🌌 DOMINANTE';
    if (n >= 20)   return '🚀 OUTRO NIVEL';
    if (n >= 19)   return '👾 BIZARRO';
    if (n >= 18)   return '✨ ALÉM DO LIMITE';
    if (n >= 17)   return '👑 PERFECT';
    if (n >= 16)   return '🔥 INSANO';
    if (n >= 15)   return '💗 FENOMENAL';
    if (n >= 14)   return '🟠 LENDÁRIO';
    if (n >= 13)   return '🟣 ELITE';
    if (n >= 12)   return '🔵 EXCEPCIONAL';
    if (n >= 10.5) return '🩵 ÓTIMO';
    if (n >= 9.5)  return '💚 EXCELENTE';
    if (n >= 9)    return '🟢 MUITO BOM';
    if (n >= 7.5)  return '🟡 BOM';
    if (n >= 6)    return '🟡 OK';
    if (n >= 4)    return '🟠 RUIM';
    return '🔴 PÉSSIMO';
  };

  const ScoreBar = ({val, base, bonusDano=0, bonusPos=0, bonusGrid=0, bonusFeitos=0, bonusRitmo=0, bonusExtras=0, feitosTipo=null}) => {
    if (val===null) return <span style={{color:'var(--muted)'}}>—</span>;
    const n=parseFloat(val);
    const color=scoreColor(val);
    const basePct   = Math.min(100, (base||0) * 10);
    const danoPct   = Math.min(100, Math.max(0, bonusDano) * 10);
    const posPct    = Math.min(100, Math.max(0, bonusPos) * 10);
    const gridPct   = Math.min(100, Math.max(0, bonusGrid) * 10);
    const feitosPct = Math.min(100, Math.max(0, bonusFeitos) * 10);
    const ritmoPct  = Math.min(100, Math.max(0, bonusRitmo) * 10);
    const feitosCor = feitosTipo === 'grand_chelem' ? '#ffd700' : '#c850c0';
    return (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <div style={{width:'80px',height:'6px',background:'var(--border2)',borderRadius:'3px',overflow:'hidden',display:'flex'}}>
            <div style={{width:`${basePct}%`,height:'100%',background:color,borderRadius:'3px 0 0 3px',transition:'width .3s'}}/>
            {bonusDano>0   && <div style={{width:`${danoPct}%`,height:'100%',background:'#ffffff60'}}/>}
            {bonusPos>0    && <div style={{width:`${posPct}%`,height:'100%',background:'#00e87a'}}/>}
            {bonusGrid>0   && <div style={{width:`${gridPct}%`,height:'100%',background:'#ffc000'}}/>}
            {bonusRitmo>0  && <div style={{width:`${ritmoPct}%`,height:'100%',background:'#00d4ff'}}/>}
            {bonusExtras>0 && <div style={{width:`${Math.min(100, bonusExtras * 10)}%`,height:'100%',background:'#ffffff80'}}/>}
            {bonusFeitos>0 && <div style={{width:`${feitosPct}%`,height:'100%',background:feitosCor,borderRadius:'0 3px 3px 0'}}/>}
          </div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'13px',fontWeight:900,color,minWidth:'36px'}}>{val}</span>
        </div>
        <span style={{fontSize:'9px',fontWeight:800,color,letterSpacing:'.3px'}}>{scoreLabel(val)}</span>
        {(bonusDano>0 || bonusPos!==0 || bonusGrid>0 || bonusFeitos>0 || bonusRitmo!==0 || bonusExtras>0) && (
          <div style={{display:'flex',gap:'6px',fontSize:'9px',fontFamily:'Orbitron,monospace'}}>
            {bonusDano>0   && <span style={{color:'#ffffff90'}}>🔧+{bonusDano.toFixed(1)}</span>}
            {bonusPos>0    && <span style={{color:'#00e87a'}}>🏁+{bonusPos.toFixed(1)}</span>}
            {bonusPos<0    && <span style={{color:'#e10600'}}>🏁{bonusPos.toFixed(1)}</span>}
            {bonusGrid>0   && <span style={{color:'#ffc000'}}>👑+{bonusGrid.toFixed(1)}</span>}
            {bonusRitmo>0  && <span style={{color:'#00d4ff'}}>⏱️+{bonusRitmo.toFixed(1)}</span>}
            {bonusRitmo<0  && <span style={{color:'#e10600'}}>⏱️{bonusRitmo.toFixed(1)}</span>}
            {bonusExtras>0 && <span style={{color:'#ffffff'}}>✦+{bonusExtras.toFixed(1)}</span>}
            {bonusFeitos>0 && <span style={{color:feitosCor}}>{feitosTipo==='grand_chelem'?'🏆':'🎩'}+{bonusFeitos.toFixed(1)}</span>}
          </div>
        )}
      </div>
    );
  };

  const FeitoBadge = ({emoji, label, color, title}) => (
    <span title={title} style={{
      padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
      background:`${color}20`, color, border:`1px solid ${color}60`,
    }}>
      {emoji} {label}
    </span>
  );

  const RankBadge = ({r}) => (
    <span style={{
      display:'inline-block',padding:'1px 6px',borderRadius:'4px',fontSize:'11px',fontWeight:800,
      background: r===1?'#ffc00030':r<=3?'#ffffff15':'transparent',
      color: r===1?'#ffc000':r<=3?'#e8eaf6':'var(--muted)',
      border: r===1?'1px solid #ffc00060':r<=3?'1px solid #ffffff20':'1px solid transparent',
    }}>
      {r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}º`}
    </span>
  );

  const SETORES = [
    { key:'s1',  label:'SETOR 1', sub:'Curvas lentas',    color:'#0090d0', rank:rankS1,  hasBonus:false },
    { key:'s2',  label:'SETOR 2', sub:'Curvas médias',    color:'#00e87a', rank:rankS2,  hasBonus:false },
    { key:'s3',  label:'SETOR 3', sub:'Retas / alta vel', color:'#ffc000', rank:rankS3,  hasBonus:false },
    { key:'tot', label:'GERAL',   sub:'Ritmo + dano + posição + feitos',color:'#e10600',rank:rankTot, hasBonus:true  },
  ];

  const chuvaResumo = (() => {
    if (!periodosChuva?.length) return null;
    let leve = 0, pesada = 0;
    periodosChuva.forEach(per => {
      const laps = Math.max(0, (per.volta_fim || 0) - (per.volta_inicio || 0) + 1);
      if (per.tipo === 'pesada') pesada += laps;
      else                       leve   += laps;
    });
    return { leve, pesada, total: leve + pesada };
  })();

  return (
    <div className="fade-in">
      <div style={{
        display:'flex',alignItems:'center',gap:'16px',
        padding:'14px 20px',marginBottom:'20px',
        background:'linear-gradient(90deg,#0d0f1c,#0a0c18)',
        border:'1px solid var(--border2)',borderRadius:'8px',
        borderLeft:'4px solid var(--red)',
      }}>
        <div>
          <div style={{fontFamily:'Orbitron, monospace',fontSize:'16px',fontWeight:900,letterSpacing:'2px',color:'var(--text)'}}>
            CAR PERFORMANCE SCORES
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px',letterSpacing:'1px'}}>
            Média de todas as voltas · Score 0–10 (10 = melhor do grid) · Geral pode passar de 10 com bônus de dano/posição/grid
          </div>
        </div>
        {gridBonusLabel && (
          <div title={`Top 5 forte demais — bônus extra liberado pra quem ficou no top 5 (P1 leva o cheio, P2-P5 escalando)`} style={{
            padding:'4px 10px',borderRadius:'6px',fontSize:'11px',fontWeight:800,letterSpacing:'1px',
            background:'#ffc00020',color:'#ffc000',border:'1px solid #ffc00060',
          }}>
            👑 {gridBonusLabel.toUpperCase()} · +{gridBonusBase.toFixed(1)}
          </div>
        )}
        {chuvaResumo && (
          <div title={`${chuvaResumo.leve} laps de chuva leve + ${chuvaResumo.pesada} laps de chuva pesada`} style={{
            padding:'4px 10px',borderRadius:'6px',fontSize:'11px',fontWeight:800,letterSpacing:'1px',
            background:'#00b4ff20',color:'#00b4ff',border:'1px solid #00b4ff60',
          }}>
            🌧️ CHUVA: {chuvaResumo.total} LAPS
          </div>
        )}
        <div style={{marginLeft: 'auto',fontSize:'11px',color:'var(--muted)'}}>
          {pilotsData.length} pilotos · máx {Math.max(...pilotsData.map(p=>p.nVoltas))} voltas
        </div>
      </div>

      <div style={{background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'8px',overflow:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'13px'}}>
          <thead>
            <tr style={{background:'#0a0c18'}}>
              <th style={{padding:'10px 14px',textAlign:'left',color:'var(--muted)',fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',borderBottom:'1px solid var(--border2)',width:'160px'}}>
                PILOTO
              </th>
              {SETORES.map(s=>(
                <th key={s.key} style={{padding:'10px 14px',textAlign:'center',fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',borderBottom:'1px solid var(--border2)',borderLeft:'1px solid var(--border)'}}>
                  <div style={{color:s.color,fontWeight:900}}>{s.label}</div>
                  <div style={{color:'var(--muted)',fontWeight:400,fontSize:'9px',marginTop:'2px'}}>{s.sub}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pilotsData.map((p,i)=>{
              const bonusDano   = calcBonusDano(p.nome, p.posicao);
              const bonusPos    = calcBonusPosicao(p.grid, p.posFinal);
              const bonusGrid   = gridBonusMap[p.nome] || 0;
              const bonusRitmo  = calcBonusRitmo(p);
              const feitos      = calcBonusFeitos(p);
              const bonusFeitos = feitos.valor;
              const chuva       = calcBonusChuva(p);
              const bonusExtras = Math.min(18.0, calcBonusMelhores(p) + calcBonusConsistencia(p.consistencia) +
                calcBonusGanhoVolta2(p) + calcBonusPodioVsRitmo(p) + calcBonusLideranca(p) +
                calcBonusVitoriaForaTop10(p) + calcBonusVitoriaForaTop20(p) + calcBonusMargemVitoria(p) + calcBonusResiliencia(p) +
                chuva.total);
              const extras = detectaExtras(p);
              const dano   = (danoData||{})[p.nome];
              const temDano = dano && dano.total >= 1;
              const temPos  = p.grid && p.posFinal && p.grid !== p.posFinal;
              const ganhou  = temPos && p.grid > p.posFinal;
              const perdeu  = temPos && p.grid < p.posFinal;
              return (
              <tr key={p.nome} style={{borderBottom:'1px solid var(--border)',background:i%2===0?'transparent':'rgba(255,255,255,0.01)'}}>
                <td style={{padding:'10px 14px'}}>
                  <div style={{fontWeight:800,fontSize:'13px',color:'var(--text)',letterSpacing:'.5px'}}>{p.nome}</div>
                  <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px',display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                    <span>P{p.posicao} · {p.nVoltas}v</span>
                    {p.grid && p.posFinal && (
                      <span title={`Largou P${p.grid} · terminou P${p.posFinal}`} style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background: ganhou?'#22c55e20':perdeu?'#e1060020':'transparent',
                        color:      ganhou?'#22c55e'  :perdeu?'#e10600'  :'var(--muted)',
                        border:`1px solid ${ganhou?'#22c55e60':perdeu?'#e1060060':'var(--border)'}`,
                      }}>
                        {ganhou?'▲':perdeu?'▼':'='} P{p.grid}→P{p.posFinal}
                      </span>
                    )}
                    {temDano && (
                      <span title={`Dano total: ${dano.total.toFixed(0)}%`} style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background: dano.nivel==='vermelho'?'#e1060020':dano.nivel==='amarelo'?'#f59e0b20':'#22c55e20',
                        color:      dano.nivel==='vermelho'?'#e10600'  :dano.nivel==='amarelo'?'#f59e0b'  :'#22c55e',
                        border:`1px solid ${dano.nivel==='vermelho'?'#e1060060':dano.nivel==='amarelo'?'#f59e0b60':'#22c55e60'}`,
                      }}>
                        🔧 {dano.total.toFixed(0)}%
                      </span>
                    )}
                    {feitos.tipo === 'hat_trick' && (
                      <span title="Hat-trick: Pole Position + Volta Mais Rápida + Vitória (+3)" style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background:'#c850c020', color:'#c850c0', border:'1px solid #c850c060',
                      }}>
                        🎩 HAT-TRICK
                      </span>
                    )}
                    {feitos.tipo === 'grand_chelem' && (
                      <span title="Grand Chelem: Pole + Volta Mais Rápida + Vitória liderando de ponta a ponta (+10)" style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background:'#ffd70020', color:'#ffd700', border:'1px solid #ffd70060',
                      }}>
                        🏆 GRAND CHELEM
                      </span>
                    )}
                    {chuva.nivelTitulo === 'bom' && (
                      <FeitoBadge emoji="🌧️" label={`BOM NA CHUVA +${chuva.titulo.toFixed(1)}`} color="#4ea8ff"
                        title={`Consistência na chuva: ${chuva.consistencia}% (≥75%) · ${chuva.lapsChuva} laps de chuva`}/>
                    )}
                      {chuva.nivelTitulo === 'rei' && (
                         <FeitoBadge emoji="👑" label={`REI DA CHUVA +${chuva.titulo.toFixed(1)}`} color="#ffc000"
                         title={`2º mais consistente do grid na chuva (${chuva.consistencia}%) · sem perder posições · ${chuva.lapsChuva} laps de chuva`}/>
                     )}
                     {chuva.nivelTitulo === 'deus' && (
                       <FeitoBadge emoji="🌊" label={`DEUS DA CHUVA +${chuva.titulo.toFixed(1)}`} color="#00ffff"
                         title={`Mais consistente do grid na chuva (${chuva.consistencia}%) · sem perder posições · ${chuva.lapsChuva} laps de chuva`}/>
                    )}
                    {chuva.duracao > 0 && (
                      <FeitoBadge emoji="⏱️" label={`CHUVA ${chuva.lapsChuva}L +${chuva.duracao.toFixed(1)}`} color="#00b4ff"
                        title={`${chuva.lapsLeve} laps leve + ${chuva.lapsPesada} laps pesada · bônus de duração × fator posição final`}/>
                    )}
                    {extras.melhorS1 && <FeitoBadge emoji="🥇" label="S1" color="#00d4ff" title="Setor 1 mais rápido da sessão (+0.2)"/>}
                    {extras.melhorS2 && <FeitoBadge emoji="🥇" label="S2" color="#00d4ff" title="Setor 2 mais rápido da sessão (+0.2)"/>}
                    {extras.melhorS3 && <FeitoBadge emoji="🥇" label="S3" color="#00d4ff" title="Setor 3 mais rápido da sessão (+0.2)"/>}
                    {extras.melhorVolta && <FeitoBadge emoji="⚡" label="VOLTA RÁPIDA" color="#39ff14" title="Volta mais rápida da sessão (+0.2)"/>}
                    {extras.bonusConsistencia > 0 && <FeitoBadge emoji="🎯" label={`CONSISTENTE ${p.consistencia}%`} color="#a0ff00" title={`Consistência acima de 98% (+${extras.bonusConsistencia.toFixed(2)})`}/>}
                    {extras.ganhoLargada > 0 && <FeitoBadge emoji="🚀" label={`+${extras.ganhoLargada} NA LARGADA`} color="#22c55e" title={`Ganhou ${extras.ganhoLargada} posições da largada até a volta 2 (+${Math.min(2, extras.ganhoLargada*0.2).toFixed(1)})`}/>}
                    {extras.bonusPodio > 0 && <FeitoBadge emoji="🏅" label="PÓDIO SURPRESA" color="#ffd700" title={`Terminou no pódio sendo o ${extras.rankRitmo}º mais rápido em ritmo (+${extras.bonusPodio.toFixed(1)})`}/>}
                    {extras.bonusLideranca > 0 && <FeitoBadge emoji="👑" label={`LIDEROU ${extras.pctLideradas}%`} color="#ff8c00" title={`Liderou ${extras.pctLideradas}% das voltas (+${extras.bonusLideranca.toFixed(1)})`}/>}
                    {extras.bonusForaTop10 > 0 && <FeitoBadge emoji="🌟" label="FORA DO TOP10" color="#ff1493" title={`Venceu largando de P${p.grid} (+${extras.bonusForaTop10.toFixed(1)})`}/>}
                    {extras.bonusForaTop20 > 0 && <FeitoBadge
                      emoji="🏆" label="FORA DO TOP20" color="#fc1fff"
                      title={`Venceu largando de P${p.grid} (+${extras.bonusForaTop20.toFixed(1)})`} />}
                    {extras.bonusResiliencia > 0 && <FeitoBadge emoji="🛡️" label="RESILIENTE" color="#00e87a" title={`Manteve o ritmo mesmo danificado (+${extras.bonusResiliencia.toFixed(1)})`}/>}
                    {extras.bonusMargem > 0 && <FeitoBadge emoji="🏁" label="MARGEM DE VITÓRIA" color="#00d4ff" title={`Bônus por vencer com margem de ${deltaLider.toFixed(1)}s (+${extras.bonusMargem.toFixed(1)})`}/>}
                  </div>
                </td>
                {SETORES.map(s=>{
                  const bd = s.hasBonus ? bonusDano   : 0;
                  const bp = s.hasBonus ? bonusPos    : 0;
                  const bg = s.hasBonus ? bonusGrid   : 0;
                  const bf = s.hasBonus ? bonusFeitos : 0;
                  const br = s.hasBonus ? bonusRitmo  : 0;
                  const be = s.hasBonus ? bonusExtras : 0;
                  const base = scorePuro(p[s.key], best[s.key]);
                  const sc = s.hasBonus
                    ? scoreFinal(p[s.key], best[s.key], bd, bp, bg, bf, br, be)
                    : (base?.toFixed(1) ?? null);
                  const rk = s.rank[p.nome];
                  return (
                    <td key={s.key} style={{padding:'10px 14px',borderLeft:'1px solid var(--border)',textAlign:'center'}}>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'5px'}}>
                        <ScoreBar val={sc} base={base} bonusDano={bd} bonusPos={bp} bonusGrid={bg} bonusFeitos={bf} bonusRitmo={br} bonusExtras={be} feitosTipo={feitos.tipo}/>
                        <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                          {rk && <RankBadge r={rk}/>}
                          {p[s.key] && <span style={{fontSize:'10px',color:'var(--muted)',fontFamily:'Orbitron,monospace'}}>
                            {p[s.key].toFixed(3)}s
                          </span>}
                        </div>
                        {s.key === 'tot' && ritmoLiderNome && (
                          <span title="Piloto com o ritmo médio (pace) mais rápido do grid" style={{
                            fontSize:'9px',fontWeight:800,color:'#00d4ff',
                          }}>
                            ⏱️ {ritmoLiderNome}
                          </span>
                        )}
                      </div>
                    </td>
                  );
                })}
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{
        marginTop:'12px',
        display:'flex',
        gap:'16px',
        flexWrap:'wrap',
        fontSize:'11px',
        color:'var(--muted)'
      }}>
        <span>👑 17 = PERFECT</span>
        <span>🔥 16 = INSANO</span>
        <span>💗 15 = FENOMENAL</span>
        <span>🟠 14 = LENDÁRIO</span>
        <span>🟣 13 = ELITE</span>
        <span>🩵 10.5-12 = EXCEPCIONAL</span>
        <span>🟢 9-10.5 = MUITO BOM</span>
        <span>🟡 6-9 = BOM</span>
        <span>🟠 4-6 = RUIM</span>
        <span>🔴 0-4 = PÉSSIMO</span>
        <span>🟣 Melhor Setor = +0.2 por setor · máx +0.6</span>
        <span>⚡ Melhor Volta = +0.2</span>
        <span>🎯 Consistência = +0.1 em 98% · +0.2 em 99% · +0.3 em 100%</span>
        <span>🚀 Ganho na Largada = +0.2 por posição ganha até a volta 2</span>
        <span>📈 Ritmo → Resultado = bônus por terminar acima da posição de ritmo · máx +2.0</span>
        <span>👑 Liderança = +0.5 aos 50% → até +1.0 aos 99%+ das voltas lideradas</span>
        <span>🔥 Vitória fora do Top 10 = P11 +1.1 → P22 +2.2</span>
        <span>🏁 Margem de Vitória = +0.5 a cada 5s até 35s · depois +1.0 a cada 5s</span>
        <span>🔧 Resiliência com Dano = manter ritmo mesmo danificado · máx +1.0</span>
        <span>🏁 P19→P2 = largou P19 e terminou P2 · bônus de remontada</span>
        <span>👑 Grid Forte = +0.5 / +1.0 / +2.0</span>
        <span>💀 Grid God Tier = +3.0</span>
        <span>🎩 HAT-TRICK = Pole + Volta Mais Rápida + Vitória · +3</span>
        <span>🏆 GRAND CHELEM = Pole + Volta Mais Rápida + Vitória + liderança de ponta a ponta · +10</span>
        <span>🌧️ Chuva = duração (×1.5 pesada) × fator posição (P1-3=1.0 · P4-10=0.7 · P11+=0.4)</span>
        <span>🌧️ Título chuva (por ranking, sem perder posições): #1 = Deus (+5.0) · #2 = Rei (+3.5) · resto ≥75% = Bom (+2.0)</span>
        <span>⏱️ &lt;nome&gt; = ritmo médio mais rápido do grid · apenas informativo</span>
        <span style={{marginLeft:'auto'}}>
          📊 Score Base = 10.0 · Bônus aplicados somente no Score Geral
        </span>
      </div>
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>

      Quadrado · 1080×1080
    </button>
    <button class="insta-fmt-btn" onclick="instaCap(1080,1350,'retrato')">
      <div class="insta-fmt-icon" style="width:24px;height:28px;">4:5</div>
      Retrato · 1080×1350
    </button>
    <button class="insta-fmt-btn" onclick="instaCap(1080,566,'paisagem')">
      <div class="insta-fmt-icon" style="width:32px;height:20px;">1.9:1</div>
      Paisagem · 1080×566
    </button>
  </div>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

      <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    INSTA
  </button>

<div id="insta-overlay">
  <div id="insta-spinner"></div>
  <div id="insta-overlay-msg">Gerando imagem...</div>
</div>

<script>
(function() {
  document.addEventListener('click', function(e) {
    const btn = document.getElementById('insta-btn');
    if (btn && !btn.contains(e.target)) {
      document.getElementById('insta-formats').classList.remove('open');
    }
  });
})();

async function instaCap(outW, outH, label) {
  document.getElementById('insta-formats').classList.remove('open');
  const overlay = document.getElementById('insta-overlay');
  const msg     = document.getElementById('insta-overlay-msg');
  overlay.classList.add('show');
  msg.textContent = 'Capturando tela...';

  const fab = document.getElementById('insta-btn');
  fab.style.display = 'none';

  try {
    msg.textContent = 'Renderizando...';
    const captureScale = Math.max(4, window.devicePixelRatio * 3);

    const canvas = await html2canvas(document.body, {
      useCORS: true,
      allowTaint: true,
      scale: captureScale,
      backgroundColor: getComputedStyle(document.body).backgroundColor || '#07080f',
      logging: false,
      removeContainer: true,
      imageTimeout: 0,
      letterRendering: true,
    });

    msg.textContent = 'Formatando para Instagram...';

    const pixelRatio = 2;
    const out = document.createElement('canvas');
    out.width  = outW * pixelRatio;
    out.height = outH * pixelRatio;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled  = true;
    ctx.imageSmoothingQuality  = 'high';

    ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#07080f';
    ctx.fillRect(0, 0, out.width, out.height);

    const srcW = canvas.width;
    const srcH = canvas.height;
    const fit  = Math.min((out.width * 0.96) / srcW, (out.height * 0.96) / srcH);
    const dw   = srcW * fit;
    const dh   = srcH * fit;
    const dx   = (out.width  - dw) / 2;
    const dy   = (out.height - dh) / 2;

    ctx.drawImage(canvas, dx, dy, dw, dh);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('F1 Telemetry', outW - 14, outH - 10);

    msg.textContent = 'Salvando...';
    const link = document.createElement('a');
    const ts   = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
    link.download = `f1-${label}-${ts}.png`;
    link.href = out.toDataURL('image/png');
    link.click();

    msg.textContent = '✓ Salvo!';
    await new Promise(r => setTimeout(r, 800));
  } catch(err) {
    console.error(err);
    msg.textContent = 'Erro: ' + err.message;
    await new Promise(r => setTimeout(r, 2000));
  }

  fab.style.display = 'flex';
  overlay.classList.remove('show');
}
</script>
