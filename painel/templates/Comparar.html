<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemetry Insights</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #06070f;
    --panel:     #0d0f1c;
    --border:    #1a1d2e;
    --border2:   #252840;
    --red:       #e10600;
    --blue:      #0090d0;
    --cyan:      #00c8ff;
    --green:     #00e87a;
    --yellow:    #ffc000;
    --orange:    #ff8c00;
    --text:      #e8eaf6;
    --muted:     #5a5d78;
    --label:     #8a8db0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
    );
  }

  #root { max-width: 1400px; margin: 0 auto; padding: 20px; }

  .ti-header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    background: linear-gradient(90deg, #0d0f1c 0%, #0a0c18 100%);
    border: 1px solid var(--border2);
    border-radius: 8px; margin-bottom: 16px;
    box-shadow: 0 0 40px rgba(0,144,208,0.06);
  }
  .ti-logo {
    font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700;
    color: var(--cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    border-left: 3px solid var(--red);
    padding-left: 12px;
  }
  .ti-logo span { color: var(--muted); font-weight: 400; }
  .ti-track { margin-left: auto; font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 22px; font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; border: none; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px;
    transition: all .2s;
  }
  .tab-btn.active {
    background: var(--cyan); color: #000;
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0,200,255,0.3);
  }

  .sess-select-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border2); border-radius: 4px;
    padding: 8px 12px; font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer; outline: none;
    min-width: 200px;
  }
  select:focus { border-color: var(--cyan); }
  .sess-label { color: var(--label); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 12px; }

  .driver-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .driver-pill {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 4px;
    border: 1px solid; cursor: pointer; transition: all .2s;
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .driver-pill.ref  { border-color: var(--red);  background: rgba(225,6,0,0.12);   color: var(--text); }
  .driver-pill.comp { border-color: var(--blue);  background: rgba(0,144,208,0.12); color: var(--text); }
  .driver-pill.idle { border-color: var(--border); background: var(--panel); color: var(--muted); }
  .driver-pill.ref:hover  { background: rgba(225,6,0,0.22); }
  .driver-pill.comp:hover { background: rgba(0,144,208,0.22); }
  .driver-pill.idle:hover { background: var(--border); }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .pill-dot.b { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .badge-ref  { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:700; background:rgba(225,6,0,0.25); color:var(--red); border:1px solid rgba(225,6,0,0.4); }
  .badge-comp { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:700; background:rgba(0,144,208,0.25); color:var(--blue); border:1px solid rgba(0,144,208,0.4); }

  .cmp-bar {
    background: linear-gradient(90deg, rgba(225,6,0,0.08), transparent 40%, rgba(0,144,208,0.08));
    border: 1px solid var(--border2); border-radius: 6px;
    padding: 14px 20px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .cmp-title { font-size: 13px; color: var(--label); font-weight: 600; flex: 1; }
  .cmp-delta { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700; padding: 4px 14px; border-radius: 4px; }
  .cmp-delta.pos { color: var(--blue); background: rgba(0,144,208,0.15); border: 1px solid rgba(0,144,208,0.3); }
  .cmp-delta.neg { color: var(--red);  background: rgba(225,6,0,0.15);   border: 1px solid rgba(225,6,0,0.3); }
  .cmp-delta.zero{ color: var(--green);background: rgba(0,232,122,0.1);  border: 1px solid rgba(0,232,122,0.3); }

  .metric-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .metric-card-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .metric-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .metric-row:last-child { margin-bottom: 0; }
  .metric-name { font-size: 12px; color: var(--label); font-weight: 600; min-width: 110px; flex-shrink: 0; }
  .metric-bar-wrap { flex: 1; position: relative; height: 6px; background: var(--border); border-radius: 3px; overflow: visible; }
  .metric-bar-fill { position: absolute; top: 0; height: 6px; border-radius: 3px; transition: width .5s ease; }
  .metric-bar-fill.r { background: var(--red); left: 0; }

  .sector-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 14px; }

  .sector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .sector-col { text-align: center; }
  .sector-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .sector-delta { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sector-delta.pos  { color: var(--blue); }
  .sector-delta.neg  { color: var(--red); }
  .sector-delta.zero { color: var(--green); }
  .sector-sub { font-size: 11px; color: var(--muted); }

  .lap-table { width: 100%; border-collapse: collapse; }
  .lap-table th { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .lap-table th:first-child { text-align: left; }
  .lap-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; font-family: 'Orbitron', monospace; font-weight: 400; text-align: right; color: var(--text); }
  .lap-table td:first-child { text-align: left; color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 600; }
  .lap-table tr:hover td { background: rgba(255,255,255,0.02); }
  .lap-table .best-lap td { color: var(--yellow); }
  .driver-tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width:900px){ .driver-tables-grid { grid-template-columns: 1fr; } }
  .driver-tbl-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
  .driver-tbl-label.r { background: rgba(225,6,0,0.2); color: var(--red); border: 1px solid rgba(225,6,0,0.3); }
  .driver-tbl-label.b { background: rgba(0,144,208,0.2); color: var(--blue); border: 1px solid rgba(0,144,208,0.3); }

  .pit-icon {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 800;
    background: rgba(225,6,0,0.18); border: 1px solid rgba(225,6,0,0.5);
    color: var(--red); margin-left: 5px; vertical-align: middle; letter-spacing: .3px;
    font-family: 'Rajdhani', sans-serif;
  }
  .pit-loss { color: #ff6b6b; font-size: 9px; }

  .dmg-lap-icon {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: 800;
    vertical-align: middle; margin-left: 4px; cursor: help; letter-spacing: .2px;
    font-family: 'Rajdhani', sans-serif;
  }

  .dmg-impact-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-top: 14px;
  }
  .dmg-impact-title {
    font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--cyan);
    margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  .dmg-impact-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dmg-impact-table th {
    background: #1c1f35; color: var(--muted); text-align: left;
    padding: 7px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  }
  .dmg-impact-table td { padding: 8px 12px; border-bottom: 1px solid var(--border2); vertical-align: middle; }
  .dmg-impact-table tr:last-child td { border: none; }
  .dmg-impact-table tr:hover td { background: rgba(255,255,255,0.02); }
  .impact-bar-wrap { width: 120px; height: 6px; background: var(--border); border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .impact-bar-fill { height: 100%; border-radius: 3px; }
  .impact-val { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; }

  .lap-chart-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .lap-chart-title {
    font-family: 'Orbitron', monospace;
    font-size: 16px; font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .lap-chart-legend {
    display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer; transition: all .2s;
  }
  .legend-item.active { background: rgba(255,255,255,0.05); }
  .legend-item .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-item .legend-x {
    font-size: 10px; color: var(--muted); margin-left: 4px; cursor: pointer;
    font-weight: 700;
  }
  .legend-item .legend-x:hover { color: var(--red); }
  .chart-controls {
    display: flex; gap: 8px; margin-top: 12px; justify-content: center;
  }
  .chart-ctrl-btn {
    padding: 8px 20px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    border: 1px dashed var(--border2);
    background: transparent; color: var(--muted);
    cursor: pointer; border-radius: 4px;
    transition: all .2s;
  }
  .chart-ctrl-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .chart-ctrl-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,200,255,0.08); border-style: solid; }
  .chart-axis-label {
    font-size: 11px; color: var(--muted); font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .chart-toggle-row {
    display: flex; gap: 12px; justify-content: center; margin-top: 8px;
  }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40vh; gap: 16px; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border2); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state h2 { font-family: 'Orbitron', monospace; font-size: 18px; color: var(--border2); margin-bottom: 10px; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .fade-in { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

  .trackmap-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px 16px;
    margin-top: 14px;
  }
  .trackmap-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    text-align: center;
  }
  .trackmap-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 40px 20px;
    line-height: 1.6;
  }
  .trackmap-svg-container {
    width: 100%;
    background: #0a0c18;
    border-radius: 6px;
    border: 1px solid var(--border2);
    overflow: hidden;
  }
</style>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const fmt = (t) => {
  if (!t || t === 0) return '--:--.---';
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(3).padStart(6,'0')}`;
};
const fmtS = (s) => (!s || s === 0) ? '---.---' : s.toFixed(3);
const COLORS = ['#ff8c00','#00b4ff','#00e87a','#e10600','#ffc000','#c850c0','#00ffd5','#ff4081','#7c4dff','#64dd17','#ff6e40','#18ffff','#eeff41','#f50057','#00e5ff','#ffab40','#69f0ae','#ea80fc','#b2ff59','#ff80ab'];

function transformDadosVoltas(raw) {
  const pilotos = (raw.pilotos || []).map((p, idx) => {
    const voltas = (p.voltas || [])
      .filter(v => v.tempo_total && v.tempo_total > 10)
      .map(v => ({
        n: v.numero_volta,
        t: v.tempo_total,
        s1: (v.setor1 && v.setor1 > 0) ? v.setor1 : null,
        s2: (v.setor2 && v.setor2 > 0) ? v.setor2 : null,
        s3: (v.setor3 && v.setor3 > 0) ? v.setor3 : null,
      }));

    const tempos = voltas.map(v => v.t).filter(Boolean);
    const s1s = voltas.map(v => v.s1).filter(Boolean);
    const s2s = voltas.map(v => v.s2).filter(Boolean);
    const s3s = voltas.map(v => v.s3).filter(Boolean);

    const melhor = tempos.length ? Math.min(...tempos) : 0;
    const media = tempos.length ? tempos.reduce((a,b) => a+b, 0) / tempos.length : 0;

    const limpo = media ? tempos.filter(t => t < media * 1.08) : tempos;
    const mediaLimpa = limpo.length ? limpo.reduce((a,b) => a+b, 0) / limpo.length : media;

    let consistencia = 0;
    if (limpo.length > 1 && mediaLimpa > 0) {
      const dp = Math.sqrt(limpo.reduce((s, t) => s + (t - mediaLimpa) ** 2, 0) / limpo.length);
      consistencia = Math.max(0, Math.round((100 - (dp / mediaLimpa * 100)) * 10) / 10);
    }

    let degradacao = 0;
    if (limpo.length >= 3) {
      const n = limpo.length;
      const xm = (n - 1) / 2;
      const ym = limpo.reduce((a,b) => a+b, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) { num += (i - xm) * (limpo[i] - ym); den += (i - xm) ** 2; }
      degradacao = den ? Math.round((num / den) * 10000) / 10000 : 0;
    }

    const avg = (arr) => arr.length ? Math.round(arr.reduce((a,b) => a+b, 0) / arr.length * 1000) / 1000 : 0;
    const best = (arr) => arr.length ? Math.round(Math.min(...arr) * 1000) / 1000 : 0;

    return {
      id: idx,
      nome: p.nome || `Piloto ${idx+1}`,
      numero: p.numero,
      posicao: p.posicao || idx + 1,
      melhor_volta: Math.round(melhor * 1000) / 1000,
      media_volta: Math.round(mediaLimpa * 1000) / 1000,
      consistencia,
      degradacao,
      top_speed: 0,
      avg_s1: avg(s1s),
      avg_s2: avg(s2s),
      avg_s3: avg(s3s),
      best_s1: best(s1s),
      best_s2: best(s2s),
      best_s3: best(s3s),
      total_voltas: tempos.length,
      voltas,
    };
  }).filter(p => p.total_voltas > 0);

  return pilotos;
}

const App = () => {
  const [sessions, setSessions]   = useState([]);
  const [sessId,   setSessId]     = useState(null);
  const [pilotos,  setPilotos]    = useState([]);
  const [sessao,   setSessao]     = useState({});
  const [loading,  setLoading]    = useState(false);
  const [tab,      setTab]        = useState('lapchart');
  const [refIdx,   setRefIdx]     = useState(0);
  const [cmpIdx,   setCmpIdx]     = useState(1);
  const [pitData,  setPitData]    = useState({});
  const [danoData, setDanoData]   = useState({});
  const [danoHist, setDanoHist]   = useState({});
  const [posData,  setPosData]    = useState({});
  const [liderancaData, setLiderancaData] = useState({});
  const [voltasAfetadas, setVoltasAfetadas] = useState(new Set());
  const [deltaLider, setDeltaLider] = useState(null);
  const [periodosChuva, setPeriodosChuva] = useState([]);

  useEffect(() => {
    fetch('/historico_sessoes')
      .then(r => r.json())
      .then(arr => {
        const list = Array.isArray(arr) ? arr : (arr.sessoes || []);
        setSessions(list);
        if (list.length > 0) setSessId(list[0].id);
      }).catch(console.error);
  }, []);

  useEffect(() => {
    if (!sessId) return;
    setLoading(true); setPilotos([]); setSessao({});
    setPitData({}); setDanoData({}); setDanoHist({}); setPosData({}); setLiderancaData({}); setVoltasAfetadas(new Set());
    setDeltaLider(null);
    setPeriodosChuva([]);

    Promise.all([
      fetch(`/dados_voltas/${sessId}`).then(r => r.json()),
      fetch(`/api/pit_stops/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/danos_carro/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/danos_por_volta/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/race_positions/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/bandeiras/${sessId}`).then(r => r.json()).catch(() => ({ bandeiras: [] })),
      fetch(`/api/clima_por_volta/${sessId}`).then(r => r.json()).catch(() => ({ periodos: [] })),
    ]).then(([raw, pits, danos, danosPV, racePos, bandeiras, clima]) => {
      const transformed = transformDadosVoltas(raw);
      setPilotos(transformed);
      setSessao(raw.sessao || {});
      setDeltaLider(raw.sessao?.delta_lider ?? null);
      setRefIdx(0);
      setCmpIdx(transformed.length > 1 ? 1 : 0);

      const pitMap = {};
      (pits.pilotos || []).forEach(p => { pitMap[p.nome] = p.pit_stops || []; });
      setPitData(pitMap);

      const danoMap = {};
      (danos.pilotos || []).forEach(p => { danoMap[p.nome] = p.danos || {}; });
      setDanoData(danoMap);

      const histMap = {};
      (danosPV.pilotos || []).forEach(p => {
        histMap[p.nome] = {};
        (p.voltas || []).forEach(v => { histMap[p.nome][v.numero_volta] = v; });
      });
      setDanoHist(histMap);

      const posMap = {};
      const liderancaMap = {};
      (racePos.pilotos || []).forEach(p => {
        posMap[p.nome] = {
          grid:  p.grid_position || null,
          final: p.pos_final     || null,
          posicoes: p.posicoes || {},
        };
        const posicoes   = p.posicoes || {};
        const voltasNums = Object.keys(posicoes).map(Number).filter(v => v > 0);
        liderancaMap[p.nome] = voltasNums.length > 0 &&
          voltasNums.every(v => posicoes[v] === 1);
      });
      setPosData(posMap);
      setLiderancaData(liderancaMap);

      const NORMAIS = new Set(['Verde', 'Nenhum', 'Azul']);
      const afetadas = new Set();
      (bandeiras.bandeiras || []).forEach(b => {
        if (NORMAIS.has(b.tipo)) return;
        const ini = b.volta_inicio || 0;
        const fim = b.volta_fim || ini;
        for (let v = ini; v <= fim; v++) afetadas.add(v);
      });
      setVoltasAfetadas(afetadas);
      setPeriodosChuva(clima?.periodos || []);

      setLoading(false);
    }).catch(e => { console.error(e); setLoading(false); });
  }, [sessId]);

  const ref  = pilotos[refIdx];
  const comp = pilotos[cmpIdx];
  const sessInfo = sessions.find(s => s.id === sessId) || {};

  const handleDriverClick = (idx) => {
    if (idx === refIdx) return;
    if (idx === cmpIdx) { setCmpIdx(refIdx); setRefIdx(idx); }
    else setCmpIdx(idx);
  };

  return (
    <div>
      <div className="ti-header">
        <div className="ti-logo">Telemetry <span>Insights</span></div>
        <div className="ti-track">{sessInfo.nome_pista || '—'} · {sessInfo.tipo_sessao || '—'}</div>
      </div>

      <div className="tab-bar">
        <button className={`tab-btn ${tab==='lapchart'?'active':''}`} onClick={()=>setTab('lapchart')}>Lap Chart</button>
        <button className={`tab-btn ${tab==='compare'?'active':''}`} onClick={()=>setTab('compare')}>Comparison</button>
        <button className={`tab-btn ${tab==='individual'?'active':''}`} onClick={()=>setTab('individual')}>Individual</button>
        <button className={`tab-btn ${tab==='delta'?'active':''}`} onClick={()=>setTab('delta')}>Delta Chart</button>
        <button className={`tab-btn ${tab==='performance'?'active':''}`} onClick={()=>setTab('performance')}>Performance</button>
      </div>

      <div className="sess-select-row">
        <span className="sess-label">Sessão</span>
        <select value={sessId||''} onChange={e=>setSessId(Number(e.target.value))}>
          {sessions.map(s => (
            <option key={s.id} value={s.id}>#{s.id} — {s.nome_pista || 'Sem pista'} ({s.tipo_sessao || '?'})</option>
          ))}
        </select>
      </div>

      {loading && <div className="loading"><div className="loading-spinner"></div><div className="loading-text">Carregando telemetria...</div></div>}
      {!loading && pilotos.length === 0 && <div className="empty-state"><h2>Sem dados</h2><p>Selecione uma sessão com voltas registradas.</p></div>}

      {!loading && pilotos.length > 0 && (
        <>
          {tab !== 'lapchart' && (
            <div className="driver-row">
              {pilotos.map((p, i) => {
                const cls = i === refIdx ? 'ref' : i === cmpIdx ? 'comp' : 'idle';
                return (
                  <div key={i} className={`driver-pill ${cls}`} onClick={()=>handleDriverClick(i)}>
                    {cls==='ref'  && <div className="pill-dot r"></div>}
                    {cls==='comp' && <div className="pill-dot b"></div>}
                    <span>{p.nome}</span>
                    <span style={{fontFamily:'Orbitron,monospace',fontSize:'12px'}}>{fmt(p.melhor_volta)}</span>
                    {cls==='ref'  && <span className="badge-ref">REF</span>}
                    {cls==='comp' && <span className="badge-comp">{((p.melhor_volta - pilotos[refIdx]?.melhor_volta)||0) >= 0 ? '+' : ''}{((p.melhor_volta - pilotos[refIdx]?.melhor_volta)||0).toFixed(3)}s</span>}
                  </div>
                );
              })}
            </div>
          )}

          {tab === 'lapchart' && <LapChart pilotos={pilotos} />}
          {tab === 'compare' && ref && comp && (
            <>
              <CompareView ref_={ref} comp={comp} />
              <TrackMap trackName={sessInfo.nome_pista} ref_={ref} comp={comp} />
            </>
          )}
          {tab === 'individual' && <IndividualView pilotos={pilotos} refIdx={refIdx} cmpIdx={cmpIdx} pitData={pitData} danoData={danoData} danoHist={danoHist} trackName={sessInfo.nome_pista} />}
          {tab === 'delta' && <DeltaChart pilotos={pilotos} refIdx={refIdx} cmpIdx={cmpIdx} voltasAfetadas={voltasAfetadas} />}
          {tab === 'performance' && <PerformanceView pilotos={pilotos} tipoSessao={sessInfo.tipo_sessao} danoData={danoData} danoHist={danoHist} posData={posData} liderancaData={liderancaData} voltasAfetadas={voltasAfetadas} deltaLider={deltaLider} periodosChuva={periodosChuva} />}
        </>
      )}
    </div>
  );
};

const normalizeTrackKey = (t) =>
  String(t || '').toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Z0-9]/g, '');

const TrackMap = ({ trackName, height = 280, ref_, comp }) => {
  const [segs, setSegs]   = useState(null);
  const [erro, setErro]   = useState(false);

  useEffect(() => {
    if (!trackName) { setSegs([]); return; }
    const key = normalizeTrackKey(trackName);
    if (!key) { setSegs([]); return; }

    let cancelado = false;
    setSegs(null);
    setErro(false);

    fetch(`/api/tracados/${encodeURIComponent(key)}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        if (cancelado) return;
        if (j && j.ok && Array.isArray(j.segmentos)) setSegs(j.segmentos);
        else setSegs([]);
      })
      .catch(() => { if (!cancelado) { setErro(true); setSegs([]); } });

    return () => { cancelado = true; };
  }, [trackName]);

  /* ═══════════════════════════════════════════════════════════════
     ✅ Pega SÓ o maior segmento (= volta mais completa do líder)
     ═══════════════════════════════════════════════════════════════ */
  const maiorSegmento = useMemo(() => {
    if (!segs || !segs.length) return null;
    let maior = segs[0];
    for (const seg of segs) {
      if (Array.isArray(seg) && seg.length > maior.length) maior = seg;
    }
    return Array.isArray(maior) && maior.length > 0 ? maior : null;
  }, [segs]);

  /* Bounds só do maior segmento */
  const bounds = useMemo(() => {
    if (!maiorSegmento || !maiorSegmento.length) return null;
    let minX = +Infinity, maxX = -Infinity, minZ = +Infinity, maxZ = -Infinity;
    for (const p of maiorSegmento) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.z < minZ) minZ = p.z;
      if (p.z > maxZ) maxZ = p.z;
    }
    if (!isFinite(minX)) return null;
    return { minX, maxX, minZ, maxZ };
  }, [maiorSegmento]);

  /* ── Early returns ── */
  if (segs === null) {
    return (
      <div className="trackmap-wrap">
        <div className="trackmap-title">TRACK MAP</div>
        <div className="trackmap-empty">Carregando traçado…</div>
      </div>
    );
  }

  if (!bounds || !maiorSegmento) {
    return (
      <div className="trackmap-wrap">
        <div className="trackmap-title">TRACK MAP</div>
        <div className="trackmap-empty">
          {erro ? 'Falha ao carregar o traçado.' : 'Traçado ainda não registrado para esta pista.'}
          <br />
          <span style={{fontSize:'11px', color:'var(--muted)'}}>
            Abra o <strong>mapa.html</strong> numa corrida nessa pista para o traçado ser aprendido.
          </span>
        </div>
      </div>
    );
  }

  /* ── Escala / conversão world → SVG ── */
  const PAD = 20;
  const W = 1000, H = 500;
  const spanX = (bounds.maxX - bounds.minX) || 1;
  const spanZ = (bounds.maxZ - bounds.minZ) || 1;
  const scale = Math.min((W - PAD * 2) / spanX, (H - PAD * 2) / spanZ);
  const offX  = (W - spanX * scale) / 2 - bounds.minX * scale;
  const offY  = (H - spanZ * scale) / 2 - bounds.minZ * scale;
  const toSVG = (x, z) => [x * scale + offX, z * scale + offY];

  /* ── Divide o MAIOR segmento em 3 setores ── */
  const todosPontos = maiorSegmento;
  const N = todosPontos.length;
  const temComp = ref_ && comp;

  const ds1 = (ref_?.avg_s1 && comp?.avg_s1) ? comp.avg_s1 - ref_.avg_s1 : null;
  const ds2 = (ref_?.avg_s2 && comp?.avg_s2) ? comp.avg_s2 - ref_.avg_s2 : null;
  const ds3 = (ref_?.avg_s3 && comp?.avg_s3) ? comp.avg_s3 - ref_.avg_s3 : null;

  const corSetor = (d) => {
    if (d === null)   return '#ff6b00';
    if (d >  0.005)   return '#0090d0';
    if (d < -0.005)   return '#e10600';
    return '#ff6b00';
  };

  const idx1 = Math.floor(N / 3);
  const idx2 = Math.floor((2 * N) / 3);
  const partes = [
    { pontos: todosPontos.slice(0,     idx1), setor: 1, delta: ds1 },
    { pontos: todosPontos.slice(idx1,  idx2), setor: 2, delta: ds2 },
    { pontos: todosPontos.slice(idx2),        setor: 3, delta: ds3 },
  ];

  const meioSetor = (pontos) => {
    if (!pontos.length) return null;
    const p = pontos[Math.floor(pontos.length / 2)];
    return toSVG(p.x, p.z);
  };

  const pathOf = (pontos) =>
    pontos.length < 2 ? '' :
    pontos.map((p, i) => {
      const [sx, sy] = toSVG(p.x, p.z);
      return `${i === 0 ? 'M' : 'L'}${sx.toFixed(1)},${sy.toFixed(1)}`;
    }).join(' ');

  const pathGeral = pathOf(todosPontos);

  /* Evita labels sobrepostos: distribui S1/S2/S3 em pontos diferentes */
  const meioLabel = (idx) => {
    if (!todosPontos.length) return null;
    // S1 ≈ 16%, S2 ≈ 50%, S3 ≈ 83% do traçado
    const pcts = [0.16, 0.50, 0.83];
    const idx2b = Math.floor(N * pcts[idx]);
    const p = todosPontos[Math.min(idx2b, N - 1)];
    return toSVG(p.x, p.z);
  };

  return (
    <div className="trackmap-wrap">
      <div className="trackmap-title">TRACK MAP · {trackName || '—'}</div>
      <div className="trackmap-svg-container" style={{ height: `${height}px` }}>
        <svg
          viewBox={`0 0 ${W} ${H}`}
          preserveAspectRatio="xMidYMid meet"
          style={{ width: '100%', height: '100%', display: 'block' }}
        >
          {/* Sombra */}
          {pathGeral && (
            <path
              d={pathGeral}
              fill="none"
              stroke="rgba(255,255,255,0.18)"
              strokeWidth="26"
              strokeLinecap="round"
              strokeLinejoin="round"
            />
          )}

          {/* Linha central por setor */}
          {partes.map((parte, i) => {
            const d = pathOf(parte.pontos);
            if (!d) return null;
            const cor = temComp ? corSetor(parte.delta) : '#ff6b00';
            return (
              <path
                key={`linha-${i}`}
                d={d}
                fill="none"
                stroke={cor}
                strokeWidth="5"
                strokeLinecap="round"
                strokeLinejoin="round"
              />
            );
          })}

          {/* Labels S1/S2/S3 com delta (só no modo comparação) */}
          {temComp && partes.map((parte, i) => {
            const meio = meioLabel(i);
            if (!meio) return null;
            const [mx, my] = meio;
            const cor = corSetor(parte.delta);
            const deltaTxt = parte.delta === null ? '—'
              : parte.delta > 0.005 ? `+${parte.delta.toFixed(3)}s`
              : parte.delta < -0.005 ? `${parte.delta.toFixed(3)}s`
              : '0.000s';
            return (
              <g key={`label-${i}`}>
                <rect
                  x={mx - 44} y={my - 18}
                  width="88" height="36"
                  rx="6"
                  fill="rgba(10,12,20,0.9)"
                  stroke={cor}
                  strokeWidth="2"
                />
                <text
                  x={mx} y={my - 3}
                  fill={cor}
                  fontSize="13"
                  fontWeight="800"
                  textAnchor="middle"
                  fontFamily="Orbitron, monospace"
                  letterSpacing="1"
                >
                  S{parte.setor}
                </text>
                <text
                  x={mx} y={my + 12}
                  fill="#fff"
                  fontSize="10"
                  fontWeight="700"
                  textAnchor="middle"
                  fontFamily="Orbitron, monospace"
                >
                  {deltaTxt}
                </text>
              </g>
            );
          })}

          {/* START */}
          {todosPontos.length > 0 && (() => {
            const [sx, sy] = toSVG(todosPontos[0].x, todosPontos[0].z);
            return (
              <>
                <circle cx={sx} cy={sy} r="9" fill="#00e87a" stroke="#000" strokeWidth="3" />
                <text
                  x={sx} y={sy + 30}
                  fill="#00e87a"
                  fontSize="20"
                  fontWeight="800"
                  textAnchor="middle"
                  fontFamily="Orbitron, monospace"
                  letterSpacing="2"
                >
                  START
                </text>
              </>
            );
          })()}
        </svg>
      </div>

      {temComp && (
        <div style={{
          display: 'flex',
          justifyContent: 'center',
          gap: '20px',
          marginTop: '12px',
          fontSize: '11px',
          color: 'var(--muted)',
          flexWrap: 'wrap',
        }}>
          <span style={{display:'flex', alignItems:'center', gap:'6px'}}>
            <span style={{ display:'inline-block', width: 10, height: 10, background: '#e10600', borderRadius: 2 }}/>
            {comp.nome} ganhou
          </span>
          <span style={{display:'flex', alignItems:'center', gap:'6px'}}>
            <span style={{ display:'inline-block', width: 10, height: 10, background: '#0090d0', borderRadius: 2 }}/>
            {ref_.nome} ganhou
          </span>
          <span style={{display:'flex', alignItems:'center', gap:'6px'}}>
            <span style={{ display:'inline-block', width: 10, height: 10, background: '#ff6b00', borderRadius: 2 }}/>
            Empate / sem dado
          </span>
          <span style={{color: '#00c8ff', marginLeft: '12px', fontWeight: 600}}>
            ⚠ Setores aproximados por terço de traçado
          </span>
        </div>
      )}
    </div>
  );
};

const LapChart = ({ pilotos }) => {
  const canvasRef = useRef(null);
  const [selected, setSelected] = useState(() => pilotos.slice(0, 2).map(p => p.nome));
  const [showOutliers, setShowOutliers] = useState(false);
  const [showInvalid, setShowInvalid] = useState(false);
  const [hoverInfo, setHoverInfo] = useState(null);

  useEffect(() => {
    setSelected(pilotos.slice(0, 2).map(p => p.nome));
  }, [pilotos]);

  const toggleDriver = (nome) => {
    setSelected(prev => prev.includes(nome) ? prev.filter(n => n !== nome) : [...prev, nome]);
  };
  const removeDriver = (nome) => {
    setSelected(prev => prev.filter(n => n !== nome));
  };

  const selectedPilotos = useMemo(() =>
    pilotos.filter(p => selected.includes(p.nome)),
  [pilotos, selected]);

  const chartData = useMemo(() => {
    const result = [];
    selectedPilotos.forEach((p) => {
      const color = COLORS[pilotos.indexOf(p) % COLORS.length];
      const voltas = (p.voltas || []).filter(v => v.t && v.t > 10);
      const times = voltas.map(v => v.t).sort((a,b) => a - b);
      const median = times.length > 0 ? times[Math.floor(times.length / 2)] : 0;
      const threshold = median * 1.10;

      const points = voltas.map(v => ({
        lap: v.n,
        time: v.t,
        s1: v.s1, s2: v.s2, s3: v.s3,
        isOutlier: v.t > threshold,
        isInvalid: !v.s1 && !v.s2 && !v.s3,
      }));
      result.push({ nome: p.nome, color, points, best: p.melhor_volta });
    });
    return result;
  }, [selectedPilotos, pilotos]);

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = canvas.offsetHeight * 2;
    ctx.scale(2, 2);
    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0a0c18';
    ctx.fillRect(0, 0, w, h);

    const ml = 70, mr = 20, mt = 20, mb = 50;
    const cw = w - ml - mr;
    const ch = h - mt - mb;

    let allPts = [];
    chartData.forEach(d => {
      d.points.forEach(p => {
        if (!showOutliers && p.isOutlier) return;
        if (!showInvalid && p.isInvalid) return;
        allPts.push(p);
      });
    });

    if (allPts.length === 0) {
      ctx.fillStyle = '#5a5d78';
      ctx.font = '14px Rajdhani';
      ctx.textAlign = 'center';
      ctx.fillText('Selecione pilotos para visualizar', w/2, h/2);
      return;
    }

    const minLap = Math.min(...allPts.map(p => p.lap));
    const maxLap = Math.max(...allPts.map(p => p.lap));
    const minTime = Math.min(...allPts.map(p => p.time));
    const maxTime = Math.max(...allPts.map(p => p.time));
    const timePad = (maxTime - minTime) * 0.08 || 1;
    const tMin = minTime - timePad;
    const tMax = maxTime + timePad;

    const xOf = (lap) => ml + ((lap - minLap) / (maxLap - minLap || 1)) * cw;
    const yOf = (t) => mt + (1 - (t - tMin) / (tMax - tMin)) * ch;

    const nGridH = 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.font = '11px Orbitron';
    ctx.fillStyle = '#5a5d78';
    ctx.textAlign = 'right';
    for (let i = 0; i <= nGridH; i++) {
      const t = tMin + (tMax - tMin) * (i / nGridH);
      const y = yOf(t);
      ctx.beginPath(); ctx.moveTo(ml, y); ctx.lineTo(w - mr, y); ctx.stroke();
      ctx.fillText(fmt(t), ml - 8, y + 4);
    }

    ctx.textAlign = 'center';
    ctx.setLineDash([]);
    const lapStep = Math.max(1, Math.ceil((maxLap - minLap) / 20));
    for (let l = minLap; l <= maxLap; l += lapStep) {
      const x = xOf(l);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.moveTo(x, mt); ctx.lineTo(x, mt + ch); ctx.stroke();
      ctx.fillStyle = '#5a5d78';
      ctx.fillText(`${l}`, x, mt + ch + 18);
    }

    ctx.save();
    ctx.fillStyle = '#8a8db0';
    ctx.font = '12px Rajdhani';
    ctx.textAlign = 'center';
    ctx.fillText('LAP NUMBER', ml + cw / 2, h - 6);
    ctx.translate(14, mt + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('LAP TIME', 0, 0);
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.strokeRect(ml, mt, cw, ch);

    chartData.forEach(d => {
      const pts = d.points.filter(p => {
        if (!showOutliers && p.isOutlier) return false;
        if (!showInvalid && p.isInvalid) return false;
        return true;
      });
      if (pts.length === 0) return;

      ctx.strokeStyle = d.color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xOf(p.lap); const y = yOf(p.time);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      pts.forEach(p => {
        const x = xOf(p.lap); const y = yOf(p.time);
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(x, y, p.isOutlier ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0a0c18'; ctx.lineWidth = 1; ctx.stroke();
      });
    });

    if (hoverInfo) {
      const { x, y, nome, lap, time, color } = hoverInfo;
      ctx.fillStyle = 'rgba(13,15,28,0.95)';
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      const tw = 160, th = 50;
      const tx = Math.min(x + 12, w - tw - 10);
      const ty = Math.max(y - th - 10, 5);
      ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = color; ctx.font = 'bold 11px Rajdhani'; ctx.textAlign = 'left';
      ctx.fillText(nome, tx + 8, ty + 16);
      ctx.fillStyle = '#e8eaf6'; ctx.font = '12px Orbitron';
      ctx.fillText(`V${lap}  ${fmt(time)}`, tx + 8, ty + 36);
    }
  }, [chartData, showOutliers, showInvalid, hoverInfo]);

  useEffect(() => { draw(); }, [draw]);

  const handleMouseMove = useCallback((e) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let closest = null; let minDist = 20;
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    const ml = 70, mr = 20, mt = 20, mb = 50;
    const cw = w - ml - mr, ch = h - mt - mb;

    let allPts = [];
    chartData.forEach(d => {
      d.points.forEach(p => {
        if (!showOutliers && p.isOutlier) return;
        if (!showInvalid && p.isInvalid) return;
        allPts.push({ ...p, nome: d.nome, color: d.color });
      });
    });
    if (allPts.length === 0) { setHoverInfo(null); return; }

    const minLap = Math.min(...allPts.map(p => p.lap));
    const maxLap = Math.max(...allPts.map(p => p.lap));
    const times = allPts.map(p => p.time);
    const minTime = Math.min(...times); const maxTime = Math.max(...times);
    const timePad = (maxTime - minTime) * 0.08 || 1;
    const tMin = minTime - timePad; const tMax = maxTime + timePad;

    allPts.forEach(p => {
      const x = ml + ((p.lap - minLap) / (maxLap - minLap || 1)) * cw;
      const y = mt + (1 - (p.time - tMin) / (tMax - tMin)) * ch;
      const dist = Math.sqrt((mx - x) ** 2 + (my - y) ** 2);
      if (dist < minDist) { minDist = dist; closest = { x, y, nome: p.nome, lap: p.lap, time: p.time, color: p.color }; }
    });
    setHoverInfo(closest);
  }, [chartData, showOutliers, showInvalid]);

  return (
    <div className="lap-chart-container fade-in">
      <div className="lap-chart-title">Lap Chart</div>
      <div className="lap-chart-legend">
        {pilotos.map((p, i) => {
          const color = COLORS[i % COLORS.length];
          const isActive = selected.includes(p.nome);
          return (
            <div key={p.nome} className={`legend-item ${isActive ? 'active' : ''}`}
              onClick={() => toggleDriver(p.nome)}
              style={isActive ? { borderColor: color } : {}}>
              <div className="legend-dot" style={{ background: isActive ? color : 'var(--border)' }}></div>
              <span style={{ color: isActive ? color : 'var(--muted)' }}>{p.nome}</span>
              {isActive && <span className="legend-x" onClick={e => { e.stopPropagation(); removeDriver(p.nome); }}>✕</span>}
            </div>
          );
        })}
      </div>
      <div style={{ position: 'relative', width: '100%', height: '420px' }}>
        <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
          onMouseMove={handleMouseMove} onMouseLeave={() => setHoverInfo(null)} />
      </div>
      <div className="chart-controls">
        <button className={`chart-ctrl-btn ${showOutliers ? 'active' : ''}`}
          onClick={() => setShowOutliers(!showOutliers)}>Show Outliers (&gt;110%)</button>
        <button className={`chart-ctrl-btn ${showInvalid ? 'active' : ''}`}
          onClick={() => setShowInvalid(!showInvalid)}>Show Invalid Laps</button>
      </div>
    </div>
  );
};

const CompareView = ({ ref_, comp }) => {
  const delta = comp.melhor_volta - ref_.melhor_volta;
  const dCls  = delta > 0.01 ? 'pos' : delta < -0.01 ? 'neg' : 'zero';

  const ds1 = comp.avg_s1 && ref_.avg_s1 ? comp.avg_s1 - ref_.avg_s1 : null;
  const ds2 = comp.avg_s2 && ref_.avg_s2 ? comp.avg_s2 - ref_.avg_s2 : null;
  const ds3 = comp.avg_s3 && ref_.avg_s3 ? comp.avg_s3 - ref_.avg_s3 : null;

  const barW = (val, best, worst) => {
    if (worst === best) return 50;
    return Math.round(((val - worst) / (best - worst)) * 100);
  };

  const paceMin = Math.min(ref_.media_volta||999, comp.media_volta||999);
  const paceMax = Math.max(ref_.media_volta||0,   comp.media_volta||0);
  const wRefPace = barW(ref_.media_volta, paceMin, paceMax);
  const wCmpPace = barW(comp.media_volta, paceMin, paceMax);

  return (
    <div className="fade-in">
      <div className="cmp-bar">
        <span className="cmp-title">
          <strong style={{color:'var(--blue)'}}>{comp.nome}</strong>
          {' '}— <em style={{fontFamily:'Orbitron,monospace',fontSize:'13px'}}>{fmt(comp.melhor_volta)}</em>
          {' '}vs{' '}
          <strong style={{color:'var(--red)'}}>{ref_.nome}</strong>
          {' '}— <em style={{fontFamily:'Orbitron, monospace', fontSize:'13px'}}>{fmt(ref_.melhor_volta)}</em>
        </span>
        <span className={`cmp-delta ${dCls}`}>{delta > 0 ? '+' : ''}{delta.toFixed(3)}s</span>
      </div>

      <div className="metrics-grid">
        <div className="metric-card">
          <div className="metric-card-title">Lap Metrics</div>
          <MetricRow label="Avg Lap Time" valA={ref_.media_volta} valB={comp.media_volta} wA={wRefPace} wB={wCmpPace} fmt={v=>fmt(v)} />
          <MetricRow label="Consistência" valA={ref_.consistencia} valB={comp.consistencia} wA={ref_.consistencia} wB={comp.consistencia} fmt={v=>`${v.toFixed(1)}%`} />
        </div>
        <div className="metric-card">
          <div className="metric-card-title">Avg Sector Times</div>
          <MetricRow label="Setor 1" valA={ref_.avg_s1} valB={comp.avg_s1} wA={ref_.avg_s1>comp.avg_s1?60:100} wB={ref_.avg_s1>comp.avg_s1?100:60} fmt={v=>fmtS(v)+'s'} />
          <MetricRow label="Setor 2" valA={ref_.avg_s2} valB={comp.avg_s2} wA={ref_.avg_s2>comp.avg_s2?60:100} wB={ref_.avg_s2>comp.avg_s2?100:60} fmt={v=>fmtS(v)+'s'} />
          <MetricRow label="Setor 3" valA={ref_.avg_s3} valB={comp.avg_s3} wA={ref_.avg_s3>comp.avg_s3?60:100} wB={ref_.avg_s3>comp.avg_s3?100:60} fmt={v=>fmtS(v)+'s'} />
        </div>
        <div className="metric-card">
          <div className="metric-card-title">Race Metrics</div>
          <MetricRow label="Melhor Volta" valA={ref_.melhor_volta} valB={comp.melhor_volta} wA={ref_.melhor_volta<comp.melhor_volta?100:60} wB={comp.melhor_volta<ref_.melhor_volta?100:60} fmt={v=>fmt(v)} />
          <MetricRow label="Degradação" valA={Math.abs(ref_.degradacao||0)} valB={Math.abs(comp.degradacao||0)} wA={Math.abs(ref_.degradacao||0)<Math.abs(comp.degradacao||0)?100:60} wB={Math.abs(comp.degradacao||0)<Math.abs(ref_.degradacao||0)?100:60} fmt={v=>`${v.toFixed(3)}s/v`} />
          <MetricRow label="Total Voltas" valA={ref_.total_voltas} valB={comp.total_voltas} wA={ref_.total_voltas>=comp.total_voltas?100:60} wB={comp.total_voltas>=ref_.total_voltas?100:60} fmt={v=>`${v} laps`} />
        </div>
      </div>

      <div className="sector-panel">
        <div className="sector-panel-title">Sector Time Deltas (vs {ref_.nome})</div>
        <div className="sector-grid">
          {[{label:'Sector 1',d:ds1},{label:'Sector 2',d:ds2},{label:'Sector 3',d:ds3}].map(({label,d})=>{
            const cls=d===null?'zero':d>0.005?'neg':d<-0.005?'pos':'zero';
            const txt=d===null?'N/A':(d>=0?'+':'')+d.toFixed(3)+'s';
            return (
              <div key={label} className="sector-col">
                <div className="sector-label">{label}</div>
                <div className={`sector-delta ${cls}`}>{txt}</div>
                <div className="sector-sub">{d!==null&&(d>0.005?`${comp.nome} mais lento`:d<-0.005?`${comp.nome} mais rápido`:'Idêntico')}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

const MetricRow = ({label,valA,valB,wA,wB,fmt:fmtVal})=>{
  if((!valA||valA===0)&&(!valB||valB===0))return null;
  return(
    <div className="metric-row">
      <div className="metric-name">{label}</div>
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:'4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <div className="pill-dot r" style={{width:'6px',height:'6px'}}></div>
          <div className="metric-bar-wrap"><div className="metric-bar-fill r" style={{width:`${wA}%`}}></div></div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'11px',color:'var(--red)',minWidth:'80px',textAlign:'right'}}>{valA?fmtVal(valA):'—'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <div className="pill-dot b" style={{width:'6px',height:'6px'}}></div>
          <div className="metric-bar-wrap"><div className="metric-bar-fill b" style={{width:`${wB}%`}}></div></div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'11px',color:'var(--blue)',minWidth:'80px',textAlign:'right'}}>{valB?fmtVal(valB):'—'}</span>
        </div>
      </div>
    </div>
  );
};

const IndividualView = ({pilotos, refIdx, cmpIdx, pitData, danoData, danoHist, trackName}) => {
  const ref  = pilotos[refIdx];
  const comp = pilotos[cmpIdx];
  if (!ref || !comp) return null;

  const refMap  = {};
  const compMap = {};
  (ref.voltas  || []).forEach(v => { refMap[v.n]  = v; });
  (comp.voltas || []).forEach(v => { compMap[v.n] = v; });

  const allLaps = [...new Set([
    ...(ref.voltas  || []).map(v => v.n),
    ...(comp.voltas || []).map(v => v.n),
  ])].sort((a, b) => a - b);

  const dColor = (v) =>
    v === null ? 'var(--muted)' : v > 0.005 ? 'var(--red)' : v < -0.005 ? 'var(--green)' : 'var(--cyan)';

  const refPitFull  = pitData[ref.nome]  || [];
  const compPitFull = pitData[comp.nome] || [];
  const refPits     = refPitFull.map(p => p.volta);
  const compPits    = compPitFull.map(p => p.volta);

  const pitLoss = (piloData, pitVoltas, lapMap) => {
    const normal = (piloData.voltas || [])
      .filter(v => !pitVoltas.includes(v.n) && v.t > 10 && v.t < (piloData.media_volta||999) * 1.08)
      .map(v => v.t);
    const avgN = normal.length ? normal.reduce((a,b)=>a+b,0)/normal.length : (piloData.media_volta||0);
    return pitVoltas.reduce((acc,vn) => {
      const v = lapMap[vn];
      if (v && v.t) acc[vn] = v.t - avgN;
      return acc;
    }, {});
  };
  const refPitLoss  = pitLoss(ref,  refPits,  refMap);
  const compPitLoss = pitLoss(comp, compPits, compMap);

  const refHist  = danoHist[ref.nome]  || {};
  const compHist = danoHist[comp.nome] || {};

  const getDanoVolta = (hist, snapDano, lap) => {
    if (Object.keys(hist).length > 0) {
      return hist[lap] || { asa_esquerda:0, asa_direita:0, asa_traseira:0, assoalho:0, difusor:0, sidepods:0 };
    }
    return snapDano || {};
  };

  const totalDano = (d) =>
    (d.asa_esquerda||0)*0.35 + (d.asa_direita||0)*0.35 + (d.asa_traseira||0)*0.15 +
    (d.assoalho||0)*0.2 + (d.difusor||0)*0.15 + (d.sidepods||0)*0.15;

  const nivelDano = (tot) =>
    tot >= 67 ? 'vermelho' : tot >= 34 ? 'amarelo' : tot > 0 ? 'verde' : null;

  const corDanoNivel = (n) =>
    n === 'vermelho' ? '#e10600' : n === 'amarelo' ? '#f59e0b' : '#22c55e';

  const calcImpactPreciso = (piloData, hist, snapDano, pitVoltas) => {
    const voltas = (piloData.voltas || []).filter(v => v.t > 30 && v.t < (piloData.media_volta||999)*1.15);
    if (!voltas.length) return null;

    const useHist = Object.keys(hist).length > 0;

    const semDano = [];
    const comDano = [];
    const danoAcum = {};

    voltas.forEach(v => {
      if (pitVoltas.includes(v.n)) return;
      const d = getDanoVolta(hist, snapDano, v.n);
      const tot = totalDano(d);

      if (tot < 1) {
        semDano.push(v.t);
      } else {
        comDano.push({ t: v.t, d });
        ['asa_esquerda','asa_direita','asa_traseira','assoalho','difusor','sidepods'].forEach(k => {
          if (!danoAcum[k]) danoAcum[k] = [];
          danoAcum[k].push(d[k] || 0);
        });
      }
    });

    if (!semDano.length || !comDano.length) return null;

    const avgSem = semDano.reduce((a,b)=>a+b,0) / semDano.length;
    const avgCom = comDano.reduce((a,v)=>a+v.t,0) / comDano.length;
    const totalLoss = avgCom - avgSem;

    if (Math.abs(totalLoss) < 0.001) return null;

    const partes = [
      { key:'asa_esquerda',  label:'Asa Dianteira Esq' },
      { key:'asa_direita',   label:'Asa Dianteira Dir' },
      { key:'asa_traseira',  label:'Asa Traseira'      },
      { key:'assoalho',      label:'Assoalho'          },
      { key:'difusor',       label:'Difusor'           },
      { key:'sidepods',      label:'Sidepods'          },
    ].map(p => {
      const vals = danoAcum[p.key] || [];
      const avgDano = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      return { ...p, avgDano };
    }).filter(p => p.avgDano > 0.5);

    if (!partes.length) return null;

    const somaDano = partes.reduce((a,p)=>a+p.avgDano,0) || 1;
    return {
      partes: partes.map(p => ({
        ...p,
        loss: totalLoss * (p.avgDano / somaDano),
      })),
      totalLoss,
      nSem: semDano.length,
      nCom: comDano.length,
      avgSem,
      avgCom,
      precisao: useHist ? '100% (histórico real)' : 'estimado (sem histórico)',
    };
  };

  const refImpact  = calcImpactPreciso(ref,  refHist,  danoData[ref.nome],  refPits);
  const compImpact = calcImpactPreciso(comp, compHist, danoData[comp.nome], compPits);
  const maxLoss = Math.max(
    ...(refImpact?.partes  || []).map(p => Math.abs(p.loss)),
    ...(compImpact?.partes || []).map(p => Math.abs(p.loss)),
    0.001
  );

  const renderPitIcon = (lap, pitFull, pitLossMap) => {
    const hit = pitFull.find(p => p.volta === lap);
    if (!hit) return null;
    const loss = pitLossMap[lap];
    return (
      <span className="pit-icon" title={`Pit stop V${lap}${loss ? ` — perdeu ~${loss.toFixed(1)}s` : ''}`}>
        🔴 PIT {loss ? <span className="pit-loss">+{loss.toFixed(1)}s</span> : null}
      </span>
    );
  };

  const renderDmgIcon = (hist, snapDano, lap, pitVoltas) => {
    if (pitVoltas.includes(lap)) return null;
    const d   = getDanoVolta(hist, snapDano, lap);
    const tot = totalDano(d);
    if (tot < 1) return null;
    const nivel = nivelDano(tot);
    const cor   = corDanoNivel(nivel);
    const partes = [];
    if ((d.asa_esquerda||0)>5) partes.push(`Asa E ${(d.asa_esquerda).toFixed(0)}%`);
    if ((d.asa_direita||0)>5)  partes.push(`Asa D ${(d.asa_direita).toFixed(0)}%`);
    if ((d.asa_traseira||0)>5) partes.push(`Asa T ${(d.asa_traseira).toFixed(0)}%`);
    if ((d.assoalho||0)>5)     partes.push(`Assoalho ${(d.assoalho).toFixed(0)}%`);
    if ((d.difusor||0)>5)      partes.push(`Difusor ${(d.difusor).toFixed(0)}%`);
    if ((d.sidepods||0)>5)     partes.push(`Sidepod ${(d.sidepods).toFixed(0)}%`);
    return (
      <span className="dmg-lap-icon"
        style={{ background:`${cor}20`, border:`1px solid ${cor}`, color: cor }}
        title={partes.join(' | ') || `Dano: ${tot.toFixed(0)}%`}>
        🔧{tot.toFixed(0)}%
      </span>
    );
  };

  const ImpactTable = ({ impact, nome, color }) => {
    if (!impact) return (
      <div style={{color:'var(--muted)',fontSize:'12px',padding:'12px 0'}}>
        Sem dano registrado para {nome}.
      </div>
    );
    const isReal = impact.precisao.includes('100%');
    return (
      <div>
        <div style={{fontSize:'11px',marginBottom:'10px',display:'flex',gap:'8px',alignItems:'center'}}>
          <span style={{
            padding:'2px 8px',borderRadius:'4px',fontWeight:700,fontSize:'10px',
            background: isReal ? 'rgba(34,197,94,0.15)' : 'rgba(245,158,11,0.15)',
            color: isReal ? '#22c55e' : '#f59e0b',
            border: `1px solid ${isReal ? '#22c55e' : '#f59e0b'}`
          }}>
            {isReal ? '✅ Precisão 100%' : '⚠️ Estimativa'}
          </span>
          <span style={{color:'var(--muted)'}}>
            {impact.nSem}v sem dano (avg {fmt(impact.avgSem)}) vs {impact.nCom}v com dano (avg {fmt(impact.avgCom)})
          </span>
        </div>
        <div style={{
          padding:'8px 12px',borderRadius:'6px',marginBottom:'12px',
          background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',
          fontSize:'13px',fontWeight:700,
        }}>
          Perda total por volta: <span style={{color: impact.totalLoss > 0 ? '#e10600':'#22c55e',fontFamily:'Orbitron, monospace'}}>
            {impact.totalLoss >= 0 ? '+' : ''}{impact.totalLoss.toFixed(3)}s
          </span>
        </div>
        <table className="dmg-impact-table">
          <thead>
            <tr>
              <th>Peça</th>
              <th>Dano médio</th>
              <th>Perda por volta</th>
            </tr>
          </thead>
          <tbody>
            {impact.partes.map(p => {
              const barW = Math.min(100, Math.abs(p.loss) / maxLoss * 100);
              const cor  = p.avgDano >= 67 ? '#e10600' : p.avgDano >= 34 ? '#f59e0b' : '#22c55e';
              return (
                <tr key={p.key}>
                  <td style={{fontWeight:700,color:'var(--text)'}}>{p.label}</td>
                  <td>
                    <span style={{
                      display:'inline-block',padding:'1px 7px',borderRadius:'4px',
                      background:`${cor}20`,border:`1px solid ${cor}`,
                      color:cor,fontSize:'11px',fontWeight:800,
                    }}>{p.avgDano.toFixed(0)}%</span>
                  </td>
                  <td>
                    <span className="impact-bar-wrap">
                      <span className="impact-bar-fill" style={{width:`${barW}%`,background:color}}/>
                    </span>
                    <span className="impact-val" style={{color}}>
                      {p.loss >= 0 ? '+' : ''}{p.loss.toFixed(3)}s
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div className="fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px',gap:'12px',flexWrap:'wrap'}}>
        <div className="driver-tbl-label r">{ref.nome} — {fmt(ref.melhor_volta)}</div>
        <div className="driver-tbl-label b">{comp.nome} — {fmt(comp.melhor_volta)}</div>
      </div>

      <div style={{background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'8px',overflow:'auto',maxHeight:'600px'}}>
        <table className="lap-table">
          <thead>
            <tr>
              <th style={{textAlign:'center'}}>Volta</th>
              <th><span style={{color:'var(--red)'}}>■</span> {ref.nome}</th>
              <th style={{textAlign:'center'}}>Delta</th>
              <th><span style={{color:'var(--blue)'}}>■</span> {comp.nome}</th>
            </tr>
          </thead>
          <tbody>
            {allLaps.map(lap => {
              const r  = refMap[lap];
              const c  = compMap[lap];
              const rT = r ? r.t : null;
              const cT = c ? c.t : null;
              const delta = (rT && cT) ? cT - rT : null;
              const isRefBest  = rT && rT === ref.melhor_volta;
              const isCompBest = cT && cT === comp.melhor_volta;

              return (
                <tr key={lap} style={{background:(isRefBest||isCompBest)?'rgba(255,192,0,0.06)':'transparent'}}>
                  <td style={{textAlign:'center',fontFamily:'Rajdhani,sans-serif',fontWeight:'700',color:'var(--label)'}}>
                    V{lap}
                  </td>
                  <td style={{color:isRefBest?'var(--yellow)':'var(--text)',fontWeight:isRefBest?'700':'400'}}>
                    {rT ? fmt(rT) : '—'}
                    {renderPitIcon(lap, refPitFull,  refPitLoss)}
                    {renderDmgIcon(refHist,  danoData[ref.nome],  lap, refPits)}
                  </td>
                  <td style={{textAlign:'center',fontFamily:'Orbitron,monospace',fontSize:'12px',fontWeight:'700',color:dColor(delta)}}>
                    {delta===null ? '—' : `${delta>=0?'+':''}${delta.toFixed(3)}s`}
                  </td>
                  <td style={{color:isCompBest?'var(--yellow)':'var(--text)',fontWeight:isCompBest?'700':'400'}}>
                    {cT ? fmt(cT) : '—'}
                    {renderPitIcon(lap, compPitFull, compPitLoss)}
                    {renderDmgIcon(compHist, danoData[comp.nome], lap, compPits)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{display:'flex',gap:'16px',justifyContent:'center',marginTop:'10px',flexWrap:'wrap'}}>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--green)'}}>■</span> {comp.nome} mais rápido</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--red)'}}>■</span> {comp.nome} mais lento</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--yellow)'}}>■</span> Melhor volta</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}>🔴 PIT = pit stop · +Xs = tempo perdido</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}>🔧 = dano ativo nessa volta (some quando pit repara)</span>
      </div>

      <TrackMap trackName={trackName} ref_={ref} comp={comp} />

      {(refImpact || compImpact) && (
        <div className="dmg-impact-panel">
          <div className="dmg-impact-title">⚙️ Impacto do Dano no Ritmo</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
            <div>
              <div style={{color:'var(--red)',fontWeight:700,fontSize:'12px',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'1px'}}>
                {ref.nome}
              </div>
              <ImpactTable impact={refImpact}  nome={ref.nome}  color="var(--red)"  />
            </div>
            <div>
              <div style={{color:'var(--blue)',fontWeight:700,fontSize:'12px',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'1px'}}>
                {comp.nome}
              </div>
              <ImpactTable impact={compImpact} nome={comp.nome} color="var(--blue)" />
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const DeltaChart = ({ pilotos, refIdx, cmpIdx, voltasAfetadas }) => {
  const [modo, setModo] = useState('best');

  const CORES_PILOTO = [
    '#27F4D2','#E8002D','#3671C6','#FF8000','#229971',
    '#FF87BC','#64C4FF','#6692FF','#52E252','#B6BABD',
    '#C92D4B','#00D4FF','#FFC000','#C850C0','#00FFD5',
    '#FF4081','#7C4DFF','#64DD17','#FF6E40','#18FFFF',
  ];

  const shortCodeLocal = (nome) => {
    if (!nome) return '???';
    const p = nome.trim().split(/\s+/);
    const base = p.length > 1 ? p[p.length - 1] : p[0];
    return base.substring(0, 3).toUpperCase();
  };

  const calcMedia = (voltas, campo) => {
    const semSC = (voltas || []).filter(v => !voltasAfetadas || !voltasAfetadas.has(v.n));
    const base  = semSC.length ? semSC : (voltas || []);
    const raw = base.map(v => v[campo]).filter(v => v && v > 1 && v < 300);
    if (!raw.length) return null;
    const ordenado = [...raw].sort((a, b) => a - b);
    const mediana  = ordenado[Math.floor(ordenado.length / 2)];
    const limpo = raw.filter(v => v <= mediana * 1.10 && v >= mediana * 0.90);
    return limpo.length ? limpo.reduce((a, b) => a + b, 0) / limpo.length : null;
  };

  const pilotosComMedia = useMemo(() => {
    return pilotos.map(p => ({
      ...p,
      _avg_s1_filt: calcMedia(p.voltas, 's1'),
      _avg_s2_filt: calcMedia(p.voltas, 's2'),
      _avg_s3_filt: calcMedia(p.voltas, 's3'),
    }));
  }, [pilotos, voltasAfetadas]);

  const SECTORS = [
    { keyBest: 'best_s1', keyAvg: '_avg_s1_filt', label: 'Sector 1', sub: 'Curvas lentas',    color: '#0090d0' },
    { keyBest: 'best_s2', keyAvg: '_avg_s2_filt', label: 'Sector 2', sub: 'Curvas médias',    color: '#00e87a' },
    { keyBest: 'best_s3', keyAvg: '_avg_s3_filt', label: 'Sector 3', sub: 'Retas / alta vel', color: '#ffc000' },
  ];

  return (
    <div className="fade-in">
      <div style={{ display: 'flex', gap: '6px', marginBottom: '16px', justifyContent: 'center' }}>
        <button
          onClick={() => setModo('best')}
          style={{
            padding: '8px 22px',
            fontFamily: "'Rajdhani', sans-serif",
            fontSize: '13px', fontWeight: 700,
            letterSpacing: '1px', textTransform: 'uppercase',
            border: '1px solid',
            borderColor: modo === 'best' ? 'var(--cyan)' : 'var(--border)',
            background: modo === 'best' ? 'var(--cyan)' : 'var(--panel)',
            color: modo === 'best' ? '#000' : 'var(--muted)',
            borderRadius: '4px', cursor: 'pointer',
            transition: 'all .2s',
            boxShadow: modo === 'best' ? '0 0 16px rgba(0,200,255,0.3)' : 'none',
          }}
        >⚡ Melhor Volta</button>
        <button
          onClick={() => setModo('avg')}
          style={{
            padding: '8px 22px',
            fontFamily: "'Rajdhani', sans-serif",
            fontSize: '13px', fontWeight: 700,
            letterSpacing: '1px', textTransform: 'uppercase',
            border: '1px solid',
            borderColor: modo === 'avg' ? 'var(--cyan)' : 'var(--border)',
            background: modo === 'avg' ? 'var(--cyan)' : 'var(--panel)',
            color: modo === 'avg' ? '#000' : 'var(--muted)',
            borderRadius: '4px', cursor: 'pointer',
            transition: 'all .2s',
            boxShadow: modo === 'avg' ? '0 0 16px rgba(0,200,255,0.3)' : 'none',
          }}
        >📊 Média filtrada</button>
      </div>

      {SECTORS.map(sec => {
        const chaveAtiva = modo === 'best' ? sec.keyBest : sec.keyAvg;

        const temposValidos = pilotosComMedia
          .map(p => p[chaveAtiva])
          .filter(v => Number.isFinite(v) && v > 0)
          .sort((a, b) => a - b);

        const medianaSetor = temposValidos.length
          ? temposValidos[Math.floor(temposValidos.length / 2)]
          : 30;

        const MIN_ACEITAVEL = medianaSetor * 0.5;

        const dados = pilotosComMedia
          .map((p, idx) => {
            const raw = p[chaveAtiva];
            const valido = Number.isFinite(raw) && raw >= MIN_ACEITAVEL;
            return {
              nome: p.nome,
              code: shortCodeLocal(p.nome),
              cor: CORES_PILOTO[idx % CORES_PILOTO.length],
              tempo: valido ? raw : null,
            };
          })
          .sort((a, b) => {
            if (a.tempo === null && b.tempo === null) return 0;
            if (a.tempo === null) return 1;
            if (b.tempo === null) return -1;
            return a.tempo - b.tempo;
          });

        if (!dados.length) return null;

        const validos = dados.filter(d => d.tempo !== null);
        const melhorTempo = validos.length ? validos[0].tempo : 0;
        const piorTempo  = validos.length ? validos[validos.length - 1].tempo : 0;

        const yMin = validos.length ? Math.floor(melhorTempo) - 1 : 0;
        const yMax = validos.length ? Math.ceil(piorTempo) : 1;
        const rangeY = Math.max(0.001, yMax - yMin);

        const gridLines = [];
        for (let v = Math.ceil(yMin); v <= Math.floor(yMax); v++) {
          gridLines.push(v);
        }

        return (
          <div key={sec.label} style={{
            background: 'var(--panel)',
            border: '1px solid var(--border)',
            borderRadius: '8px',
            padding: '16px 20px 14px',
            marginBottom: '16px',
          }}>
            <div style={{
              fontFamily: 'Orbitron, monospace',
              fontSize: '14px', fontWeight: 700,
              color: sec.color, marginBottom: '16px',
              letterSpacing: '1.5px', textTransform: 'uppercase',
              textAlign: 'center',
            }}>
              {sec.label} (s)
              <span style={{ fontSize: '10px', color: 'var(--muted)', fontWeight: 400, marginLeft: '10px', letterSpacing: '0.5px' }}>
                · {sec.sub}
              </span>
              <span style={{
                fontSize: '9px', marginLeft: '10px',
                padding: '2px 8px', borderRadius: '3px',
                background: modo === 'best' ? 'rgba(0,200,255,0.15)' : 'rgba(0,232,122,0.15)',
                color: modo === 'best' ? '#00c8ff' : '#00e87a',
                fontWeight: 800, letterSpacing: '0.5px',
                verticalAlign: 'middle',
              }}>
                {modo === 'best' ? 'MELHOR' : 'MÉDIA FILTRADA'}
              </span>
            </div>

            <div style={{ display: 'flex', gap: '8px' }}>
              <div style={{ position: 'relative', width: '38px', height: '240px', flexShrink: 0 }}>
                {gridLines.map(v => {
                  const pct = ((yMax - v) / rangeY) * 100;
                  return (
                    <span key={v} style={{
                      position: 'absolute', right: 0, top: `${pct}%`,
                      transform: 'translateY(-50%)',
                      fontSize: '9px', color: 'var(--muted)',
                      fontFamily: 'Orbitron, monospace',
                    }}>{v}</span>
                  );
                })}
              </div>

              <div style={{
                flex: 1, position: 'relative', height: '240px',
                display: 'flex', alignItems: 'flex-end',
                justifyContent: 'space-around', gap: '4px',
                borderLeft: '1px solid rgba(255,255,255,0.08)',
                borderBottom: '1px solid rgba(255,255,255,0.18)',
                paddingLeft: '10px', paddingRight: '10px',
              }}>
                {gridLines.map(v => {
                  const pct = ((yMax - v) / rangeY) * 100;
                  return (
                    <div key={v} style={{
                      position: 'absolute', left: 0, right: 0, top: `${pct}%`,
                      borderTop: '1px dashed rgba(255,255,255,0.06)',
                      pointerEvents: 'none',
                    }}/>
                  );
                })}

                {dados.map((d) => {
                  const semDado = d.tempo === null;
                  const isBest = !semDado && d.tempo === melhorTempo;
                  const alturaPct = semDado ? 0 : ((d.tempo - yMin) / rangeY) * 100;

                  return (
                    <div key={d.nome} style={{
                      display: 'flex', flexDirection: 'column',
                      alignItems: 'center', flex: 1, maxWidth: '44px',
                      height: '100%', justifyContent: 'flex-end',
                      position: 'relative', zIndex: 1,
                    }}>
                      <span style={{
                        fontSize: '10px',
                        fontFamily: 'Orbitron, monospace',
                        fontWeight: 800,
                        color: semDado ? 'var(--muted)' : (isBest ? '#fff' : 'var(--text)'),
                        marginBottom: '4px', whiteSpace: 'nowrap',
                        textShadow: isBest ? '0 0 6px rgba(255,255,255,0.6)' : 'none',
                      }}>
                        {semDado ? '—' : d.tempo.toFixed(2)}
                      </span>

                      {semDado ? (
                        <div style={{
                          width: '100%', height: '8%',
                          background: 'repeating-linear-gradient(45deg, #2a2a3a 0px, #2a2a3a 4px, #1a1a25 4px, #1a1a25 8px)',
                          borderRadius: '3px 3px 0 0',
                          border: '1px solid rgba(255,255,255,0.06)',
                          opacity: 0.6,
                        }}/>
                      ) : (
                        <div style={{
                          width: '100%', height: `${alturaPct}%`,
                          background: isBest
                            ? 'linear-gradient(180deg, #ffffff 0%, #c8c8c8 100%)'
                            : `linear-gradient(180deg, ${d.cor} 0%, ${d.cor}66 100%)`,
                          borderRadius: '3px 3px 0 0',
                          transition: 'height 0.4s ease',
                          boxShadow: isBest
                            ? '0 0 14px rgba(255,255,255,0.4)'
                            : `0 0 8px ${d.cor}40`,
                        }}/>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{
              display: 'flex', justifyContent: 'space-around', gap: '4px',
              paddingLeft: '48px', paddingRight: '10px', marginTop: '8px',
            }}>
              {dados.map((d) => {
                const semDado = d.tempo === null;
                const isBest = !semDado && d.tempo === melhorTempo;
                const deltaBest = semDado ? null : d.tempo - melhorTempo;

                const corDelta = semDado
                  ? 'var(--muted)'
                  : isBest
                    ? '#00e87a'
                    : deltaBest < 0.10 ? '#23e07a'
                    : deltaBest < 0.30 ? '#ffd400'
                    : deltaBest < 0.70 ? '#ff8c00'
                    :                    '#ff4444';

                return (
                  <div key={d.nome} style={{
                    flex: 1, maxWidth: '44px', textAlign: 'center',
                    display: 'flex', flexDirection: 'column',
                    alignItems: 'center', gap: '2px',
                  }}>
                    <span style={{
                      fontSize: '11px', fontWeight: 900,
                      letterSpacing: '0.5px',
                      color: semDado ? 'var(--muted)' : (isBest ? '#fff' : d.cor),
                    }}>{d.code}</span>

                    <span style={{
                      fontSize: '10px',
                      fontFamily: 'Orbitron, monospace',
                      fontWeight: 900, letterSpacing: '0.3px',
                      color: corDelta,
                      textShadow: semDado || !isBest
                        ? (semDado ? 'none' : `0 0 6px ${corDelta}80`)
                        : '0 0 8px rgba(0,232,122,0.8)',
                      padding: '1px 4px', borderRadius: '2px',
                      background: semDado
                        ? 'rgba(255,255,255,0.03)'
                        : isBest
                          ? 'rgba(0,232,122,0.12)'
                          : `${corDelta}18`,
                      border: `1px solid ${
                        semDado ? 'rgba(255,255,255,0.08)'
                        : isBest ? 'rgba(0,232,122,0.3)'
                        : `${corDelta}50`
                      }`,
                    }}>
                      {semDado ? 'SEM DADO' : (isBest ? 'BEST' : `+${deltaBest.toFixed(2)}`)}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <div style={{
        display: 'flex', gap: '20px', justifyContent: 'center',
        marginTop: '12px', fontSize: '11px',
        color: 'var(--muted)', flexWrap: 'wrap',
      }}>
        <span>
          <span style={{
            display: 'inline-block', width: 10, height: 10,
            background: '#fff', borderRadius: 2,
            marginRight: 6, verticalAlign: 'middle',
            boxShadow: '0 0 6px rgba(255,255,255,0.5)',
          }}/>
          Melhor tempo do setor
        </span>
        <span style={{ color: '#00e87a' }}>BEST = melhor tempo</span>
        <span style={{ color: '#ffd400' }}>+0.30s = muito próximo</span>
        <span style={{ color: '#ff8c00' }}>+0.70s = diferença notável</span>
        <span style={{ color: '#ff4444' }}>+0.70s ou mais = grande</span>
        <span style={{ color: 'var(--muted)' }}>▨ SEM DADO = sem registro</span>
        {modo === 'avg' && (
          <span style={{ color: '#00c8ff', marginLeft: 'auto' }}>
            📊 Média filtrada: exclui SC/bandeiras + outliers ±10% da mediana
          </span>
        )}
      </div>
    </div>
  );
};

const PerformanceView = ({ pilotos, tipoSessao, danoData, danoHist, posData, liderancaData, voltasAfetadas, deltaLider, periodosChuva }) => {
  if (!pilotos.length) return <div style={{color:'var(--muted)',padding:'40px',textAlign:'center'}}>Sem dados</div>;

  const calcMedia = (voltas, campo) => {
    const semSC = (voltas||[]).filter(v => !voltasAfetadas || !voltasAfetadas.has(v.n));
    const base  = semSC.length ? semSC : (voltas || []);
    const raw = base.map(v=>v[campo]).filter(v=>v&&v>1&&v<300);
    if (!raw.length) return null;
    const ordenado = [...raw].sort((a,b)=>a-b);
    const mediana  = ordenado[Math.floor(ordenado.length/2)];
    const limpo    = raw.filter(v => v <= mediana * 1.10 && v >= mediana * 0.90);
    return limpo.length ? limpo.reduce((a,b)=>a+b,0)/limpo.length : null;
  };

  const pilotsDataBruto = pilotos.map(p => {
    const pos = (posData || {})[p.nome] || {};
    return {
      nome:    p.nome,
      posicao: p.posicao || p.position || 99,
      grid:    pos.grid  || null,
      posFinal:pos.final || p.posicao || null,
      melhorVolta: p.melhor_volta || null,
      consistencia: p.consistencia || 0,
      voltas: p.voltas || [],
      s1:  calcMedia(p.voltas, 's1'),
      s2:  calcMedia(p.voltas, 's2'),
      s3:  calcMedia(p.voltas, 's3'),
      tot: calcMedia(p.voltas, 't'),
      nVoltas: (p.voltas||[]).filter(v=>v.t&&v.t>30).length,
    };
  }).filter(p => p.tot !== null);

  const isRace = String(tipoSessao || '').trim().toLowerCase() === 'race';
  const maxVoltasCorrida = Math.max(...pilotsDataBruto.map(p => p.nVoltas), 0);
  const pilotsData = pilotsDataBruto
    .filter(p => !isRace || p.nVoltas >= maxVoltasCorrida)
    .sort((a,b) => (a.posicao||99)-(b.posicao||99));

  if (!pilotsData.length) return (
    <div style={{color:'var(--muted)',padding:'40px',textAlign:'center'}}>
      Nenhum dado de volta disponível para esta sessão.
    </div>
  );

  const bestMelhorVolta = (() => {
    const vals = pilotsData.map(p => p.melhorVolta).filter(v => v && v > 0);
    return vals.length ? Math.min(...vals) : null;
  })();

  const bestSano = (campo) => {
    const vals = pilotsData.filter(p => p[campo]).map(p => p[campo]).sort((a,b) => a-b);
    if (!vals.length) return null;
    const mediana = vals[Math.floor(vals.length / 2)];
    const sane = vals.filter(v => v >= mediana * 0.85);
    return sane.length ? Math.min(...sane) : Math.min(...vals);
  };

  const best = {
    s1:  bestSano('s1'),
    s2:  bestSano('s2'),
    s3:  bestSano('s3'),
    tot: bestSano('tot'),
  };

  const scorePuro = (val, bestVal) => {
    if (!val || !bestVal) return null;
    const diffPct = ((val - bestVal) / bestVal) * 100;
    return Math.max(0, Math.min(10, 10 - diffPct * 2));
  };

  const calcBonusDano = (nome, posicao) => {
    const d = (danoData || {})[nome];
    if (!d || !d.total || d.total < 1) return 0;
    const pos = posicao || 99;
    const fator = pos <= 3 ? 1.0 : pos <= 6 ? 0.7 : pos <= 10 ? 0.4 : 0.1;
    return Math.min(1.5, (d.total / 100) * fator * 1.5);
  };

  const PTS_POR_POSICAO   = 0.12;
  const BONUS_POS_MAX     = 2.5;
  const PENALTY_POS_MAX   = -2.0;
  const FATOR_PERDA       = 1.25;

  const calcBonusPosicao = (grid, posFinal) => {
    if (!grid || !posFinal || grid <= 0 || posFinal <= 0) return 0;
    const delta = grid - posFinal;
    if (delta === 0) return 0;
    if (delta > 0) {
      const fatorProgressivo = 1 + Math.min(delta, 20) / 20;
      return Math.min(BONUS_POS_MAX, delta * PTS_POR_POSICAO * fatorProgressivo);
    }
    return Math.max(PENALTY_POS_MAX, delta * PTS_POR_POSICAO * FATOR_PERDA);
  };

  const BONUS_HATTRICK     = 3.0;
  const BONUS_GRAND_CHELEM = 11.0;

  const calcBonusFeitos = (p) => {
    const pole   = p.grid === 1;
    const vmr    = bestMelhorVolta !== null && !!p.melhorVolta && Math.abs(p.melhorVolta - bestMelhorVolta) < 0.0005;
    const venceu = p.posFinal === 1;
    const hatTrick    = pole && vmr && venceu;
    const liderouTudo = !!(liderancaData || {})[p.nome];
    const grandChelem = hatTrick && liderouTudo;
