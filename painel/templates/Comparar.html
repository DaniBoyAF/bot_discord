<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const fmt = (t) => {
  if (!t || t === 0) return '--:--.---';
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(3).padStart(6,'0')}`;
};
const fmtS = (s) => (!s || s === 0) ? '---.---' : s.toFixed(3);
const COLORS = ['#ff8c00','#00b4ff','#00e87a','#e10600','#ffc000','#c850c0','#00ffd5','#ff4081','#7c4dff','#64dd17','#ff6e40','#18ffff','#eeff41','#f50057','#00e5ff','#ffab40','#69f0ae','#ea80fc','#b2ff59','#ff80ab'];

// ─── Transforma dados do /dados_voltas em formato interno ───
function transformDadosVoltas(raw) {
  const pilotos = (raw.pilotos || []).map((p, idx) => {
    const voltas = (p.voltas || [])
      .filter(v => v.tempo_total && v.tempo_total > 10)
      .map(v => ({
        n: v.numero_volta,
        t: v.tempo_total,
        s1: (v.setor1 && v.setor1 > 0) ? v.setor1 : null,
        s2: (v.setor2 && v.setor2 > 0) ? v.setor2 : null,
        s3: (v.setor3 && v.setor3 > 0) ? v.setor3 : null,
      }));

    const tempos = voltas.map(v => v.t).filter(Boolean);
    const s1s = voltas.map(v => v.s1).filter(Boolean);
    const s2s = voltas.map(v => v.s2).filter(Boolean);
    const s3s = voltas.map(v => v.s3).filter(Boolean);

    const melhor = tempos.length ? Math.min(...tempos) : 0;
    const media = tempos.length ? tempos.reduce((a,b) => a+b, 0) / tempos.length : 0;

    // Remove outliers
    const limpo = media ? tempos.filter(t => t < media * 1.08) : tempos;
    const mediaLimpa = limpo.length ? limpo.reduce((a,b) => a+b, 0) / limpo.length : media;

    // Consistência
    let consistencia = 0;
    if (limpo.length > 1 && mediaLimpa > 0) {
      const dp = Math.sqrt(limpo.reduce((s, t) => s + (t - mediaLimpa) ** 2, 0) / limpo.length);
      consistencia = Math.max(0, Math.round((100 - (dp / mediaLimpa * 100)) * 10) / 10);
    }

    // Degradação (slope)
    let degradacao = 0;
    if (limpo.length >= 3) {
      const n = limpo.length;
      const xm = (n - 1) / 2;
      const ym = limpo.reduce((a,b) => a+b, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) { num += (i - xm) * (limpo[i] - ym); den += (i - xm) ** 2; }
      degradacao = den ? Math.round((num / den) * 10000) / 10000 : 0;
    }

    const avg = (arr) => arr.length ? Math.round(arr.reduce((a,b) => a+b, 0) / arr.length * 1000) / 1000 : 0;
    const best = (arr) => arr.length ? Math.round(Math.min(...arr) * 1000) / 1000 : 0;

    return {
      id: idx,
      nome: p.nome || `Piloto ${idx+1}`,
      numero: p.numero,
      posicao: p.posicao || idx + 1,
      melhor_volta: Math.round(melhor * 1000) / 1000,
      media_volta: Math.round(mediaLimpa * 1000) / 1000,
      consistencia,
      degradacao,
      top_speed: 0,
      avg_s1: avg(s1s),
      avg_s2: avg(s2s),
      avg_s3: avg(s3s),
      best_s1: best(s1s),
      best_s2: best(s2s),
      best_s3: best(s3s),
      total_voltas: tempos.length,
      voltas,
    };
  }).filter(p => p.total_voltas > 0);

  return pilotos;
}

// ─── MAIN APP ───────────────────────────────────────
const App = () => {
  const [sessions, setSessions]   = useState([]);
  const [sessId,   setSessId]     = useState(null);
  const [pilotos,  setPilotos]    = useState([]);
  const [sessao,   setSessao]     = useState({});
  const [loading,  setLoading]    = useState(false);
  const [tab,      setTab]        = useState('lapchart');
  const [refIdx,   setRefIdx]     = useState(0);
  const [cmpIdx,   setCmpIdx]     = useState(1);
  const [pitData,  setPitData]    = useState({});
  const [danoData, setDanoData]   = useState({});
  const [danoHist, setDanoHist]   = useState({}); // histórico REAL: {nome:{volta:{ asa_esquerda,...}}}
  const [posData,  setPosData]    = useState({}); // grid → final: {nome:{grid, final}}

  useEffect(() => {
    fetch('/historico_sessoes')
      .then(r => r.json())
      .then(arr => {
        const list = Array.isArray(arr) ? arr : (arr.sessoes || []);
        setSessions(list);
        if (list.length > 0) setSessId(list[0].id);
      }).catch(console.error);
  }, []);

  useEffect(() => {
    if (!sessId) return;
    setLoading(true); setPilotos([]); setSessao({});
    setPitData({}); setDanoData({}); setDanoHist({}); setPosData({});

    Promise.all([
      fetch(`/dados_voltas/${sessId}`).then(r => r.json()),
      fetch(`/api/pit_stops/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/danos_carro/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/danos_por_volta/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
      fetch(`/api/race_positions/${sessId}`).then(r => r.json()).catch(() => ({ pilotos: [] })),
    ]).then(([raw, pits, danos, danosPV, racePos]) => {
      console.log('📊 dados_voltas:', raw);
      const transformed = transformDadosVoltas(raw);
      setPilotos(transformed);
      setSessao(raw.sessao || {});
      setRefIdx(0);
      setCmpIdx(transformed.length > 1 ? 1 : 0);

      const pitMap = {};
      (pits.pilotos || []).forEach(p => { pitMap[p.nome] = p.pit_stops || []; });
      setPitData(pitMap);

      const danoMap = {};
      (danos.pilotos || []).forEach(p => { danoMap[p.nome] = p.danos || {}; });
      setDanoData(danoMap);

      // histórico real: { nomePiloto: { numero_volta: { asa_esquerda,... } } }
      const histMap = {};
      (danosPV.pilotos || []).forEach(p => {
        histMap[p.nome] = {};
        (p.voltas || []).forEach(v => { histMap[p.nome][v.numero_volta] = v; });
      });
      setDanoHist(histMap);

      // posição de largada (grid) vs posição final: { nome: { grid, final } }
      const posMap = {};
      (racePos.pilotos || []).forEach(p => {
        posMap[p.nome] = {
          grid:  p.grid_position || null,
          final: p.pos_final     || null,
        };
      });
      setPosData(posMap);

      setLoading(false);
    }).catch(e => { console.error(e); setLoading(false); });
  }, [sessId]);

  const ref  = pilotos[refIdx];
  const comp = pilotos[cmpIdx];
  const sessInfo = sessions.find(s => s.id === sessId) || {};

  const handleDriverClick = (idx) => {
    if (idx === refIdx) return;
    if (idx === cmpIdx) { setCmpIdx(refIdx); setRefIdx(idx); }
    else setCmpIdx(idx);
  };

  return (
    <div>
      <div className="ti-header">
        <div className="ti-logo">Telemetry <span>Insights</span></div>
        <div className="ti-track">{sessInfo.nome_pista || '—'} · {sessInfo.tipo_sessao || '—'}</div>
      </div>

      <div className="tab-bar">
        <button className={`tab-btn ${tab==='lapchart'?'active':''}`} onClick={()=>setTab('lapchart')}>Lap Chart</button>
        <button className={`tab-btn ${tab==='compare'?'active':''}`} onClick={()=>setTab('compare')}>Comparison</button>
        <button className={`tab-btn ${tab==='individual'?'active':''}`} onClick={()=>setTab('individual')}>Individual</button>
        <button className={`tab-btn ${tab==='delta'?'active':''}`} onClick={()=>setTab('delta')}>Delta Chart</button>
        <button className={`tab-btn ${tab==='performance'?'active':''}`} onClick={()=>setTab('performance')}>Performance</button>
      </div>

      <div className="sess-select-row">
        <span className="sess-label">Sessão</span>
        <select value={sessId||''} onChange={e=>setSessId(Number(e.target.value))}>
          {sessions.map(s => (
            <option key={s.id} value={s.id}>#{s.id} — {s.nome_pista || 'Sem pista'} ({s.tipo_sessao || '?'})</option>
          ))}
        </select>
      </div>

      {loading && <div className="loading"><div className="loading-spinner"></div><div className="loading-text">Carregando telemetria...</div></div>}
      {!loading && pilotos.length === 0 && <div className="empty-state"><h2>Sem dados</h2><p>Selecione uma sessão com voltas registradas.</p></div>}

      {!loading && pilotos.length > 0 && (
        <>
          {tab !== 'lapchart' && (
            <div className="driver-row">
              {pilotos.map((p, i) => {
                const cls = i === refIdx ? 'ref' : i === cmpIdx ? 'comp' : 'idle';
                return (
                  <div key={i} className={`driver-pill ${cls}`} onClick={()=>handleDriverClick(i)}>
                    {cls==='ref'  && <div className="pill-dot r"></div>}
                    {cls==='comp' && <div className="pill-dot b"></div>}
                    <span>{p.nome}</span>
                    <span style={{fontFamily:'Orbitron,monospace',fontSize:'12px'}}>{fmt(p.melhor_volta)}</span>
                    {cls==='ref'  && <span className="badge-ref">REF</span>}
                    {cls==='comp' && <span className="badge-comp">{((p.melhor_volta - pilotos[refIdx]?.melhor_volta)||0) >= 0 ? '+' : ''}{((p.melhor_volta - pilotos[refIdx]?.melhor_volta)||0).toFixed(3)}s</span>}
                  </div>
                );
              })}
            </div>
          )}

          {tab === 'lapchart' && <LapChart pilotos={pilotos} />}
          {tab === 'compare' && ref && comp && <CompareView ref_={ref} comp={comp} />}
          {tab === 'individual' && <IndividualView pilotos={pilotos} refIdx={refIdx} cmpIdx={cmpIdx} pitData={pitData} danoData={danoData} danoHist={danoHist} />}
          {tab === 'delta' && <DeltaChart pilotos={pilotos} refIdx={refIdx} cmpIdx={cmpIdx} />}
          {tab === 'performance' && <PerformanceView pilotos={pilotos} tipoSessao={sessInfo.tipo_sessao} danoData={danoData} posData={posData} />}
        </>
      )}
    </div>
  );
};

// ─── LAP CHART (canvas) ─────────────────────────────
const LapChart = ({ pilotos }) => {
  const canvasRef = useRef(null);
  const [selected, setSelected] = useState(() => pilotos.slice(0, 2).map(p => p.nome));
  const [showOutliers, setShowOutliers] = useState(false);
  const [showInvalid, setShowInvalid] = useState(false);
  const [hoverInfo, setHoverInfo] = useState(null);

  // Reset selection when pilotos change
  useEffect(() => {
    setSelected(pilotos.slice(0, 2).map(p => p.nome));
  }, [pilotos]);

  const toggleDriver = (nome) => {
    setSelected(prev => prev.includes(nome) ? prev.filter(n => n !== nome) : [...prev, nome]);
  };
  const removeDriver = (nome) => {
    setSelected(prev => prev.filter(n => n !== nome));
  };

  const selectedPilotos = useMemo(() =>
    pilotos.filter(p => selected.includes(p.nome)),
  [pilotos, selected]);

  const chartData = useMemo(() => {
    const result = [];
    selectedPilotos.forEach((p) => {
      const color = COLORS[pilotos.indexOf(p) % COLORS.length];
      const voltas = (p.voltas || []).filter(v => v.t && v.t > 10);
      const times = voltas.map(v => v.t).sort((a,b) => a - b);
      const median = times.length > 0 ? times[Math.floor(times.length / 2)] : 0;
      const threshold = median * 1.10;

      const points = voltas.map(v => ({
        lap: v.n,
        time: v.t,
        s1: v.s1, s2: v.s2, s3: v.s3,
        isOutlier: v.t > threshold,
        isInvalid: !v.s1 && !v.s2 && !v.s3,
      }));
      result.push({ nome: p.nome, color, points, best: p.melhor_volta });
    });
    return result;
  }, [selectedPilotos, pilotos]);

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = canvas.offsetHeight * 2;
    ctx.scale(2, 2);
    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0a0c18';
    ctx.fillRect(0, 0, w, h);

    const ml = 70, mr = 20, mt = 20, mb = 50;
    const cw = w - ml - mr;
    const ch = h - mt - mb;

    let allPts = [];
    chartData.forEach(d => {
      d.points.forEach(p => {
        if (!showOutliers && p.isOutlier) return;
        if (!showInvalid && p.isInvalid) return;
        allPts.push(p);
      });
    });

    if (allPts.length === 0) {
      ctx.fillStyle = '#5a5d78';
      ctx.font = '14px Rajdhani';
      ctx.textAlign = 'center';
      ctx.fillText('Selecione pilotos para visualizar', w/2, h/2);
      return;
    }

    const minLap = Math.min(...allPts.map(p => p.lap));
    const maxLap = Math.max(...allPts.map(p => p.lap));
    const minTime = Math.min(...allPts.map(p => p.time));
    const maxTime = Math.max(...allPts.map(p => p.time));
    const timePad = (maxTime - minTime) * 0.08 || 1;
    const tMin = minTime - timePad;
    const tMax = maxTime + timePad;

    const xOf = (lap) => ml + ((lap - minLap) / (maxLap - minLap || 1)) * cw;
    const yOf = (t) => mt + (1 - (t - tMin) / (tMax - tMin)) * ch;

    // grid H
    const nGridH = 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.font = '11px Orbitron';
    ctx.fillStyle = '#5a5d78';
    ctx.textAlign = 'right';
    for (let i = 0; i <= nGridH; i++) {
      const t = tMin + (tMax - tMin) * (i / nGridH);
      const y = yOf(t);
      ctx.beginPath(); ctx.moveTo(ml, y); ctx.lineTo(w - mr, y); ctx.stroke();
      ctx.fillText(fmt(t), ml - 8, y + 4);
    }

    // grid V
    ctx.textAlign = 'center';
    ctx.setLineDash([]);
    const lapStep = Math.max(1, Math.ceil((maxLap - minLap) / 20));
    for (let l = minLap; l <= maxLap; l += lapStep) {
      const x = xOf(l);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.moveTo(x, mt); ctx.lineTo(x, mt + ch); ctx.stroke();
      ctx.fillStyle = '#5a5d78';
      ctx.fillText(`${l}`, x, mt + ch + 18);
    }

    // labels
    ctx.save();
    ctx.fillStyle = '#8a8db0';
    ctx.font = '12px Rajdhani';
    ctx.textAlign = 'center';
    ctx.fillText('LAP NUMBER', ml + cw / 2, h - 6);
    ctx.translate(14, mt + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('LAP TIME', 0, 0);
    ctx.restore();

    // border
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.strokeRect(ml, mt, cw, ch);

    // lines + dots
    chartData.forEach(d => {
      const pts = d.points.filter(p => {
        if (!showOutliers && p.isOutlier) return false;
        if (!showInvalid && p.isInvalid) return false;
        return true;
      });
      if (pts.length === 0) return;

      ctx.strokeStyle = d.color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xOf(p.lap); const y = yOf(p.time);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      pts.forEach(p => {
        const x = xOf(p.lap); const y = yOf(p.time);
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(x, y, p.isOutlier ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0a0c18'; ctx.lineWidth = 1; ctx.stroke();
      });
    });

    // tooltip
    if (hoverInfo) {
      const { x, y, nome, lap, time, color } = hoverInfo;
      ctx.fillStyle = 'rgba(13,15,28,0.95)';
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      const tw = 160, th = 50;
      const tx = Math.min(x + 12, w - tw - 10);
      const ty = Math.max(y - th - 10, 5);
      ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = color; ctx.font = 'bold 11px Rajdhani'; ctx.textAlign = 'left';
      ctx.fillText(nome, tx + 8, ty + 16);
      ctx.fillStyle = '#e8eaf6'; ctx.font = '12px Orbitron';
      ctx.fillText(`V${lap}  ${fmt(time)}`, tx + 8, ty + 36);
    }
  }, [chartData, showOutliers, showInvalid, hoverInfo]);

  useEffect(() => { draw(); }, [draw]);

  const handleMouseMove = useCallback((e) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let closest = null; let minDist = 20;
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    const ml = 70, mr = 20, mt = 20, mb = 50;
    const cw = w - ml - mr, ch = h - mt - mb;

    let allPts = [];
    chartData.forEach(d => {
      d.points.forEach(p => {
        if (!showOutliers && p.isOutlier) return;
        if (!showInvalid && p.isInvalid) return;
        allPts.push({ ...p, nome: d.nome, color: d.color });
      });
    });
    if (allPts.length === 0) { setHoverInfo(null); return; }

    const minLap = Math.min(...allPts.map(p => p.lap));
    const maxLap = Math.max(...allPts.map(p => p.lap));
    const times = allPts.map(p => p.time);
    const minTime = Math.min(...times); const maxTime = Math.max(...times);
    const timePad = (maxTime - minTime) * 0.08 || 1;
    const tMin = minTime - timePad; const tMax = maxTime + timePad;

    allPts.forEach(p => {
      const x = ml + ((p.lap - minLap) / (maxLap - minLap || 1)) * cw;
      const y = mt + (1 - (p.time - tMin) / (tMax - tMin)) * ch;
      const dist = Math.sqrt((mx - x) ** 2 + (my - y) ** 2);
      if (dist < minDist) { minDist = dist; closest = { x, y, nome: p.nome, lap: p.lap, time: p.time, color: p.color }; }
    });
    setHoverInfo(closest);
  }, [chartData, showOutliers, showInvalid]);

  return (
    <div className="lap-chart-container fade-in">
      <div className="lap-chart-title">Lap Chart</div>
      <div className="lap-chart-legend">
        {pilotos.map((p, i) => {
          const color = COLORS[i % COLORS.length];
          const isActive = selected.includes(p.nome);
          return (
            <div key={p.nome} className={`legend-item ${isActive ? 'active' : ''}`}
              onClick={() => toggleDriver(p.nome)}
              style={isActive ? { borderColor: color } : {}}>
              <div className="legend-dot" style={{ background: isActive ? color : 'var(--border)' }}></div>
              <span style={{ color: isActive ? color : 'var(--muted)' }}>{p.nome}</span>
              {isActive && <span className="legend-x" onClick={e => { e.stopPropagation(); removeDriver(p.nome); }}>✕</span>}
            </div>
          );
        })}
      </div>
      <div style={{ position: 'relative', width: '100%', height: '420px' }}>
        <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
          onMouseMove={handleMouseMove} onMouseLeave={() => setHoverInfo(null)} />
      </div>
      <div className="chart-controls">
        <button className={`chart-ctrl-btn ${showOutliers ? 'active' : ''}`}
          onClick={() => setShowOutliers(!showOutliers)}>Show Outliers (&gt;110%)</button>
        <button className={`chart-ctrl-btn ${showInvalid ? 'active' : ''}`}
          onClick={() => setShowInvalid(!showInvalid)}>Show Invalid Laps</button>
      </div>
    </div>
  );
};

// ─── COMPARISON VIEW ─────────────────────────────────
const CompareView = ({ ref_, comp }) => {
  const delta = comp.melhor_volta - ref_.melhor_volta;
  const dCls  = delta > 0.01 ? 'pos' : delta < -0.01 ? 'neg' : 'zero';

  const ds1 = comp.avg_s1 && ref_.avg_s1 ? comp.avg_s1 - ref_.avg_s1 : null;
  const ds2 = comp.avg_s2 && ref_.avg_s2 ? comp.avg_s2 - ref_.avg_s2 : null;
  const ds3 = comp.avg_s3 && ref_.avg_s3 ? comp.avg_s3 - ref_.avg_s3 : null;

  const barW = (val, best, worst) => {
    if (worst === best) return 50;
    return Math.round(((val - worst) / (best - worst)) * 100);
  };

  const paceMin = Math.min(ref_.media_volta||999, comp.media_volta||999);
  const paceMax = Math.max(ref_.media_volta||0,   comp.media_volta||0);
  const wRefPace = barW(ref_.media_volta, paceMin, paceMax);
  const wCmpPace = barW(comp.media_volta, paceMin, paceMax);

  return (
    <div className="fade-in">
      <div className="cmp-bar">
        <span className="cmp-title">
          <strong style={{color:'var(--blue)'}}>{comp.nome}</strong>
          {' '}— <em style={{fontFamily:'Orbitron,monospace',fontSize:'13px'}}>{fmt(comp.melhor_volta)}</em>
          {' '}vs{' '}
          <strong style={{color:'var(--red)'}}>{ref_.nome}</strong>
          {' '}— <em style={{fontFamily:'Orbitron,monospace',fontSize:'13px'}}>{fmt(ref_.melhor_volta)}</em>
        </span>
        <span className={`cmp-delta ${dCls}`}>{delta > 0 ? '+' : ''}{delta.toFixed(3)}s</span>
      </div>

      <div className="metrics-grid">
        <div className="metric-card">
          <div className="metric-card-title">Lap Metrics</div>
          <MetricRow label="Avg Lap Time" valA={ref_.media_volta} valB={comp.media_volta} wA={wRefPace} wB={wCmpPace} fmt={v=>fmt(v)} />
          <MetricRow label="Consistência" valA={ref_.consistencia} valB={comp.consistencia} wA={ref_.consistencia} wB={comp.consistencia} fmt={v=>`${v.toFixed(1)}%`} />
        </div>
        <div className="metric-card">
          <div className="metric-card-title">Avg Sector Times</div>
          <MetricRow label="Setor 1" valA={ref_.avg_s1} valB={comp.avg_s1} wA={ref_.avg_s1>comp.avg_s1?60:100} wB={ref_.avg_s1>comp.avg_s1?100:60} fmt={v=>fmtS(v)+'s'} />
          <MetricRow label="Setor 2" valA={ref_.avg_s2} valB={comp.avg_s2} wA={ref_.avg_s2>comp.avg_s2?60:100} wB={ref_.avg_s2>comp.avg_s2?100:60} fmt={v=>fmtS(v)+'s'} />
          <MetricRow label="Setor 3" valA={ref_.avg_s3} valB={comp.avg_s3} wA={ref_.avg_s3>comp.avg_s3?60:100} wB={ref_.avg_s3>comp.avg_s3?100:60} fmt={v=>fmtS(v)+'s'} />
        </div>
        <div className="metric-card">
          <div className="metric-card-title">Race Metrics</div>
          <MetricRow label="Melhor Volta" valA={ref_.melhor_volta} valB={comp.melhor_volta} wA={ref_.melhor_volta<comp.melhor_volta?100:60} wB={comp.melhor_volta<ref_.melhor_volta?100:60} fmt={v=>fmt(v)} />
          <MetricRow label="Degradação" valA={Math.abs(ref_.degradacao||0)} valB={Math.abs(comp.degradacao||0)} wA={Math.abs(ref_.degradacao||0)<Math.abs(comp.degradacao||0)?100:60} wB={Math.abs(comp.degradacao||0)<Math.abs(ref_.degradacao||0)?100:60} fmt={v=>`${v.toFixed(3)}s/v`} />
          <MetricRow label="Total Voltas" valA={ref_.total_voltas} valB={comp.total_voltas} wA={ref_.total_voltas>=comp.total_voltas?100:60} wB={comp.total_voltas>=ref_.total_voltas?100:60} fmt={v=>`${v} laps`} />
        </div>
      </div>

      <div className="sector-panel">
        <div className="sector-panel-title">Sector Time Deltas (vs {ref_.nome})</div>
        <div className="sector-grid">
          {[{label:'Sector 1',d:ds1},{label:'Sector 2',d:ds2},{label:'Sector 3',d:ds3}].map(({label,d})=>{
            const cls=d===null?'zero':d>0.005?'neg':d<-0.005?'pos':'zero';
            const txt=d===null?'N/A':(d>=0?'+':'')+d.toFixed(3)+'s';
            return (
              <div key={label} className="sector-col">
                <div className="sector-label">{label}</div>
                <div className={`sector-delta ${cls}`}>{txt}</div>
                <div className="sector-sub">{d!==null&&(d>0.005?`${comp.nome} mais lento`:d<-0.005?`${comp.nome} mais rápido`:'Idêntico')}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

// ─── METRIC ROW ──────────────────────────────────────
const MetricRow = ({label,valA,valB,wA,wB,fmt:fmtVal})=>{
  if((!valA||valA===0)&&(!valB||valB===0))return null;
  return(
    <div className="metric-row">
      <div className="metric-name">{label}</div>
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:'4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <div className="pill-dot r" style={{width:'6px',height:'6px'}}></div>
          <div className="metric-bar-wrap"><div className="metric-bar-fill r" style={{width:`${wA}%`}}></div></div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'11px',color:'var(--red)',minWidth:'80px',textAlign:'right'}}>{valA?fmtVal(valA):'—'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <div className="pill-dot b" style={{width:'6px',height:'6px'}}></div>
          <div className="metric-bar-wrap"><div className="metric-bar-fill b" style={{width:`${wB}%`}}></div></div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'11px',color:'var(--blue)',minWidth:'80px',textAlign:'right'}}>{valB?fmtVal(valB):'—'}</span>
        </div>
      </div>
    </div>
  );
};

// ─── INDIVIDUAL VIEW ─────────────────────────────────
const IndividualView = ({pilotos, refIdx, cmpIdx, pitData, danoData, danoHist}) => {
  const ref  = pilotos[refIdx];
  const comp = pilotos[cmpIdx];
  if (!ref || !comp) return null;

  const refMap  = {};
  const compMap = {};
  (ref.voltas  || []).forEach(v => { refMap[v.n]  = v; });
  (comp.voltas || []).forEach(v => { compMap[v.n] = v; });

  const allLaps = [...new Set([
    ...(ref.voltas  || []).map(v => v.n),
    ...(comp.voltas || []).map(v => v.n),
  ])].sort((a, b) => a - b);

  const dColor = (v) =>
    v === null ? 'var(--muted)' : v > 0.005 ? 'var(--red)' : v < -0.005 ? 'var(--green)' : 'var(--cyan)';

  // ── Pit helpers ────────────────────────────────────────────────────────────
  const refPitFull  = pitData[ref.nome]  || [];
  const compPitFull = pitData[comp.nome] || [];
  const refPits     = refPitFull.map(p => p.volta);
  const compPits    = compPitFull.map(p => p.volta);

  const pitLoss = (piloData, pitVoltas, lapMap) => {
    const normal = (piloData.voltas || [])
      .filter(v => !pitVoltas.includes(v.n) && v.t > 10 && v.t < (piloData.media_volta||999) * 1.08)
      .map(v => v.t);
    const avgN = normal.length ? normal.reduce((a,b)=>a+b,0)/normal.length : (piloData.media_volta||0);
    return pitVoltas.reduce((acc,vn) => {
      const v = lapMap[vn];
      if (v && v.t) acc[vn] = v.t - avgN;
      return acc;
    }, {});
  };
  const refPitLoss  = pitLoss(ref,  refPits,  refMap);
  const compPitLoss = pitLoss(comp, compPits, compMap);

  // ── Damage helpers (usando histórico REAL volta a volta) ───────────────────
  const refHist  = danoHist[ref.nome]  || {};  // { numero_volta: { asa_esquerda,... } }
  const compHist = danoHist[comp.nome] || {};

  // Pega o dano de um piloto numa volta específica
  // Se não há histórico, cai no snapshot atual (retrocompat)
  const getDanoVolta = (hist, snapDano, lap) => {
    if (Object.keys(hist).length > 0) {
      return hist[lap] || { asa_esquerda:0, asa_direita:0, asa_traseira:0, assoalho:0, difusor:0, sidepods:0 };
    }
    // fallback: spread do snapshot para todas as voltas (comportamento antigo)
    return snapDano || {};
  };

  const totalDano = (d) =>
    (d.asa_esquerda||0)*0.35 + (d.asa_direita||0)*0.35 + (d.asa_traseira||0)*0.15 +
    (d.assoalho||0)*0.2 + (d.difusor||0)*0.15 + (d.sidepods||0)*0.15;

  const nivelDano = (tot) =>
    tot >= 67 ? 'vermelho' : tot >= 34 ? 'amarelo' : tot > 0 ? 'verde' : null;

  const corDanoNivel = (n) =>
    n === 'vermelho' ? '#e10600' : n === 'amarelo' ? '#f59e0b' : '#22c55e';

  // ── Tabela de impacto de dano — cálculo 100% preciso ──────────────────────
  // Para cada piloto, separa voltas em 3 grupos usando o histórico real:
  //   semDano  = voltas onde TODAS as peças = 0
  //   comDano  = voltas onde alguma peça > 0 (excluindo voltas de pit)
  // Isso isola o efeito do dano: mesmo piloto, mesma corrida, antes e depois da quebra.
  const calcImpactPreciso = (piloData, hist, snapDano, pitVoltas) => {
    const voltas = (piloData.voltas || []).filter(v => v.t > 30 && v.t < (piloData.media_volta||999)*1.15);
    if (!voltas.length) return null;

    const useHist = Object.keys(hist).length > 0;

    const semDano = [];
    const comDano = [];
    const danoAcum = {}; // { 'asa_esquerda': [val_volta1, val_volta2, ...] }

    voltas.forEach(v => {
      if (pitVoltas.includes(v.n)) return; // exclui voltas de pit
      const d = getDanoVolta(hist, snapDano, v.n);
      const tot = totalDano(d);

      if (tot < 1) {
        semDano.push(v.t);
      } else {
        comDano.push({ t: v.t, d });
        // acumula valores de dano por peça
        ['asa_esquerda','asa_direita','asa_traseira','assoalho','difusor','sidepods'].forEach(k => {
          if (!danoAcum[k]) danoAcum[k] = [];
          danoAcum[k].push(d[k] || 0);
        });
      }
    });

    if (!semDano.length || !comDano.length) return null;

    const avgSem = semDano.reduce((a,b)=>a+b,0) / semDano.length;
    const avgCom = comDano.reduce((a,v)=>a+v.t,0) / comDano.length;
    const totalLoss = avgCom - avgSem;

    if (Math.abs(totalLoss) < 0.001) return null;

    // Média de cada peça nas voltas com dano
    const partes = [
      { key:'asa_esquerda',  label:'Asa Dianteira Esq' },
      { key:'asa_direita',   label:'Asa Dianteira Dir' },
      { key:'asa_traseira',  label:'Asa Traseira'      },
      { key:'assoalho',      label:'Assoalho'          },
      { key:'difusor',       label:'Difusor'           },
      { key:'sidepods',      label:'Sidepods'          },
    ].map(p => {
      const vals = danoAcum[p.key] || [];
      const avgDano = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      return { ...p, avgDano };
    }).filter(p => p.avgDano > 0.5);

    if (!partes.length) return null;

    const somaDano = partes.reduce((a,p)=>a+p.avgDano,0) || 1;
    return {
      partes: partes.map(p => ({
        ...p,
        loss: totalLoss * (p.avgDano / somaDano),
      })),
      totalLoss,
      nSem: semDano.length,
      nCom: comDano.length,
      avgSem,
      avgCom,
      precisao: useHist ? '100% (histórico real)' : 'estimado (sem histórico)',
    };
  };

  const refImpact  = calcImpactPreciso(ref,  refHist,  danoData[ref.nome],  refPits);
  const compImpact = calcImpactPreciso(comp, compHist, danoData[comp.nome], compPits);
  const maxLoss = Math.max(
    ...(refImpact?.partes  || []).map(p => Math.abs(p.loss)),
    ...(compImpact?.partes || []).map(p => Math.abs(p.loss)),
    0.001
  );

  // ── Render helpers ─────────────────────────────────────────────────────────
  const renderPitIcon = (lap, pitFull, pitLossMap) => {
    const hit = pitFull.find(p => p.volta === lap);
    if (!hit) return null;
    const loss = pitLossMap[lap];
    return (
      <span className="pit-icon" title={`Pit stop V${lap}${loss ? ` — perdeu ~${loss.toFixed(1)}s` : ''}`}>
        🔴 PIT {loss ? <span className="pit-loss">+{loss.toFixed(1)}s</span> : null}
      </span>
    );
  };

  const renderDmgIcon = (hist, snapDano, lap, pitVoltas) => {
    if (pitVoltas.includes(lap)) return null;
    const d   = getDanoVolta(hist, snapDano, lap);
    const tot = totalDano(d);
    if (tot < 1) return null;
    const nivel = nivelDano(tot);
    const cor   = corDanoNivel(nivel);
    const partes = [];
    if ((d.asa_esquerda||0)>5) partes.push(`Asa E ${(d.asa_esquerda).toFixed(0)}%`);
    if ((d.asa_direita||0)>5)  partes.push(`Asa D ${(d.asa_direita).toFixed(0)}%`);
    if ((d.asa_traseira||0)>5) partes.push(`Asa T ${(d.asa_traseira).toFixed(0)}%`);
    if ((d.assoalho||0)>5)     partes.push(`Assoalho ${(d.assoalho).toFixed(0)}%`);
    if ((d.difusor||0)>5)      partes.push(`Difusor ${(d.difusor).toFixed(0)}%`);
    if ((d.sidepods||0)>5)     partes.push(`Sidepod ${(d.sidepods).toFixed(0)}%`);
    return (
      <span className="dmg-lap-icon"
        style={{ background:`${cor}20`, border:`1px solid ${cor}`, color: cor }}
        title={partes.join(' | ') || `Dano: ${tot.toFixed(0)}%`}>
        🔧{tot.toFixed(0)}%
      </span>
    );
  };

  const ImpactTable = ({ impact, nome, color }) => {
    if (!impact) return (
      <div style={{color:'var(--muted)',fontSize:'12px',padding:'12px 0'}}>
        Sem dano registrado para {nome}.
      </div>
    );
    const isReal = impact.precisao.includes('100%');
    return (
      <div>
        <div style={{fontSize:'11px',marginBottom:'10px',display:'flex',gap:'8px',alignItems:'center'}}>
          <span style={{
            padding:'2px 8px',borderRadius:'4px',fontWeight:700,fontSize:'10px',
            background: isReal ? 'rgba(34,197,94,0.15)' : 'rgba(245,158,11,0.15)',
            color: isReal ? '#22c55e' : '#f59e0b',
            border: `1px solid ${isReal ? '#22c55e' : '#f59e0b'}`
          }}>
            {isReal ? '✅ Precisão 100%' : '⚠️ Estimativa'}
          </span>
          <span style={{color:'var(--muted)'}}>
            {impact.nSem}v sem dano (avg {fmt(impact.avgSem)}) vs {impact.nCom}v com dano (avg {fmt(impact.avgCom)})
          </span>
        </div>
        <div style={{
          padding:'8px 12px',borderRadius:'6px',marginBottom:'12px',
          background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',
          fontSize:'13px',fontWeight:700,
        }}>
          Perda total por volta: <span style={{color: impact.totalLoss > 0 ? '#e10600':'#22c55e',fontFamily:'Orbitron,monospace'}}>
            {impact.totalLoss >= 0 ? '+' : ''}{impact.totalLoss.toFixed(3)}s
          </span>
        </div>
        <table className="dmg-impact-table">
          <thead>
            <tr>
              <th>Peça</th>
              <th>Dano médio</th>
              <th>Perda por volta</th>
            </tr>
          </thead>
          <tbody>
            {impact.partes.map(p => {
              const barW = Math.min(100, Math.abs(p.loss) / maxLoss * 100);
              const cor  = p.avgDano >= 67 ? '#e10600' : p.avgDano >= 34 ? '#f59e0b' : '#22c55e';
              return (
                <tr key={p.key}>
                  <td style={{fontWeight:700,color:'var(--text)'}}>{p.label}</td>
                  <td>
                    <span style={{
                      display:'inline-block',padding:'1px 7px',borderRadius:'4px',
                      background:`${cor}20`,border:`1px solid ${cor}`,
                      color:cor,fontSize:'11px',fontWeight:800,
                    }}>{p.avgDano.toFixed(0)}%</span>
                  </td>
                  <td>
                    <span className="impact-bar-wrap">
                      <span className="impact-bar-fill" style={{width:`${barW}%`,background:color}}/>
                    </span>
                    <span className="impact-val" style={{color}}>
                      {p.loss >= 0 ? '+' : ''}{p.loss.toFixed(3)}s
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div className="fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px',gap:'12px',flexWrap:'wrap'}}>
        <div className="driver-tbl-label r">{ref.nome} — {fmt(ref.melhor_volta)}</div>
        <div className="driver-tbl-label b">{comp.nome} — {fmt(comp.melhor_volta)}</div>
      </div>

      {/* ── Tabela de voltas ── */}
      <div style={{background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'8px',overflow:'auto',maxHeight:'600px'}}>
        <table className="lap-table">
          <thead>
            <tr>
              <th style={{textAlign:'center'}}>Volta</th>
              <th><span style={{color:'var(--red)'}}>■</span> {ref.nome}</th>
              <th style={{textAlign:'center'}}>Delta</th>
              <th><span style={{color:'var(--blue)'}}>■</span> {comp.nome}</th>
            </tr>
          </thead>
          <tbody>
            {allLaps.map(lap => {
              const r  = refMap[lap];
              const c  = compMap[lap];
              const rT = r ? r.t : null;
              const cT = c ? c.t : null;
              const delta = (rT && cT) ? cT - rT : null;
              const isRefBest  = rT && rT === ref.melhor_volta;
              const isCompBest = cT && cT === comp.melhor_volta;

              return (
                <tr key={lap} style={{background:(isRefBest||isCompBest)?'rgba(255,192,0,0.06)':'transparent'}}>
                  <td style={{textAlign:'center',fontFamily:'Rajdhani,sans-serif',fontWeight:'700',color:'var(--label)'}}>
                    V{lap}
                  </td>
                  <td style={{color:isRefBest?'var(--yellow)':'var(--text)',fontWeight:isRefBest?'700':'400'}}>
                    {rT ? fmt(rT) : '—'}
                    {renderPitIcon(lap, refPitFull,  refPitLoss)}
                    {renderDmgIcon(refHist,  danoData[ref.nome],  lap, refPits)}
                  </td>
                  <td style={{textAlign:'center',fontFamily:'Orbitron,monospace',fontSize:'12px',fontWeight:'700',color:dColor(delta)}}>
                    {delta===null ? '—' : `${delta>=0?'+':''}${delta.toFixed(3)}s`}
                  </td>
                  <td style={{color:isCompBest?'var(--yellow)':'var(--text)',fontWeight:isCompBest?'700':'400'}}>
                    {cT ? fmt(cT) : '—'}
                    {renderPitIcon(lap, compPitFull, compPitLoss)}
                    {renderDmgIcon(compHist, danoData[comp.nome], lap, compPits)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* legenda */}
      <div style={{display:'flex',gap:'16px',justifyContent:'center',marginTop:'10px',flexWrap:'wrap'}}>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--green)'}}>■</span> {comp.nome} mais rápido</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--red)'}}>■</span> {comp.nome} mais lento</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}><span style={{color:'var(--yellow)'}}>■</span> Melhor volta</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}>🔴 PIT = pit stop · +Xs = tempo perdido</span>
        <span style={{fontSize:'11px',color:'var(--muted)'}}>🔧 = dano ativo nessa volta (some quando pit repara)</span>
      </div>

      {/* ── Tabela de impacto de dano ── */}
      {(refImpact || compImpact) && (
        <div className="dmg-impact-panel">
          <div className="dmg-impact-title">⚙️ Impacto do Dano no Ritmo</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
            <div>
              <div style={{color:'var(--red)',fontWeight:700,fontSize:'12px',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'1px'}}>
                {ref.nome}
              </div>
              <ImpactTable impact={refImpact}  nome={ref.nome}  color="var(--red)"  />
            </div>
            <div>
              <div style={{color:'var(--blue)',fontWeight:700,fontSize:'12px',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'1px'}}>
                {comp.nome}
              </div>
              <ImpactTable impact={compImpact} nome={comp.nome} color="var(--blue)" />
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
// ─── DELTA CHART ─────────────────────────────────────────────────────────────
// Gráfico de delta acumulado por tempo dentro da volta.
// Cada volta tem 4 pontos: início (0,0) → fim S1 → fim S2 → fim volta (S3).
// O piloto de referência fica sempre na linha 0; os outros oscilam ±.
// ─────────────────────────────────────────────────────────────────────────────
const DeltaChart = ({ pilotos, refIdx, cmpIdx }) => {
  const canvasRef  = useRef(null);
  const overlayRef = useRef(null);
  const [hover,    setHover]    = useState(null);
  const [selLap,   setSelLap]   = useState('best'); // 'best' | numero_volta
  const [selPilot, setSelPilot] = useState(null);   // nome do piloto para destaque

  // ── Cores fixas por piloto ──────────────────────────────────────────────────
  const COLORS = [
    '#e10600','#0090d0','#00e87a','#ffc000',
    '#ff8c00','#c800ff','#00c8ff','#ff69b4',
    '#a0ff00','#ff4444','#44ffff','#ffaa00',
  ];
  const colorOf = (idx) => COLORS[idx % COLORS.length];

  // ── Constrói pontos do delta para uma volta de um piloto vs referência ──────
  // Retorna array de { x (tempo acumulado), y (delta acumulado), label }
  const buildDeltaPoints = (refVolta, cmpVolta) => {
    if (!refVolta || !cmpVolta) return null;
    // Garante setores — usa proporção 38/30/32 se faltar
    const fallbackSplit = (t) => [t * 0.38, t * 0.30, t * 0.32];
    const [rs1, rs2, rs3] = (refVolta.s1 && refVolta.s2 && refVolta.s3)
      ? [refVolta.s1, refVolta.s2, refVolta.s3]
      : fallbackSplit(refVolta.t);
    const [cs1, cs2, cs3] = (cmpVolta.s1 && cmpVolta.s2 && cmpVolta.s3)
      ? [cmpVolta.s1, cmpVolta.s2, cmpVolta.s3]
      : fallbackSplit(cmpVolta.t);

    // X = tempo de referência acumulado (base do eixo)
    const xS1 = rs1;
    const xS2 = rs1 + rs2;
    const xS3 = rs1 + rs2 + rs3;

    // Delta acumulado: positivo = cmp está perdendo, negativo = cmp está ganhando
    const d1 = cs1 - rs1;
    const d2 = d1 + (cs2 - rs2);
    const d3 = d2 + (cs3 - rs3);

    return [
      { x: 0,   y: 0,  label: 'Início'  },
      { x: xS1, y: d1, label: 'S1'      },
      { x: xS2, y: d2, label: 'S2'      },
      { x: xS3, y: d3, label: 'Fim'     },
    ];
  };

  // ── Escolhe qual volta usar (best ou número específico) ────────────────────
  const getVolta = (piloto, lap) => {
    if (!piloto) return null;
    if (lap === 'best') {
      return piloto.voltas.reduce((best, v) =>
        (!best || v.t < best.t) ? v : best, null);
    }
    return piloto.voltas.find(v => v.n === lap) || null;
  };

  // ── Lista de voltas comuns (para o select) ─────────────────────────────────
  const ref = pilotos[refIdx];
  const voltas_comuns = ref
    ? ref.voltas.map(v => v.n).sort((a,b) => a-b)
    : [];

  const lapLabel = selLap === 'best' ? 'Melhor volta' : `Volta ${selLap}`;

  // ── Pontos de todos os pilotos vs referência ───────────────────────────────
  const allSeries = pilotos.map((p, idx) => {
    const refVolta = getVolta(ref, selLap);
    const myVolta  = getVolta(p,   selLap);
    const pts      = (idx === refIdx)
      ? [{ x:0, y:0, label:'Início' }, { x: (refVolta?.s1||0), y:0, label:'S1' },
         { x: (refVolta?.s1||0)+(refVolta?.s2||0), y:0, label:'S2' },
         { x: refVolta?.t||0, y:0, label:'Fim' }]
      : buildDeltaPoints(refVolta, myVolta);
    return { nome: p.nome, idx, color: colorOf(idx), pts, volta: myVolta };
  }).filter(s => s.pts);

  // ── Canvas render ──────────────────────────────────────────────────────────
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !allSeries.length) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width  = canvas.offsetWidth;
    const H = canvas.height = canvas.offsetHeight;
    ctx.clearRect(0, 0, W, H);

    const PAD = { top: 40, right: 30, bottom: 50, left: 70 };
    const CW  = W - PAD.left - PAD.right;
    const CH  = H - PAD.top  - PAD.bottom;

    // Ranges
    const allX = allSeries.flatMap(s => s.pts.map(p => p.x));
    const allY = allSeries.flatMap(s => s.pts.map(p => p.y));
    const xMin = 0, xMax = Math.max(...allX, 1);
    const yRaw = Math.max(Math.abs(Math.min(...allY)), Math.abs(Math.max(...allY)), 0.05);
    const yMax =  yRaw * 1.25;
    const yMin = -yRaw * 1.25;

    const toX = (v) => PAD.left + (v - xMin) / (xMax - xMin) * CW;
    const toY = (v) => PAD.top  + (1 - (v - yMin) / (yMax - yMin)) * CH;

    // ── Grid ────────────────────────────────────────────────────────────────
    ctx.strokeStyle = '#1a1d2e';
    ctx.lineWidth   = 1;
    // Horizontais
    const yTicks = 6;
    for (let i = 0; i <= yTicks; i++) {
      const yv = yMin + (yMax - yMin) * (i / yTicks);
      const yp = toY(yv);
      ctx.beginPath(); ctx.moveTo(PAD.left, yp); ctx.lineTo(W - PAD.right, yp); ctx.stroke();
      ctx.fillStyle = '#5a5d78'; ctx.font = '11px Rajdhani, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText((yv >= 0 ? '+' : '') + yv.toFixed(2) + 's', PAD.left - 6, yp + 4);
    }

    // ── Linha zero (referência) ─────────────────────────────────────────────
    const y0 = toY(0);
    ctx.beginPath(); ctx.moveTo(PAD.left, y0); ctx.lineTo(W - PAD.right, y0);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);

    // ── Linhas de setor ─────────────────────────────────────────────────────
    const refSerie = allSeries.find(s => s.idx === refIdx);
    if (refSerie && refSerie.pts.length >= 3) {
      const sectorX = [refSerie.pts[1].x, refSerie.pts[2].x]; // S1, S2
      const labels  = ['S2', 'S3'];
      sectorX.forEach((sx, si) => {
        const xp = toX(sx);
        ctx.beginPath(); ctx.moveTo(xp, PAD.top); ctx.lineTo(xp, H - PAD.bottom);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#8a8db0'; ctx.font = 'bold 11px Orbitron, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(labels[si], xp, PAD.top - 8);
      });
    }

    // ── Helper: desenha linha suave Catmull-Rom → Bezier ─────────────────────
    const drawSmooth = (pts, tension=0.4) => {
      ctx.beginPath();
      ctx.moveTo(toX(pts[0].x), toY(pts[0].y));
      for (let i=0; i<pts.length-1; i++) {
        const p0 = pts[Math.max(i-1,0)];
        const p1 = pts[i];
        const p2 = pts[i+1];
        const p3 = pts[Math.min(i+2,pts.length-1)];
        const cp1x = toX(p1.x)+(toX(p2.x)-toX(p0.x))*tension/2;
        const cp1y = toY(p1.y)+(toY(p2.y)-toY(p0.y))*tension/2;
        const cp2x = toX(p2.x)-(toX(p3.x)-toX(p1.x))*tension/2;
        const cp2y = toY(p2.y)-(toY(p3.y)-toY(p1.y))*tension/2;
        ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,toX(p2.x),toY(p2.y));
      }
    };

    // ── Séries ───────────────────────────────────────────────────────────────
    allSeries.forEach(serie => {
      const { pts, color, nome, idx } = serie;
      const isRef = idx === refIdx;
      const isHL  = selPilot === null || selPilot === nome;
      const alpha = isHL ? 1 : 0.15;

      ctx.globalAlpha = alpha;

      if (!isRef) {
        // Área preenchida sob a curva
        ctx.save();
        drawSmooth(pts);
        ctx.lineTo(toX(pts[pts.length-1].x), y0);
        ctx.lineTo(toX(pts[0].x), y0);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top+CH);
        grad.addColorStop(0, color+'30');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // Glow (só HL)
        if (isHL) {
          drawSmooth(pts);
          ctx.strokeStyle = color;
          ctx.lineWidth = 8;
          ctx.globalAlpha = 0.12;
          ctx.lineJoin='round'; ctx.lineCap='round';
          ctx.stroke();
          ctx.globalAlpha = alpha;
        }

        // Linha principal suave
        drawSmooth(pts);
        ctx.strokeStyle = color;
        ctx.lineWidth   = isHL ? 3 : 1.5;
        ctx.lineJoin='round'; ctx.lineCap='round';
        ctx.stroke();
      } else {
        // Referência: tracejado suave
        drawSmooth(pts);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([7,5]); ctx.lineJoin='round';
        ctx.stroke(); ctx.setLineDash([]);
      }

      // Pontos S1/S2/Fim
      pts.slice(1).forEach((p,pi) => {
        const cx2=toX(p.x), cy2=toY(p.y), r=pi===2?6:4;
        ctx.beginPath(); ctx.arc(cx2,cy2,r+2,0,Math.PI*2);
        ctx.fillStyle='#06070f'; ctx.fill();
        ctx.beginPath(); ctx.arc(cx2,cy2,r,0,Math.PI*2);
        ctx.fillStyle=isRef?'rgba(255,255,255,0.5)':color; ctx.fill();
      });

      // Label no final
      const last = pts[pts.length-1];
      ctx.fillStyle = isRef ? 'rgba(255,255,255,0.7)' : color;
      ctx.font = 'bold 11px Rajdhani, sans-serif';
      ctx.textAlign = 'left';
      const dy = last.y;
      const lx = toX(last.x) + 8;
      const ly = toY(last.y);
      const lapN = serie.volta ? `V${serie.volta.n}` : '';
      const deltaStr = isRef ? 'REF' : ((dy>=0?'+':'')+dy.toFixed(3)+'s');
      ctx.fillText(`${nome.substring(0,11)} ${lapN}`, lx, ly);
      ctx.font = '600 10px Orbitron, monospace';
      ctx.fillStyle = isRef ? 'rgba(255,255,255,0.4)' : (dy>0?'#ff6b6b':'#00e87a');
      ctx.fillText(deltaStr, lx, ly+12);
      ctx.globalAlpha = 1;
    });

    // Eixo X — tempo em segundos
    ctx.fillStyle = '#5a5d78'; ctx.font = '10px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    const xTicks = 8;
    for (let i = 0; i <= xTicks; i++) {
      const xv = xMin + (xMax - xMin) * (i / xTicks);
      ctx.fillText(xv.toFixed(1) + 's', toX(xv), H - PAD.bottom + 16);
    }

    // Título eixos
    ctx.save(); ctx.translate(14, H/2); ctx.rotate(-Math.PI/2);
    ctx.fillStyle = '#8a8db0'; ctx.font = '11px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Delta (s)', 0, 0); ctx.restore();

    ctx.fillStyle = '#8a8db0'; ctx.font = '11px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Tempo na volta (s)', W / 2, H - 8);

  }, [allSeries, selPilot, refIdx]);

  // ── Hover ──────────────────────────────────────────────────────────────────
  const handleMouseMove = (e) => {
    const canvas = canvasRef.current;
    if (!canvas || !allSeries.length) return;
    const rect = canvas.getBoundingClientRect();
    const mx   = e.clientX - rect.left;
    const my   = e.clientY - rect.top;
    const W = canvas.width, H = canvas.height;
    const PAD = { top:40, right:30, bottom:50, left:70 };
    const CW  = W - PAD.left - PAD.right;
    const CH  = H - PAD.top  - PAD.bottom;
    const allX = allSeries.flatMap(s => s.pts.map(p => p.x));
    const allY = allSeries.flatMap(s => s.pts.map(p => p.y));
    const xMax = Math.max(...allX, 1);
    const yRaw = Math.max(Math.abs(Math.min(...allY)), Math.abs(Math.max(...allY)), 0.05);
    const yMax =  yRaw * 1.25;
    const yMin = -yRaw * 1.25;
    const toX = (v) => PAD.left + v / xMax * CW;
    const toY = (v) => PAD.top + (1 - (v - yMin) / (yMax - yMin)) * CH;

    // Ponto mais próximo em qualquer série
    let best = null, bestDist = 30;
    allSeries.forEach(serie => {
      serie.pts.forEach(pt => {
        const dx = toX(pt.x) - mx, dy = toY(pt.y) - my;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; best = { ...pt, nome: serie.nome, color: serie.color, idx: serie.idx }; }
      });
    });

    if (best) {
      const isRef = best.idx === refIdx;
      const dy = best.y;
      const msg = isRef
        ? `${best.nome} — Referência (${best.label})`
        : dy > 0.001
          ? `${best.nome} perdendo ${dy.toFixed(3)}s (${best.label})`
          : dy < -0.001
            ? `${best.nome} ganhando ${Math.abs(dy).toFixed(3)}s (${best.label})`
            : `${best.nome} empatado (${best.label})`;
      setHover({ x: e.clientX, y: e.clientY, cx: mx, cy: my, msg, color: best.color, delta: best.y, isRef });
    } else {
      setHover(null);
    }
  };

  return (
    <div className="fade-in">
      {/* ── Controles ── */}
      <div style={{ display:'flex', gap:'12px', alignItems:'center', marginBottom:'14px', flexWrap:'wrap' }}>
        <span style={{ color:'var(--label)', fontSize:'12px', fontWeight:700, textTransform:'uppercase', letterSpacing:'1px' }}>
          Volta
        </span>
        <select value={selLap} onChange={e => setSelLap(e.target.value === 'best' ? 'best' : Number(e.target.value))}
          style={{ width:'140px' }}>
          <option value="best">Melhor volta</option>
          {voltas_comuns.map(n => <option key={n} value={n}>Volta {n}</option>)}
        </select>

        <span style={{ color:'var(--label)', fontSize:'12px', fontWeight:700, textTransform:'uppercase', letterSpacing:'1px', marginLeft:'8px' }}>
          Destacar
        </span>
        <select value={selPilot || ''} onChange={e => setSelPilot(e.target.value || null)}
          style={{ width:'180px' }}>
          <option value="">Todos</option>
          {pilotos.map((p,i) => <option key={i} value={p.nome}>{p.nome}</option>)}
        </select>

        <div style={{ marginLeft:'auto', color:'var(--muted)', fontSize:'11px' }}>
          📌 Referência: <strong style={{color:'var(--cyan)'}}>{ref?.nome}</strong> — {lapLabel}
        </div>
      </div>

      {/* ── Legenda ── */}
      <div style={{ display:'flex', gap:'16px', flexWrap:'wrap', marginBottom:'10px' }}>
        {allSeries.map(s => (
          <div key={s.nome}
            style={{ display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', opacity: selPilot && selPilot !== s.nome ? 0.35 : 1 }}
            onClick={() => setSelPilot(selPilot === s.nome ? null : s.nome)}>
            <div style={{ width:24, height:3, background: s.idx === refIdx ? 'rgba(255,255,255,0.5)' : s.color,
              borderRadius:2, borderTop: s.idx === refIdx ? '1px dashed rgba(255,255,255,0.5)' : 'none' }} />
            <span style={{ fontSize:'12px', color: s.idx === refIdx ? '#fff' : s.color, fontWeight:700 }}>
              {s.nome}
            </span>
            {s.volta && (
              <span style={{ fontSize:'10px', color:'var(--muted)' }}>
                V{s.volta.n} — {fmt(s.volta.t)}
              </span>
            )}
          </div>
        ))}
      </div>

      {/* ── Canvas ── */}
      <div style={{ position:'relative', background:'var(--panel)', border:'1px solid var(--border)', borderRadius:'8px', overflow:'hidden' }}>
        <canvas ref={canvasRef} style={{ width:'100%', height:'380px', display:'block' }}
          onMouseMove={handleMouseMove} onMouseLeave={() => setHover(null)} />

        {/* Tooltip — colado no cursor, dentro do canvas */}
        {hover && (
          <div style={{
            position:'absolute',
            left: Math.min(hover.cx + 14, (canvasRef.current?.offsetWidth||600) - 260),
            top:  Math.max(hover.cy - 36, 8),
            pointerEvents:'none',
            background:'rgba(8,10,20,0.97)',
            border:`1.5px solid ${hover.color}`,
            borderRadius:'8px', padding:'8px 14px',
            fontSize:'13px', fontWeight:800,
            color: hover.color, zIndex:999,
            whiteSpace:'nowrap',
            boxShadow:`0 0 16px ${hover.color}55`,
            fontFamily:'Rajdhani,sans-serif',
          }}>
            {hover.msg}
            {hover.delta !== undefined && !hover.isRef && (
              <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px',fontFamily:'Orbitron,monospace'}}>
                {hover.delta > 0 ? '▲ perdendo para referência' : '▼ ganhando da referência'}
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Nota explicativa ── */}
      <div style={{ marginTop:'10px', display:'flex', gap:'20px', flexWrap:'wrap', fontSize:'11px', color:'var(--muted)' }}>
        <span>📈 Subindo = perdendo tempo para a referência</span>
        <span>📉 Descendo = ganhando tempo</span>
        <span>── Linha tracejada = piloto de referência (zero)</span>
        <span>S2 / S3 = início dos setores</span>
        <span>Clique na legenda para destacar um piloto</span>
      </div>
    </div>
  );
};

// ─── PERFORMANCE VIEW ────────────────────────────────────────────────────────
// Score 0-10 por setor (S1=curvas lentas, S2=curvas médias, S3=reta).
// Usa as voltas válidas de cada piloto, sem outliers (SC, trânsito, erro >10% da mediana).
// Em sessões de corrida, só entra quem completou (mesmo nº de voltas do líder, folga de 1).
// Quanto menor o tempo médio num setor vs o melhor do grid = score mais alto.
// ─────────────────────────────────────────────────────────────────────────────
const PerformanceView = ({ pilotos, tipoSessao, danoData, posData }) => {
  if (!pilotos.length) return <div style={{color:'var(--muted)',padding:'40px',textAlign:'center'}}>Sem dados</div>;

  // ── Calcula média de setor filtrando outliers ─────────────────────────────
  const calcMedia = (voltas, campo) => {
    const raw = (voltas||[]).map(v=>v[campo]).filter(v=>v&&v>1&&v<300);
    if (!raw.length) return null;
    const ordenado = [...raw].sort((a,b)=>a-b);
    const mediana  = ordenado[Math.floor(ordenado.length/2)];
    const limpo    = raw.filter(v => v <= mediana * 1.10);
    return limpo.length ? limpo.reduce((a,b)=>a+b,0)/limpo.length : null;
  };

  const pilotsDataBruto = pilotos.map(p => {
    const pos = (posData || {})[p.nome] || {};
    return {
      nome:    p.nome,
      posicao: p.posicao || p.position || 99,
      grid:    pos.grid  || null,                 // posição de largada
      posFinal:pos.final || p.posicao || null,     // posição final oficial (fallback: posicao atual)
      s1:  calcMedia(p.voltas, 's1'),
      s2:  calcMedia(p.voltas, 's2'),
      s3:  calcMedia(p.voltas, 's3'),
      tot: calcMedia(p.voltas, 't'),
      nVoltas: (p.voltas||[]).filter(v=>v.t&&v.t>30).length,
    };
  }).filter(p => p.tot !== null);

  const isRace = String(tipoSessao || '').trim().toLowerCase() === 'race';
  const maxVoltasCorrida = Math.max(...pilotsDataBruto.map(p => p.nVoltas), 0);
  const pilotsData = pilotsDataBruto
    .filter(p => !isRace || p.nVoltas >= maxVoltasCorrida - 1)
    .sort((a,b) => (a.posicao||99)-(b.posicao||99));

  if (!pilotsData.length) return (
    <div style={{color:'var(--muted)',padding:'40px',textAlign:'center'}}>
      Nenhum dado de volta disponível para esta sessão.
    </div>
  );

  const best = {
    s1:  Math.min(...pilotsData.filter(p=>p.s1).map(p=>p.s1)),
    s2:  Math.min(...pilotsData.filter(p=>p.s2).map(p=>p.s2)),
    s3:  Math.min(...pilotsData.filter(p=>p.s3).map(p=>p.s3)),
    tot: Math.min(...pilotsData.filter(p=>p.tot).map(p=>p.tot)),
  };

  // ── Score base (0-10) ────────────────────────────────────────────────────
  // 0.5% mais lento = -1 ponto
  const scorePuro = (val, bestVal) => {
    if (!val || !bestVal) return null;
    const diffPct = ((val - bestVal) / bestVal) * 100;
    return Math.max(0, Math.min(10, 10 - diffPct * 2));
  };

  // ── Bônus de dano ────────────────────────────────────────────────────────
  // Quanto mais danificado o carro E melhor a posição final → maior o bônus
  // fatorPosicao: P1-3=1.0, P4-6=0.7, P7-10=0.4, P11+=0.1
  // bonusDano = (danoTotal/100) × fatorPosicao × 1.5
  // cap: +1.5 (não deixa score passar de 10.2 no geral)
  const calcBonusDano = (nome, posicao) => {
    const d = (danoData || {})[nome];
    if (!d || !d.total || d.total < 1) return 0;
    const pos = posicao || 99;
    const fator = pos <= 3 ? 1.0 : pos <= 6 ? 0.7 : pos <= 10 ? 0.4 : 0.1;
    return Math.min(1.5, (d.total / 100) * fator * 1.5);
  };

  // ── Bônus/Penalidade por posições ganhas/perdidas (grid → final) ────────
  // Compara onde o piloto largou (grid_position) com onde terminou (pos_final).
  // delta > 0  → ganhou posições (ex: largou P19, terminou P2 → delta = 17)
  // delta < 0  → perdeu posições (ex: largou P3, terminou P8 → delta = -5)
  // O fator progressivo faz remontadas grandes valerem MUITO mais que
  // ganhos pequenos (P19→P2 vale proporcionalmente mais que P3→P1), e
  // perder posições sempre custa pontos — nunca soma.
  // Ajuste as constantes abaixo para calibrar o quanto isso pesa no score.
  const PTS_POR_POSICAO   = 0.12;   // pontos-base por posição ganha/perdida
  const BONUS_POS_MAX     = 2.5;    // teto do bônus por remontada
  const PENALTY_POS_MAX   = -2.0;   // piso da penalidade por posições perdidas
  const FATOR_PERDA       = 1.25;   // perder pesa um pouco mais que ganhar

  const calcBonusPosicao = (grid, posFinal) => {
    if (!grid || !posFinal || grid <= 0 || posFinal <= 0) return 0;
    const delta = grid - posFinal; // positivo = ganhou posições
    if (delta === 0) return 0;

    if (delta > 0) {
      // fator progressivo: até 2x para remontadas de 20+ posições
      const fatorProgressivo = 1 + Math.min(delta, 20) / 20;
      return Math.min(BONUS_POS_MAX, delta * PTS_POR_POSICAO * fatorProgressivo);
    }
    return Math.max(PENALTY_POS_MAX, delta * PTS_POR_POSICAO * FATOR_PERDA);
  };

  // ── Score final com os bônus (dano + posição) aplicados só no GERAL ─────
  const scoreFinal = (val, bestVal, bonusDano, bonusPos) => {
    const base = scorePuro(val, bestVal);
    if (base === null) return null;
    const total = base + (bonusDano||0) + (bonusPos||0);
    return Math.max(0, Math.min(14, total)).toFixed(1);
  };

  const rankBy = (field) => {
    const sorted = [...pilotsData].filter(p=>p[field]).sort((a,b)=>a[field]-b[field]);
    const ranks = {};
    sorted.forEach((p,i) => { ranks[p.nome] = i+1; });
    return ranks;
  };
  const rankS1 = rankBy('s1'), rankS2 = rankBy('s2'), rankS3 = rankBy('s3'), rankTot = rankBy('tot');

  const scoreColor = (s) => {
    if (s===null) return 'var(--muted)';
    const n = parseFloat(s);
    if (n >= 14) return '#FF2D55';
    if (n >= 13) return '#8A2BE2';
    if (n >= 12) return '#0066FF';
    if (n >= 10.5) return '#00D4FF';
    if (n >= 9.5) return '#00ffaa';
    if (n >= 9)   return '#00e87a';
    if (n >= 7.5) return '#a0ff00';
    if (n >= 6)   return '#ffc000';
    if (n >= 4)   return '#ff8c00';
    return '#e10600';
  };

  const ScoreBar = ({val, base, bonusDano=0, bonusPos=0}) => {
    if (val===null) return <span style={{color:'var(--muted)'}}>—</span>;
    const n=parseFloat(val);
    const color=scoreColor(val);
    // A barra representa sempre o score PURO (pace); os bônus/penalidade de
    // dano e posição aparecem como segmentos extras (ou tag vermelha, se negativo)
    const basePct = Math.min(100, (base||0) * 10);
    const danoPct = Math.min(100, Math.max(0, bonusDano) * 10);
    const posPct  = Math.min(100, Math.max(0, bonusPos) * 10);
    return (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <div style={{width:'80px',height:'6px',background:'var(--border2)',borderRadius:'3px',overflow:'hidden',display:'flex'}}>
            <div style={{width:`${basePct}%`,height:'100%',background:color,borderRadius:'3px 0 0 3px',transition:'width .3s'}}/>
            {bonusDano>0 && <div style={{width:`${danoPct}%`,height:'100%',background:'#ffffff60'}}/>}
            {bonusPos>0  && <div style={{width:`${posPct}%`,height:'100%',background:'#00e87a',borderRadius:'0 3px 3px 0'}}/>}
          </div>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:'13px',fontWeight:900,color,minWidth:'36px'}}>{val}</span>
        </div>
        {(bonusDano>0 || bonusPos!==0) && (
          <div style={{display:'flex',gap:'6px',fontSize:'9px',fontFamily:'Orbitron,monospace'}}>
            {bonusDano>0 && <span style={{color:'#ffffff90'}}>🔧+{bonusDano.toFixed(1)}</span>}
            {bonusPos>0  && <span style={{color:'#00e87a'}}>🏁+{bonusPos.toFixed(1)}</span>}
            {bonusPos<0  && <span style={{color:'#e10600'}}>🏁{bonusPos.toFixed(1)}</span>}
          </div>
        )}
      </div>
    );
  };

  const RankBadge = ({r}) => (
    <span style={{
      display:'inline-block',padding:'1px 6px',borderRadius:'4px',fontSize:'11px',fontWeight:800,
      background: r===1?'#ffc00030':r<=3?'#ffffff15':'transparent',
      color: r===1?'#ffc000':r<=3?'#e8eaf6':'var(--muted)',
      border: r===1?'1px solid #ffc00060':r<=3?'1px solid #ffffff20':'1px solid transparent',
    }}>
      {r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}º`}
    </span>
  );

  const SETORES = [
    { key:'s1',  label:'SETOR 1', sub:'Curvas lentas',    color:'#0090d0', rank:rankS1,  hasBonus:false },
    { key:'s2',  label:'SETOR 2', sub:'Curvas médias',    color:'#00e87a', rank:rankS2,  hasBonus:false },
    { key:'s3',  label:'SETOR 3', sub:'Retas / alta vel', color:'#ffc000', rank:rankS3,  hasBonus:false },
    { key:'tot', label:'GERAL',   sub:'Ritmo + dano + posição',color:'#e10600',rank:rankTot, hasBonus:true  },
  ];

  return (
    <div className="fade-in">
      {/* ── Cabeçalho estilo F1 Insights ─────────────────────────────────── */}
      <div style={{
        display:'flex',alignItems:'center',gap:'16px',
        padding:'14px 20px',marginBottom:'20px',
        background:'linear-gradient(90deg,#0d0f1c,#0a0c18)',
        border:'1px solid var(--border2)',borderRadius:'8px',
        borderLeft:'4px solid var(--red)',
      }}>
        <div>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:'16px',fontWeight:900,letterSpacing:'2px',color:'var(--text)'}}>
            CAR PERFORMANCE SCORES
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px',letterSpacing:'1px'}}>
            Média de todas as voltas · Score 0–10 (10 = melhor do grid) · Geral pode passar de 10 com bônus de dano/posição
          </div>
        </div>
        <div style={{marginLeft:'auto',fontSize:'11px',color:'var(--muted)'}}>
          {pilotsData.length} pilotos · máx {Math.max(...pilotsData.map(p=>p.nVoltas))} voltas
        </div>
      </div>

      {/* ── Tabela ────────────────────────────────────────────────────────── */}
      <div style={{background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'8px',overflow:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'13px'}}>
          <thead>
            <tr style={{background:'#0a0c18'}}>
              <th style={{padding:'10px 14px',textAlign:'left',color:'var(--muted)',fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',borderBottom:'1px solid var(--border2)',width:'160px'}}>
                PILOTO
              </th>
              {SETORES.map(s=>(
                <th key={s.key} style={{padding:'10px 14px',textAlign:'center',fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',borderBottom:'1px solid var(--border2)',borderLeft:'1px solid var(--border)'}}>
                  <div style={{color:s.color,fontWeight:900}}>{s.label}</div>
                  <div style={{color:'var(--muted)',fontWeight:400,fontSize:'9px',marginTop:'2px'}}>{s.sub}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pilotsData.map((p,i)=>{
              const bonusDano = calcBonusDano(p.nome, p.posicao);
              const bonusPos  = calcBonusPosicao(p.grid, p.posFinal);
              const dano   = (danoData||{})[p.nome];
              const temDano = dano && dano.total >= 1;
              const temPos  = p.grid && p.posFinal && p.grid !== p.posFinal;
              const ganhou  = temPos && p.grid > p.posFinal;
              const perdeu  = temPos && p.grid < p.posFinal;
              return (
              <tr key={p.nome} style={{borderBottom:'1px solid var(--border)',background:i%2===0?'transparent':'rgba(255,255,255,0.01)'}}>
                {/* Piloto */}
                <td style={{padding:'10px 14px'}}>
                  <div style={{fontWeight:800,fontSize:'13px',color:'var(--text)',letterSpacing:'.5px'}}>{p.nome}</div>
                  <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px',display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                    <span>P{p.posicao} · {p.nVoltas}v</span>
                    {p.grid && p.posFinal && (
                      <span title={`Largou P${p.grid} · terminou P${p.posFinal}`} style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background: ganhou?'#22c55e20':perdeu?'#e1060020':'transparent',
                        color:      ganhou?'#22c55e'  :perdeu?'#e10600'  :'var(--muted)',
                        border:`1px solid ${ganhou?'#22c55e60':perdeu?'#e1060060':'var(--border)'}`,
                      }}>
                        {ganhou?'▲':perdeu?'▼':'='} P{p.grid}→P{p.posFinal}
                      </span>
                    )}
                    {temDano && (
                      <span title={`Dano total: ${dano.total.toFixed(0)}%`} style={{
                        padding:'1px 5px',borderRadius:'3px',fontSize:'9px',fontWeight:800,
                        background: dano.nivel==='vermelho'?'#e1060020':dano.nivel==='amarelo'?'#f59e0b20':'#22c55e20',
                        color:      dano.nivel==='vermelho'?'#e10600'  :dano.nivel==='amarelo'?'#f59e0b'  :'#22c55e',
                        border:`1px solid ${dano.nivel==='vermelho'?'#e1060060':dano.nivel==='amarelo'?'#f59e0b60':'#22c55e60'}`,
                      }}>
                        🔧 {dano.total.toFixed(0)}%
                      </span>
                    )}
                  </div>
                </td>
                {/* Scores por setor */}
                {SETORES.map(s=>{
                  const bd = s.hasBonus ? bonusDano : 0;
                  const bp = s.hasBonus ? bonusPos  : 0;
                  const base = scorePuro(p[s.key], best[s.key]);
                  const sc = s.hasBonus
                    ? scoreFinal(p[s.key], best[s.key], bd, bp)
                    : (base?.toFixed(1) ?? null);
                  const rk = s.rank[p.nome];
                  return (
                    <td key={s.key} style={{padding:'10px 14px',borderLeft:'1px solid var(--border)',textAlign:'center'}}>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'5px'}}>
                        <ScoreBar val={sc} base={base} bonusDano={bd} bonusPos={bp}/>
                        <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                          {rk && <RankBadge r={rk}/>}
                          {p[s.key] && <span style={{fontSize:'10px',color:'var(--muted)',fontFamily:'Orbitron,monospace'}}>
                            {p[s.key].toFixed(3)}s
                          </span>}
                        </div>
                      </div>
                    </td>
                  );
                })}
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* ── Legenda ───────────────────────────────────────────────────────── */}
      <div style={{marginTop:'12px',display:'flex',gap:'16px',flexWrap:'wrap',fontSize:'11px',color:'var(--muted)'}}>
        <span>🔥 14 = LENDÁRIO / MÁXIMO</span>
        <span>🟣 13-14 = SOBRENATURAL</span>
        <span>🩵 10.5-13 = ELITE</span>
        <span>🟢 9-10.5 = EXCELENTE</span>
        <span>🟡 6-9 = BOM</span>
        <span>🟠 4-6 = MÉDIO</span>
        <span>🔴 0-4 = ABAIXO</span>
        <span>🔧 = bônus dano (branco) — terminou bem com carro danificado · máx +1.5</span>
        <span>🏁 = bônus/penalidade por posição (verde=ganhou, vermelho=perdeu) — compara largada (grid) com chegada</span>
        <span>▲P19→P2 = largou P19 e terminou P2 (bônus proporcional à remontada) · ▼ = perdeu posições, penaliza</span>
        <span style={{marginLeft:'auto'}}>Bônus só aplicado no score Geral</span>
      </div>
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>

<script>
(function() {
  // fecha o menu ao clicar fora
  document.addEventListener('click', function(e) {
    const btn = document.getElementById('insta-btn');
    if (btn && !btn.contains(e.target)) {
      document.getElementById('insta-formats').classList.remove('open');
    }
  });
})();

async function instaCap(outW, outH, label) {
  document.getElementById('insta-formats').classList.remove('open');
  const overlay = document.getElementById('insta-overlay');
  const msg     = document.getElementById('insta-overlay-msg');
  overlay.classList.add('show');
  msg.textContent = 'Capturando tela...';

  // esconde o botão durante a captura
  const fab = document.getElementById('insta-btn');
  fab.style.display = 'none';

  try {
    msg.textContent = 'Renderizando...';
    // ── Escala de captura: usa devicePixelRatio * 3 (mínimo 4)
    // Captura em altíssima resolução antes de comprimir para o formato Instagram
    const captureScale = Math.max(4, window.devicePixelRatio * 3);

    const canvas = await html2canvas(document.body, {
      useCORS: true,
      allowTaint: true,
      scale: captureScale,
      backgroundColor: getComputedStyle(document.body).backgroundColor || '#07080f',
      logging: false,
      removeContainer: true,
      imageTimeout: 0,
      // renderiza fontes com antialiasing máximo
      letterRendering: true,
    });

    msg.textContent = 'Formatando para Instagram...';

    // Canvas de saída em resolução 2x para Instagram (2160×2160 etc.)
    // O Instagram aceita e exibe em qualidade máxima
    const pixelRatio = 2;
    const out = document.createElement('canvas');
    out.width  = outW * pixelRatio;
    out.height = outH * pixelRatio;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled  = true;
    ctx.imageSmoothingQuality  = 'high';

    // fundo
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#07080f';
    ctx.fillRect(0, 0, out.width, out.height);

    // calcula posição centralizada mantendo proporção
    const srcW = canvas.width;
    const srcH = canvas.height;
    const fit  = Math.min((out.width * 0.96) / srcW, (out.height * 0.96) / srcH);
    const dw   = srcW * fit;
    const dh   = srcH * fit;
    const dx   = (out.width  - dw) / 2;
    const dy   = (out.height - dh) / 2;

    ctx.drawImage(canvas, dx, dy, dw, dh);

    // watermark sutil
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('F1 Telemetry', outW - 14, outH - 10);

    msg.textContent = 'Salvando...';
    const link = document.createElement('a');
    const ts   = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
    link.download = `f1-${label}-${ts}.png`;
    link.href = out.toDataURL('image/png');  // PNG é lossless, qualidade máxima
    link.click();

    msg.textContent = '✓ Salvo!';
    await new Promise(r => setTimeout(r, 800));
  } catch(err) {
    console.error(err);
    msg.textContent = 'Erro: ' + err.message;
    await new Promise(r => setTimeout(r, 2000));
  }

  fab.style.display = 'flex';
  overlay.classList.remove('show');
}
</script>
