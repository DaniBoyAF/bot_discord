<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Race — Live</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    font-family:'Titillium Web','Segoe UI',Tahoma,sans-serif;
    background:#0a0a0a; color:#fff;
  }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100vh; }
  .app.sem-lb { grid-template-columns: 0 1fr; }

  /* ═══ SIDEBAR ═══ */
  .lb {
    background:#050505; border-right:1px solid #1a1a1a;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .lb-header {
    background:#000; border-bottom:1px solid #1a1a1a;
    padding:10px 14px 8px; text-align:center;
  }
  .lb-header .f1 {
    color:#e10600; font-weight:900; letter-spacing:2px;
    font-size:16px; font-style:italic;
  }
  .lb-header .f1 span { color:#fff; }
  .lb-lap {
    background:#111; color:#ffd400; margin:6px -14px -8px;
    padding:5px 14px; font-size:11px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase;
    font-variant-numeric: tabular-nums;
  }
  .lb-mode { display:flex; gap:0; border-bottom:1px solid #1a1a1a; }
  .lb-mode button {
    flex:1; background:#0a0a0a; color:#888;
    border:none; padding:7px 0;
    font-family:inherit; font-size:10px; font-weight:700;
    letter-spacing:.8px; text-transform:uppercase;
    cursor:pointer; border-right:1px solid #1a1a1a;
    transition: all .15s;
  }
  .lb-mode button:last-child { border-right:none; }
  .lb-mode button:hover { background:#141414; color:#ccc; }
  .lb-mode button.on { background:#e10600; color:#fff; }

  .lb-body { flex:1; overflow-y:auto; padding:4px 0; }
  .lb-row {
    display:grid;
    grid-template-columns: 26px 22px 1fr auto 22px;
    align-items:center; height:26px;
    padding:0 10px 0 6px;
    border-left:3px solid transparent;
    font-size:12px;
    font-variant-numeric: tabular-nums;
    transition: background .15s;
  }
  .lb-row:nth-child(even) { background:#0a0a0a; }
  .lb-row:hover { background:#141414; }
  .lb-row.pit { background:rgba(255,215,0,.06); }

  .lb-pos { text-align:center; font-weight:800; color:#fff; font-size:11px; }
  .lb-bar { width:14px; height:14px; border-radius:2px; justify-self:center; }
  .lb-code { font-weight:900; letter-spacing:.6px; font-size:12px; padding-left:4px; white-space:nowrap; }
  .lb-val {
    text-align:right; color:#ddd; padding-right:6px; font-size:11px; white-space:nowrap;
  }
  .lb-val.purple { color:#c04cff; font-weight:800; }
  .lb-val.green  { color:#23e07a; font-weight:700; }
  .lb-val.yellow { color:#ffd400; font-weight:800; }
  .lb-val.dim    { color:#666; }

  .lb-tyre {
    width:18px; height:18px; border-radius:50%;
    text-align:center; line-height:16px;
    font-size:10px; font-weight:900; color:#000;
    justify-self:center; border:2px solid #222;
  }
  .lb-tyre.S  { background:#ff0000; color:#fff; }
  .lb-tyre.M  { background:#ffd400; }
  .lb-tyre.H  { background:#eeeeee; }
  .lb-tyre.I  { background:#1de21d; }
  .lb-tyre.W  { background:#0080ff; color:#fff; }
  .lb-tyre.SS { background:#c04cff; color:#fff; }

  /* ═══ MAPA ═══ */
  .map-container { position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.arrastando { cursor:grabbing; }

  .bar {
    position:absolute; top:12px; left:12px; right:12px;
    display:flex; gap:10px; align-items:center;
    padding:8px 12px; border-radius:10px;
    background:rgba(10,10,10,.75); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    font-size:12px; z-index:10; flex-wrap:wrap;
  }
  .bar label {
    display:flex; align-items:center; gap:6px;
    text-transform:uppercase; letter-spacing:.6px;
    font-size:10px; color:#aaa;
  }
  .bar select, .bar button {
    background:#111; color:#fff; border:1px solid #333;
    padding:5px 10px; border-radius:6px;
    font-family:inherit; font-size:11px;
    cursor:pointer; outline:none;
  }
  .bar select:hover, .bar button:hover { background:#1a1a1a; }
  .bar .pill {
    background:#009d45; padding:4px 10px; border-radius:6px;
    font-weight:700; font-size:11px;
    letter-spacing:.5px; text-transform:uppercase;
  }
  .bar .info { margin-left:auto; color:#888; font-size:10px; }
  .toggle-lb {
    position:absolute; top:12px; left:12px; z-index:20;
    background:#111; color:#fff; border:1px solid #333;
    padding:5px 10px; border-radius:6px; cursor:pointer;
    font-size:11px; display:none;
  }
  .app.sem-lb .toggle-lb { display:block; }

  .legenda {
    position:absolute; bottom:16px; right:16px;
    padding:10px 14px;
    background:rgba(10,10,10,.75); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08); border-radius:10px;
    font-size:10px; letter-spacing:.5px;
    z-index:10; display:none;
  }
  .legenda.on { display:block; }
  .grad {
    height:10px; width:180px; margin-top:6px; border-radius:4px;
    background:linear-gradient(90deg,
      #001a66 0%, #00c8ff 25%, #00ff41 50%,
      #ffd400 75%, #ff2020 100%);
  }
  .grad-lbl { display:flex; justify-content:space-between; margin-top:2px; color:#888; }
</style>
</head>
<body>

<div class="app" id="app">

  <aside class="lb">
    <div class="lb-header">
      <div class="f1">F1<span> RACE</span></div>
      <div class="lb-lap" id="lbLap">LAP —/—</div>
    </div>

    <div class="lb-mode" id="lbMode">
      <button data-mode="gap"      class="on">GAP</button>
      <button data-mode="last">LAST</button>
      <button data-mode="best">BEST</button>
      <button data-mode="interval">INT</button>
    </div>

    <div class="lb-body" id="lbBody">
      <div style="text-align:center;padding:30px 10px;color:#666;font-size:11px">
        Aguardando sessão...
      </div>
    </div>
  </aside>

  <main class="map-container">
    <button class="toggle-lb" id="btnToggleLb">Mostrar tower</button>
    <canvas id="mapa"></canvas>

    <div class="bar">
      <span class="pill" id="pistaNome">—</span>

      <label>Tema
        <select id="selTema">
          <option value="broadcast">Broadcast</option>
          <option value="neon">Neon</option>
          <option value="clean">Clean</option>
          <option value="retro">Retrô</option>
        </select>
      </label>

      <label>Modo
        <select id="selModo">
          <option value="tracado">Traçado</option>
          <option value="radar">Radar</option>
          <option value="heatmap">Heatmap</option>
        </select>
      </label>

      <button id="btnReset">Reset</button>
      <button id="btnLimpar">Limpar</button>
      <button id="btnOcultar">Ocultar tower</button>

      <span class="info" id="infoRodape">aguardando…</span>
    </div>

    <div class="legenda" id="legenda">
      Velocidade (km/h)
      <div class="grad"></div>
      <div class="grad-lbl"><span>0</span><span>175</span><span>350</span></div>
    </div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('mapa');
const ctx    = canvas.getContext('2d');

const state = {
  tema:      'broadcast',
  modo:      'tracado',
  lbMode:    'gap',
  escala:    1,
  offsetX:   0,
  offsetY:   0,
  pista:     null,
  tracado:   [],   // array de segmentos: [ [{x,z,speed},...], [...] ]
  ultimoLid: null,
  pilotos:   [],
  sessao:    {},
};

/* filtros do rastro */
const RASTRO_MIN = 0.5;       // metros — menor ignora
const RASTRO_MAX = 40;        // metros — maior = salto/teleport
const PONTOS_POR_SEGMENTO = 5000;
const LS_KEY = "f1_track_layouts_v1";

/* ═══════════════════════════════════════════════════════════════
   TEMAS
   ═══════════════════════════════════════════════════════════════ */
const TEMAS = {
  broadcast: { bg:'#0a0a0a', rastro:'rgba(255,255,255,.15)', linha:'#ff6b00',
               carroBorda:'#000', grade:'rgba(255,255,255,.03)' },
  neon:      { bg:'#0a001a', rastro:'rgba(0,255,240,.12)',  linha:'#00fff0',
               carroBorda:'#ff00e6', grade:'rgba(0,255,240,.04)' },
  clean:     { bg:'#f5f5f5', rastro:'rgba(0,0,0,.08)',      linha:'#333',
               carroBorda:'#fff', grade:'rgba(0,0,0,.03)' },
  retro:     { bg:'#001a00', rastro:'rgba(0,255,65,.2)',    linha:'#00ff41',
               carroBorda:'#000', grade:'rgba(0,255,65,.05)' },
};

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
const TEAM_FALLBACK = {
  'mercedes':'#27F4D2','ferrari':'#E8002D','red bull':'#3671C6',
  'mclaren':'#FF8000','aston martin':'#229971','alpine':'#FF87BC',
  'williams':'#64C4FF','rb':'#6692FF','racing bulls':'#6692FF',
  'sauber':'#52E252','haas':'#B6BABD','alphatauri':'#6692FF',
  'alfa romeo':'#C92D4B',
};
function teamColor(nome, corApi) {
  if (corApi && corApi !== '#FFFFFF' && corApi !== '#666666') return corApi;
  const k = String(nome||'').toLowerCase().trim();
  for (const [team, color] of Object.entries(TEAM_FALLBACK)) {
    if (k.includes(team)) return color;
  }
  return '#888888';
}
function shortCode(nome) {
  if (!nome) return '???';
  const p = nome.trim().split(/\s+/);
  const base = p.length > 1 ? p[p.length - 1] : p[0];
  return base.substring(0, 3).toUpperCase();
}
function tyreLetter(tyre) {
  const n = String(tyre || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  if (n.includes("SUPER")) return 'SS';
  if (n.includes("MACIO") || n.includes("SOFT")) return 'S';
  if (n.includes("MEDIO") || n.includes("MEDIUM")) return 'M';
  if (n.includes("DURO")  || n.includes("HARD")) return 'H';
  if (n.includes("INTER")) return 'I';
  if (n.includes("MOLH") || n.includes("WET") || n.includes("CHUVA")) return 'W';
  return 'M';
}
/* formata tempo: <60s → "0.563", ≥60s → "1:23.456" */
function fmtTempo(t) {
  if (t == null || t === 0) return "—";
  const n = Number(t);
  if (!isFinite(n)) return "—";
  if (n < 60) return n.toFixed(3);
  const min = Math.floor(n / 60);
  const sec = n - min * 60;
  return min + ":" + sec.toFixed(3).padStart(6, "0");
}
function fmtGap(g) {
  if (g == null) return "—";
  if (g === 0)   return "Leader";
  return "+" + fmtTempo(g);
}

/* ═══════════════════════════════════════════════════════════════
   LOCALSTORAGE — layouts de pista
   ═══════════════════════════════════════════════════════════════ */
function ls_load(track) {
  if (!track) return [];
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    const t = all[track];
    if (!Array.isArray(t)) return [];
    // garante formato: array de arrays de {x,z,speed}
    return t.filter(seg => Array.isArray(seg) && seg.length > 0);
  } catch (e) {
    console.warn("ls_load falhou:", e);
    return [];
  }
}
function ls_save(track, segmentos) {
  if (!track) return;
  try {
    // se ficou muito grande, mantém só os 2 últimos segmentos
    const total = segmentos.reduce((a, s) => a + s.length, 0);
    let dados = segmentos;
    if (total > 20000) dados = segmentos.slice(-2);
    const all = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    all[track] = dados;
    localStorage.setItem(LS_KEY, JSON.stringify(all));
  } catch (e) {
    console.warn("ls_save falhou (localStorage cheio?):", e);
  }
}
function ls_clear(track) {
  if (!track) return;
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    delete all[track];
    localStorage.setItem(LS_KEY, JSON.stringify(all));
  } catch {}
}

/* adiciona um ponto ao rastro, criando segmento novo se der salto */
function push_ponto(x, z, speed) {
  const segs = state.tracado;
  if (!segs.length) segs.push([]);
  const seg = segs[segs.length - 1];

  if (seg.length === 0) {
    seg.push({ x, z, speed });
    return;
  }

  const last = seg[seg.length - 1];
  const d = Math.hypot(x - last.x, z - last.z);

  if (d < RASTRO_MIN) return;             // movimento residual → ignora
  if (d > RASTRO_MAX) {                   // salto → novo segmento
    if (segs.length >= 2 && seg.length < 5) {
      segs.pop();                          // descarta segmento curto (outlier)
    }
    segs.push([{ x, z, speed }]);
  } else {
    seg.push({ x, z, speed });
    if (seg.length > PONTOS_POR_SEGMENTO) {
      segs.push(seg.slice(-1000));         // corta e começa novo
    }
  }
  if (segs.length > 10) segs.shift();      // não deixa lixo infinito
}

/* ═══════════════════════════════════════════════════════════════
   RESIZE
   ═══════════════════════════════════════════════════════════════ */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width  = r.width  * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
window.addEventListener('load', resize);

/* ═══════════════════════════════════════════════════════════════
   TRANSFORMAÇÃO MUNDO → TELA
   ═══════════════════════════════════════════════════════════════ */
function allTrailPoints() {
  const out = [];
  for (const seg of state.tracado) for (const p of seg) out.push(p);
  return out;
}
function calcBounds(pontos) {
  let minX=+Infinity, maxX=-Infinity, minZ=+Infinity, maxZ=-Infinity;
  for (const p of pontos) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.z < minZ) minZ = p.z;
    if (p.z > maxZ) maxZ = p.z;
  }
  return { minX, maxX, minZ, maxZ };
}
function worldToScreen(x, z, b, margin = 80) {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const spanX = (b.maxX - b.minX) || 1;
  const spanZ = (b.maxZ - b.minZ) || 1;
  const sx = (x - b.minX) / spanX;
  const sy = (z - b.minZ) / spanZ;
  const baseX = margin + sx * (W - 2*margin);
  const baseY = margin + sy * (H - 2*margin);
  return [ state.offsetX + baseX * state.escala,
           state.offsetY + baseY * state.escala ];
}

/* ═══════════════════════════════════════════════════════════════
   HEATMAP
   ═══════════════════════════════════════════════════════════════ */
function corVelocidade(v) {
  const t = Math.min(1, Math.max(0, v / 350));
  const stops = [
    [0.00, [  0,  26, 102]], [0.25, [  0, 200, 255]],
    [0.50, [  0, 255,  65]], [0.75, [255, 212,   0]],
    [1.00, [255,  32,  32]],
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0,c0] = stops[i];
    const [t1,c1] = stops[i+1];
    if (t >= t0 && t <= t1) {
      const k = (t - t0) / (t1 - t0);
      return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*k)},`+
             `${Math.round(c0[1]+(c1[1]-c0[1])*k)},`+
             `${Math.round(c0[2]+(c1[2]-c0[2])*k)})`;
    }
  }
  return '#fff';
}

/* ═══════════════════════════════════════════════════════════════
   DESENHO
   ═══════════════════════════════════════════════════════════════ */
function draw() {
  const t = TEMAS[state.tema];
  const W = canvas.clientWidth, H = canvas.clientHeight;

  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, W, H);

  // grade
  ctx.strokeStyle = t.grade; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const trail = allTrailPoints();
  if (!state.pilotos.length && !trail.length) return;

  const b = calcBounds([...trail, ...state.pilotos]);

  // ── MODO TRAÇADO ────────────────────────────────────────
  if (state.modo === 'tracado') {
    // asfalto (cinza grosso)
    ctx.strokeStyle = t.rastro;
    ctx.lineWidth = 16 * state.escala;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const seg of state.tracado) {
      if (seg.length < 2) continue;
      ctx.beginPath();
      seg.forEach((p, i) => {
        const [sx, sy] = worldToScreen(p.x, p.z, b);
        i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      });
      ctx.stroke();
    }
    // linha central
    ctx.strokeStyle = t.linha;
    ctx.lineWidth = 2 * state.escala;
    for (const seg of state.tracado) {
      if (seg.length < 2) continue;
      ctx.beginPath();
      seg.forEach((p, i) => {
        const [sx, sy] = worldToScreen(p.x, p.z, b);
        i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      });
      ctx.stroke();
    }
  }

  // ── MODO HEATMAP ────────────────────────────────────────
  if (state.modo === 'heatmap') {
    ctx.lineWidth = 14 * state.escala;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const seg of state.tracado) {
      for (let i = 1; i < seg.length; i++) {
        const a = seg[i-1], c = seg[i];
        const [x1,y1] = worldToScreen(a.x, a.z, b);
        const [x2,y2] = worldToScreen(c.x, c.z, b);
        ctx.beginPath();
        ctx.strokeStyle = corVelocidade(((a.speed||0)+(c.speed||0))/2);
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      }
    }
  }

  // ── PILOTOS ─────────────────────────────────────────────
  for (const p of state.pilotos) {
    const [sx, sy] = worldToScreen(p.x, p.z, b);
    const corCarro = state.modo === 'heatmap'
      ? corVelocidade(p.speed || 0)
      : teamColor(p.equipe, p.cor);

    ctx.beginPath();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.arc(sx, sy + 2, 10 * Math.min(2, state.escala), 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = corCarro;
    ctx.arc(sx, sy, 9 * Math.min(2, state.escala), 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = t.carroBorda; ctx.stroke();

    if (p.posicao === 1) {
      ctx.beginPath();
      ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2;
      ctx.arc(sx, sy, 13 * Math.min(2, state.escala), 0, Math.PI*2);
      ctx.stroke();
    }

    if (state.modo !== 'radar') {
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(10 * Math.min(2, state.escala))}px 'Segoe UI'`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.numero ?? '', sx, sy);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   LEADERBOARD
   ═══════════════════════════════════════════════════════════════ */
function renderLeaderboard(pilotos, sessao) {
  const body = document.getElementById('lbBody');
  const lapEl = document.getElementById('lbLap');

  const total = sessao.total_voltas || 0;
  const atual = sessao.volta_atual || 0;
  lapEl.textContent = (total || atual) ? `LAP ${atual} / ${total || '?'}` : 'LIVE';

  if (!pilotos.length) {
    body.innerHTML = `<div style="text-align:center;padding:30px 10px;color:#666;font-size:11px">
      Aguardando sessão...
    </div>`;
    return;
  }

  const ordered = [...pilotos].sort((a, b) =>
    (a.posicao ?? 999) - (b.posicao ?? 999));

  function renderValor(p, idx) {
    switch (state.lbMode) {
      case 'last': {
        const v = fmtTempo(p.last_lap);
        return { txt: v, cls: v === '—' ? 'dim' : '' };
      }
      case 'best': {
        const v = fmtTempo(p.best_lap);
        const isSB = idx === 0 && p.best_lap;
        return { txt: v, cls: isSB ? 'purple' : (v === '—' ? 'dim' : '') };
      }
      case 'interval': {
        if (idx === 0) return { txt: '—', cls: 'dim' };
        const v = p.interval;
        return { txt: v != null ? '+' + fmtTempo(v) : '—', cls: v == null ? 'dim' : '' };
      }
      case 'gap':
      default: {
        if (p.gap === 0)  return { txt: 'Leader', cls: 'yellow' };
        if (p.gap != null) return { txt: '+' + fmtTempo(p.gap), cls: '' };
        return { txt: '—', cls: 'dim' };
      }
    }
  }

  body.innerHTML = ordered.map((p, i) => {
    const cor  = teamColor(p.equipe, p.cor);
    const code = shortCode(p.nome);
    const val  = renderValor(p, i);
    const letra = tyreLetter(p.tyre);

    return `
      <div class="lb-row${p.is_pit ? ' pit':''}"
           style="border-left-color:${cor}">
        <span class="lb-pos">${p.posicao ?? i+1}</span>
        <span class="lb-bar" style="background:${cor}"></span>
        <span class="lb-code">${code}</span>
        <span class="lb-val ${val.cls}">${val.txt}</span>
        <span class="lb-tyre ${letra}">${letra}</span>
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════
   ZOOM / PAN
   ═══════════════════════════════════════════════════════════════ */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const fator = e.deltaY < 0 ? 1.15 : 0.87;
  const novo  = Math.min(8, Math.max(0.3, state.escala * fator));
  const k     = novo / state.escala;
  const r = canvas.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  state.offsetX = cx - (cx - state.offsetX) * k;
  state.offsetY = cy - (cy - state.offsetY) * k;
  state.escala  = novo;
  draw();
}, { passive:false });

let arrastando = false, ultimoMouse = { x:0, y:0 };
canvas.addEventListener('mousedown', e => {
  arrastando = true;
  ultimoMouse = { x:e.clientX, y:e.clientY };
  canvas.classList.add('arrastando');
});
addEventListener('mouseup', () => {
  arrastando = false;
  canvas.classList.remove('arrastando');
});
addEventListener('mousemove', e => {
  if (!arrastando) return;
  state.offsetX += e.clientX - ultimoMouse.x;
  state.offsetY += e.clientY - ultimoMouse.y;
  ultimoMouse = { x:e.clientX, y:e.clientY };
  draw();
});
canvas.addEventListener('dblclick', resetZoom);
function resetZoom() {
  state.escala = 1; state.offsetX = 0; state.offsetY = 0; draw();
}

/* ═══════════════════════════════════════════════════════════════
   CONTROLES
   ═══════════════════════════════════════════════════════════════ */
document.querySelectorAll('#lbMode button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#lbMode button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    state.lbMode = btn.dataset.mode;
    renderLeaderboard(state.pilotos, state.sessao);
  };
});

document.getElementById('selTema').onchange = e => { state.tema = e.target.value; draw(); };
document.getElementById('selModo').onchange = e => {
  state.modo = e.target.value;
  document.getElementById('legenda').classList.toggle('on', state.modo === 'heatmap');
  draw();
};
document.getElementById('btnReset').onclick  = resetZoom;
document.getElementById('btnLimpar').onclick = () => {
  state.tracado = [];
  state.ultimoLid = null;
  if (state.pista) ls_clear(state.pista);
  draw();
};
document.getElementById('btnOcultar').onclick = () => {
  document.getElementById('app').classList.add('sem-lb');
  setTimeout(resize, 50);
};
document.getElementById('btnToggleLb').onclick = () => {
  document.getElementById('app').classList.remove('sem-lb');
  setTimeout(resize, 50);
};

/* ═══════════════════════════════════════════════════════════════
   LOOP
   ═══════════════════════════════════════════════════════════════ */
let pontosDesdeSave = 0;

async function tick() {
  try {
    const r = await fetch('/api/mapa_posicoes', { cache:'no-store' });
    if (!r.ok) return;
    const data = await r.json();

    // trocou de pista → carrega traçado salvo
    if (data.track !== state.pista) {
      state.pista = data.track;
      state.tracado = ls_load(data.track);
      state.ultimoLid = null;
      pontosDesdeSave = 0;
      document.getElementById('pistaNome').textContent =
        (data.track || '—').toUpperCase();
      const total = state.tracado.reduce((a, s) => a + s.length, 0);
      console.log(`[mapa] pista "${data.track}" — ${total} pontos salvos carregados`);
    }

    state.pilotos = data.pilotos || [];
    state.sessao  = data.sessao  || {};
    renderLeaderboard(state.pilotos, state.sessao);

    // ponto no rastro — só do líder e só se NÃO estiver no pit
    const lider = state.pilotos.find(p => p.posicao === 1 && !p.is_pit);
    if (lider) {
      const antes = state.tracado.reduce((a, s) => a + s.length, 0);
      push_ponto(lider.x, lider.z, lider.speed || 0);
      const depois = state.tracado.reduce((a, s) => a + s.length, 0);

      if (depois > antes) {
        pontosDesdeSave += (depois - antes);
        if (pontosDesdeSave >= 20) {           // salva a cada 20 pontos novos
          ls_save(state.pista, state.tracado);
          pontosDesdeSave = 0;
        }
      }
    }

    const totalPts = state.tracado.reduce((a, s) => a + s.length, 0);
    document.getElementById('infoRodape').textContent =
      `${state.pilotos.length} pilotos • ${totalPts} pts • ${state.tracado.length} seg • zoom ${state.escala.toFixed(2)}×`;

    draw();
  } catch (e) { console.error('mapa:', e); }
}

setInterval(tick, 100);
tick();
</script>
